    function cleanAnswerMap(source) {
      if (!source || typeof source !== "object" || Array.isArray(source)) return {};
      return Object.fromEntries(Object.entries(source).flatMap(([id, value]) => {
        if (typeof value === "number") return Number.isFinite(value) ? [[id, Math.max(1, Math.min(10, Math.round(value)))]] : [];
        if (typeof value === "string") return [[id, value.slice(0, 600)]];
        return [];
      }));
    }

    // Stored and imported data is user-editable: keep only known rating values and plain, bounded text.
    function cleanRatings(source) {
      const allowed = ["aligned", "nuanced", "discuss", "different"];
      if (!source || typeof source !== "object") return {};
      return Object.fromEntries(Object.entries(source).filter(([id, value]) => /^[\w-]{1,80}$/.test(id) && allowed.includes(value)));
    }

    function cleanTextMaps(source, limit) {
      const pair = Array.isArray(source) ? source : [];
      return [0, 1].map((player) => {
        const map = pair[player] && typeof pair[player] === "object" ? pair[player] : {};
        return Object.fromEntries(Object.entries(map).filter(([id, value]) => /^[\w-]{1,80}$/.test(id) && typeof value === "string").map(([id, value]) => [id, value.slice(0, limit)]));
      });
    }

    function cleanImportanceMaps(source) {
      const pair = Array.isArray(source) ? source : [];
      return [0, 1].map((player) => {
        const map = pair[player] && typeof pair[player] === "object" ? pair[player] : {};
        return Object.fromEntries(Object.entries(map).filter(([id, value]) => /^[\w-]{1,80}$/.test(id) && [0, 1, 2].includes(Number(value))).map(([id, value]) => [id, Number(value)]));
      });
    }

    function sanitizeCompletedRounds(rounds, validIds) {
      if (!Array.isArray(rounds)) return [];
      return rounds
        .filter((round) => round && typeof round === "object")
        .map((round, roundIndex) => {
          const questionIds = Array.isArray(round.questionIds)
            ? [...new Set(round.questionIds.filter((id) => validIds.has(id)))]
            : [];
          const answers = Array.isArray(round.answers)
            ? [cleanAnswerMap(round.answers[0]), cleanAnswerMap(round.answers[1])]
            : [{}, {}];
          const comments = Array.isArray(round.comments)
            ? [round.comments[0] || {}, round.comments[1] || {}]
            : [{}, {}];
          const topics = Array.isArray(round.alignment?.topics)
            ? round.alignment.topics
                .filter((item) => item && typeof item === "object")
                .map((item) => ({
                  topic: String(item.topic || ""),
                  score: Math.max(0, Math.min(100, Math.round(Number(item.score) || 0))),
                  fitScore: Math.max(0, Math.min(100, Math.round(Number(item.fitScore ?? item.score) || 0))),
                  count: Math.max(0, Math.round(Number(item.count) || 0))
                }))
            : [];
          return {
            id: /^[\w-]{1,80}$/.test(String(round.id || "")) ? String(round.id) : `round_restored_${roundIndex}`,
            completedAt: String(round.completedAt || new Date(0).toISOString()),
            names: Array.isArray(round.names)
              ? [String(round.names[0] || "Player 1").slice(0, 40), String(round.names[1] || "Player 2").slice(0, 40)]
              : ["Player 1", "Player 2"],
            questionIds,
            answers,
            comments: cleanTextMaps(comments, 400),

        <p class="offline-ready" id="offline-ready" role="status"></p>
        ${installButton || updateButton ? `<div class="actions" style="margin-top:0">${!IN_ANDROID_APP && !IS_OFFLINE_FILE && !isStandalone() && current !== "ios" ? installButton : ""}${updateButton}</div>` : ""}
        <p class="topic-note" id="install-status" role="status"></p>
        ${IN_ANDROID_APP ? "" : `<div class="platform-list">${ordered.map((row, index) => `
          <details class="platform-row" ${index === 0 ? "open" : ""}>
            <summary>${row.title}${row.id === current ? ' <span class="platform-badge">This device</span>' : ""}</summary>
            <p>${row.copy}</p>
            ${row.actions ? `<div class="actions">${row.actions}</div>` : ""}
          </details>`).join("")}</div>`}`;
    }

    async function updateOfflineReadiness() {
      const line = document.getElementById("offline-ready");
      if (!line) return;
      const ready = (text) => { line.innerHTML = `<span aria-hidden="true">✓</span> ${text}`; line.classList.add("ready"); enforceCompactFloor(); };
      if (IN_ANDROID_APP || IS_OFFLINE_FILE) return ready("Ready to play offline on this device.");
      const registration = await navigator.serviceWorker?.getRegistration?.().catch(() => null);
      if (registration?.active) ready("Ready to play offline on this device.");
      else if (!("serviceWorker" in navigator)) line.textContent = "This window can’t store the game for offline use (private browsing?). Install the app or download the offline copy instead.";
      else line.textContent = "Offline mode finishes setting up after this page has loaded once with internet.";
      enforceCompactFloor();
    }

    function pairingJoinURL(roomId, joinToken) {
      const base = /^https?:$/.test(location.protocol) ? location.href.split("#")[0] : PUBLIC_APP_URL;
      return `${base}#join=${encodeURIComponent(`${roomId}.${joinToken}`)}`;
    }

    function renderPairingQR(value, accessibleLabel) {
      try {
        if (typeof qrcode !== "function") throw new Error("QR generator unavailable");
        const code = qrcode(0, "L");
        code.addData(value);
        code.make();
        return `<div class="qr-code-shell">${code.createSvgTag({ cellSize: 4, margin: 12, scalable: true, title: accessibleLabel, alt: accessibleLabel })}</div>`;
      } catch {
        return '<div class="qr-unavailable">This connection code is too large for a reliable QR image. Use Share or Copy link below instead.</div>';
      }
    }

    async function signalingRequest(path, options = {}) {
      let endpoint;
      try { endpoint = new URL(SIGNALING_SERVICE_URL); } catch { throw new Error("The connection service is not configured yet."); }
      const secureEndpoint = endpoint.protocol === "https:" || (location.protocol === "http:" && endpoint.hostname === location.hostname);
      if (!secureEndpoint) throw new Error("The connection service is not configured securely.");
      let response;
      try {
        response = await fetch(`${SIGNALING_SERVICE_URL}${path}`, {
          ...options,
          headers: { "content-type": "application/json", ...(options.headers || {}) }
        });
      } catch {
        throw Object.assign(new Error(navigator.onLine === false ? "You're offline. Two-phone play needs an internet connection; one-device play works offline." : "The connection service couldn't be reached. Check your internet connection and try again."), { reason: "offline" });
      }
      let payload = {};
      try { payload = await response.json(); } catch {}
      if (!response.ok) {
        const reason = response.status === 410 ? "expired" : response.status === 403 ? "invalid" : response.status === 429 ? "busy" : "service";
        const message = {
          expired: "This QR is no longer active — your partner may have cancelled it, or it timed out. Ask for a new QR.",
          invalid: "This join link isn't valid. Ask your partner to show a fresh QR.",
          busy: "Too many rooms were created just now. Wait a minute and try again.",
          service: payload.error || "The connection service is unavailable right now. Try again in a moment."
        }[reason];
        throw Object.assign(new Error(message), { reason });
      }
      return payload;
    }

    function saveNearbySession() {
      if (!nearbyRuntime.role || !nearbyRuntime.roomId) return;
      try {
        localStorage.setItem(NEARBY_SESSION_KEY, JSON.stringify({
          role: nearbyRuntime.role,
          roomId: nearbyRuntime.roomId,
          token: nearbyRuntime.role === "host" ? nearbyRuntime.hostToken : nearbyRuntime.joinToken,
          joinToken: nearbyRuntime.joinToken,
          expiresAt: nearbyRuntime.expiresAt,
          roundStarted: nearbyRuntime.roundStarted,
          iceServers: nearbyIceServers
        }));
      } catch {}
    }

    function clearNearbySession() {
      try { localStorage.removeItem(NEARBY_SESSION_KEY); } catch {}
    }

    function loadNearbySession() {
      try {
        const session = JSON.parse(localStorage.getItem(NEARBY_SESSION_KEY) || "null");
        const valid = session
          && ["host", "join"].includes(session.role)
          && /^[A-Za-z0-9_-]{16,40}$/.test(session.roomId || "")
          && /^[A-Za-z0-9_-]{32,80}$/.test(session.token || "")
          && Number(session.expiresAt) > Date.now();
        if (!valid) {
          clearNearbySession();
          return null;
        }
        return session;
      } catch {
        return null;
      }
    }

    // A random, device-local id lets the pairing service tell a reconnecting phone from a different phone.
    function nearbyDeviceId() {
      try {
        let id = localStorage.getItem("aligned-device-id");
        if (!/^[A-Za-z0-9_-]{16,64}$/.test(id || "")) {
          id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte) => byte.toString(16).padStart(2, "0")).join("");
          localStorage.setItem("aligned-device-id", id);
        }
        return id;
      } catch {
        return "";
      }
    }

    function nearbyChannelOpen() {
      return nearbyDataChannel?.readyState === "open" && !nearbyDataChannel.__lost;
    }

    let nearbyPeerLostTimer = 0;

    function handleNearbyChannelLost(channel) {
      if (!channel || channel.__lost || channel.__manualClose || nearbyDataChannel !== channel) return;
      channel.__lost = true;
      clearInterval(nearbyPeerWatchTimer);
      setNearbyStatus("reconnecting");
      updateNearbyBanner();
      clearTimeout(nearbyPeerLostTimer);
      nearbyPeerLostTimer = window.setTimeout(() => {
        if (!nearbyChannelOpen() && nearbyRuntime.role && ["reconnecting", "waiting-host", "room-ready", "connecting"].includes(nearbyRuntime.status)) setNearbyStatus("peer-lost");
      }, 25000);
      if (nearbyRuntime.role === "host") {
        window.setTimeout(() => {
          if (nearbyDataChannel === channel && nearbySignalingSocket?.readyState === WebSocket.OPEN) negotiateNearbyHost();
        }, 800);
      }
    }

    function nearbyRoomExpired() {
      return Boolean(nearbyRuntime.expiresAt) && Date.now() >= nearbyRuntime.expiresAt;
    }

    function refreshNearbyScreen() {
      if (state.screen === "nearby" || state.screen === "nearby-wait") render();
    }

    function setNearbyStatus(status, errorReason = "") {
      nearbyRuntime.status = status;
      nearbyRuntime.errorReason = errorReason;
      clearTimeout(nearbyHostWaitTimer);
      if (status === "connecting") {
        if (!nearbyConnectTimer) {
          nearbyConnectTimer = window.setTimeout(() => {
            nearbyConnectTimer = 0;
            if (!nearbyChannelOpen() && nearbyRuntime.status === "connecting") setNearbyStatus("blocked");
          }, NEARBY_CONNECT_TIMEOUT_MS);
        }
      } else {
        clearTimeout(nearbyConnectTimer);
        nearbyConnectTimer = 0;
      }
      updateNearbyBanner();
      if (status === "waiting-host") {
        nearbyHostWaitTimer = window.setTimeout(() => {
          if (nearbyRuntime.status === "waiting-host") setNearbyStatus("host-missing");
        }, NEARBY_HOST_WAIT_MS);
      }
      refreshNearbyScreen();
    }

    function sendNearbySignal(payload) {
      if (nearbySignalingSocket?.readyState !== WebSocket.OPEN) return false;
      try {
        nearbySignalingSocket.send(JSON.stringify(payload));
        return true;
      } catch {
        return false;
      }
    }

    async function addNearbyCandidate(candidate) {
      if (!candidate) return;
      if (!nearbyPeerConnection?.remoteDescription) {
        nearbyPendingCandidates.push(candidate);
        return;
      }
      try { await nearbyPeerConnection.addIceCandidate(candidate); } catch {}
    }

    async function flushNearbyCandidates() {
      const candidates = nearbyPendingCandidates.splice(0);
      for (const candidate of candidates) {
        try { await nearbyPeerConnection?.addIceCandidate(candidate); } catch {}
      }
    }

    // Every negotiation starts from a fresh peer on both phones, so a reloaded or restarted phone never
    // has to reconcile with a stale connection.
    async function negotiateNearbyHost() {
      if (nearbyRuntime.role !== "host" || nearbyRuntime.negotiating) return;
      nearbyRuntime.negotiating = true;
      try {
        const peer = createNearbyPeer();
        attachNearbyChannel(peer.createDataChannel("how-well-align-local", { ordered: true }));
        setNearbyStatus("connecting");
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        sendNearbySignal({ type: "offer", description: peer.localDescription });
      } catch {
        setNearbyStatus("blocked");
      } finally {
        nearbyRuntime.negotiating = false;
      }
    }

    async function acceptNearbyOffer(description) {
      if (nearbyRuntime.role !== "join") return;
      try {
        const peer = createNearbyPeer();
        peer.addEventListener("datachannel", (event) => attachNearbyChannel(event.channel));
        setNearbyStatus("connecting");
        await peer.setRemoteDescription(description);
        await flushNearbyCandidates();
        await peer.setLocalDescription(await peer.createAnswer());
        sendNearbySignal({ type: "answer", description: peer.localDescription });
      } catch {
        setNearbyStatus("blocked");
      }
    }

    async function handleNearbySignal(payload) {
      if (payload.type === "socket-ready") {
        nearbyRuntime.reconnectAttempts = 0;
        if (Number(payload.expiresAt) > Date.now()) {
          nearbyRuntime.expiresAt = Number(payload.expiresAt);
          saveNearbySession();
        }
        if (nearbyChannelOpen()) setNearbyStatus("connected");
        else setNearbyStatus(nearbyRuntime.role === "host" ? "room-ready" : "waiting-host");
      } else if (payload.type === "room-extended" && Number(payload.expiresAt) > Date.now()) {
        nearbyRuntime.expiresAt = Number(payload.expiresAt);
        saveNearbySession();
      } else if (payload.type === "peer-ready") {
        if (nearbyChannelOpen()) return;
        if (nearbyRuntime.role === "host") {
          nearbyNegotiationFailures = 0;
          await negotiateNearbyHost();
        } else if (!["connecting", "blocked"].includes(nearbyRuntime.status)) {
          setNearbyStatus("waiting-host");
        }
      } else if (payload.type === "peer-waiting") {
        if (nearbyChannelOpen()) return;
        setNearbyStatus(nearbyRuntime.role === "host" ? "room-ready" : "waiting-host");
      } else if (payload.type === "offer") {
        await acceptNearbyOffer(payload.description);
      } else if (payload.type === "answer" && nearbyRuntime.role === "host") {
        try {
          await nearbyPeerConnection?.setRemoteDescription(payload.description);
          await flushNearbyCandidates();
        } catch {}
      } else if (payload.type === "candidate") {
        await addNearbyCandidate(payload.candidate);
      } else if (payload.type === "leave" && !nearbyChannelOpen()) {
        const role = nearbyRuntime.role;
        closeNearbyConnection();
        nearbyRuntime.role = role;
        setNearbyStatus("partner-cancelled");
      }
    }

    function connectNearbySignaling(role, roomId, token) {
      return new Promise((resolve, reject) => {
        const socketURL = new URL(`${SIGNALING_SERVICE_URL}/api/rooms/${encodeURIComponent(roomId)}/socket`);
        socketURL.protocol = socketURL.protocol === "https:" ? "wss:" : "ws:";
        socketURL.searchParams.set("role", role);
        socketURL.searchParams.set("token", token);
        socketURL.searchParams.set("device", nearbyDeviceId());
        if (nearbySignalingSocket) {
          nearbySignalingSocket.__manualClose = true;
          try { nearbySignalingSocket.close(); } catch {}
        }
        const socket = new WebSocket(socketURL);
        nearbySignalingSocket = socket;
        const openTimeout = window.setTimeout(() => {
          try { socket.close(); } catch {}
          reject(new Error("The connection service took too long to respond."));
        }, 12000);
        socket.addEventListener("open", () => {
          socket.__opened = true;
          nearbyFailedReconnects = 0;
          clearTimeout(openTimeout);
          clearInterval(nearbyHeartbeatTimer);
          nearbyHeartbeatTimer = window.setInterval(() => sendNearbySignal({ type: "ping" }), 20000);
          resolve();
        }, { once: true });
        socket.addEventListener("message", (event) => {
          let payload;
          try { payload = JSON.parse(event.data); } catch { return; }
          handleNearbySignal(payload);
        });
        socket.addEventListener("error", () => {
          if (socket.readyState !== WebSocket.OPEN) reject(new Error("The connection service could not be reached."));
        }, { once: true });
        socket.addEventListener("close", (event) => {
          clearTimeout(openTimeout);
          if (socket !== nearbySignalingSocket) return;
          clearInterval(nearbyHeartbeatTimer);
          if (socket.__manualClose) return;
          nearbySignalingSocket = null;
          const channelOpen = nearbyChannelOpen();
          if (event.code === 4001) {
            // This phone opened the round in another tab or window, which now holds the connection.
            nearbyRuntime.otherTab = true;
            setNearbyStatus("other-tab");
            return;
          }
          if (event.code === 4009) {
            // A different phone opened the same link; never fight over the room.
            if (!channelOpen) setNearbyStatus("in-use");
            return;
          }
          if (event.code === 4000 || nearbyRoomExpired()) {
            clearNearbySession();
            if (!channelOpen) setNearbyStatus("expired");
            return;
          }
          if (!channelOpen) setNearbyStatus("reconnecting");
          nearbyFailedReconnects = socket.__opened ? 0 : nearbyFailedReconnects + 1;
          if (nearbyFailedReconnects >= 8 && !channelOpen) {
            // About a minute of refused connections: the room is gone even if its expiry time hasn't passed.
            nearbyFailedReconnects = 0;
            clearNearbySession();
            setNearbyStatus("expired");
            return;
          }
          const attempt = Math.min(nearbyRuntime.reconnectAttempts + 1, 6);
          nearbyRuntime.reconnectAttempts = attempt;
          clearTimeout(nearbyReconnectTimer);
          nearbyReconnectTimer = window.setTimeout(() => {
            if (nearbyRuntime.roomId !== roomId) return;
            connectNearbySignaling(role, roomId, token).catch(() => {});
          }, Math.min(8000, 600 * 2 ** attempt));
        });
      });
    }

    function closeNearbyConnection({ notifyPartner = false, forgetSession = true, reason = "" } = {}) {
      const leave = reason ? { type: "leave", reason } : { type: "leave" };
      if (notifyPartner && nearbyChannelOpen()) {
        try { nearbyDataChannel.send(JSON.stringify(leave)); } catch {}
      } else if (notifyPartner) {
        sendNearbySignal(leave);
      }
      clearInterval(nearbyHeartbeatTimer);
      clearInterval(nearbyPeerWatchTimer);
      clearTimeout(nearbyPeerLostTimer);
      clearTimeout(nearbyReconnectTimer);
      clearTimeout(nearbyAutoStartTimer);
      clearTimeout(nearbyConnectTimer);
      clearTimeout(nearbyHostWaitTimer);
      nearbyConnectTimer = 0;
      if (nearbySignalingSocket) {
        nearbySignalingSocket.__manualClose = true;
        try { nearbySignalingSocket.close(); } catch {}
      }
      if (nearbyDataChannel) {
        nearbyDataChannel.__manualClose = true;
        try { nearbyDataChannel.close(); } catch {}
      }
      try { nearbyPeerConnection?.close(); } catch {}
      nearbySignalingSocket = null;
      nearbyDataChannel = null;
      nearbyPeerConnection = null;
      nearbyIceServers = [];
      nearbyPendingCandidates = [];
      nearbyOutbox = [];
      nearbyNegotiationFailures = 0;
      nearbyRuntime = freshNearbyRuntime();
      if (forgetSession) clearNearbySession();
    }

    // Messages that cannot be delivered right now are queued and sent as soon as the phones reconnect.
    // Only the newest message of each kind (per question) is kept, so a long outage never replays stale state.
    function sendNearbyMessage(payload, { queue = true } = {}) {
      if (nearbyChannelOpen()) {
        try {
          nearbyDataChannel.send(JSON.stringify(payload));
          return true;
        } catch {}
      }
      if (queue) {
        const key = `${payload.type}:${payload.questionId || payload.change?.id || ""}`;
        nearbyOutbox = [...nearbyOutbox.filter((item) => item.key !== key), { key, payload }].slice(-60);
        if (payload.type === "player-complete") window.setTimeout(updateNearbyBanner, 0);
      }
      return false;
    }

    function flushNearbyOutbox() {
      const pending = nearbyOutbox.splice(0);
      pending.forEach(({ payload }) => sendNearbyMessage(payload));
      updateNearbyBanner();
    }

    const PRESSABLE_SELECTOR = ".rating-option, .follow-through-button, .library-filter:not(.saved-pack-chip), .topic-progress-card, .play-style-card, .preset-card, .importance-option, .feedback-actions .question-library-action";
    function syncPressedStates(root = app) {
      root.querySelectorAll(PRESSABLE_SELECTOR).forEach((button) => {
        const pressed = String(button.classList.contains("active"));
        if (button.getAttribute("aria-pressed") !== pressed) button.setAttribute("aria-pressed", pressed);
      });
    }
    new MutationObserver((mutations) => {
      if (mutations.some((mutation) => mutation.target instanceof Element && mutation.target.matches(PRESSABLE_SELECTOR))) syncPressedStates();
    }).observe(app, { subtree: true, attributes: true, attributeFilter: ["class"] });

    // The joiner's "Play another round" follows the link live instead of waiting for a re-render.
    function updateRevealNewRoundButton() {
      const button = state.screen === "reveal" ? document.getElementById("new-round") : null;
      if (!button || state.playStyle !== "nearby" || state.nearbyRole !== "join") return;
      const waiting = nearbyChannelOpen();
      const host = state.names[0] || "your partner";
      button.disabled = waiting;
      button.style.opacity = waiting ? "0.6" : "";
      button.style.cursor = waiting ? "not-allowed" : "";
      button.textContent = waiting ? `Waiting for ${host} to start…` : "Play another round";
    }

    function updateNearbyBanner() {
      const partner = state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "your partner";
      let message = "";
      let tone = "info";
      let action = "";
      const linkEnded = !nearbyRuntime.role || ["expired", "in-use", "failed", "partner-cancelled", "unsupported", "peer-lost"].includes(nearbyRuntime.status);
      const undelivered = ["celebration", "reveal"].includes(state.screen) && state.completedPlayers?.[nearbyLocalPlayer()] && state.nearbyDelivered !== state.nearbyRoundId;
      if (state.playStyle === "nearby" && state.nearbyRoundId && (undelivered || !nearbyChannelOpen())) {
        if (undelivered && (nearbyChannelOpen() || !linkEnded)) {
          message = `Sending your answers to ${partner}… keep Aligned open until this disappears.`;
          tone = "warning";
        } else if (undelivered && linkEnded && !nearbyRuntime.partnerLeft) {
          message = state.nearbyRole === "join"
            ? `Your answers haven’t reached ${partner} yet — the pairing link closed. Ask ${partner} to tap “Pair again”, then scan the new QR.`
            : `Your answers haven’t reached ${partner} yet — the pairing link closed. Show a new QR to deliver them.`;
          tone = "warning";
          if (state.nearbyRole !== "join") action = '<button class="secondary-btn" type="button" data-nearby-banner-repair>Pair again</button>';
        } else if (nearbyRuntime.status === "other-tab") {
          message = "Aligned is open in another tab or window, which is using the connection to your partner.";
          tone = "warning";
          action = '<button class="secondary-btn" type="button" data-nearby-use-tab>Use this tab</button>';
        } else if (state.screen === "question" && !linkEnded && !nearbyRuntime.partnerLeft) {
          message = `Reconnecting to ${partner}’s phone… keep answering, nothing is lost.`;
        } else if (state.screen === "question" && nearbyRuntime.partnerLeft) {
          message = nearbyRuntime.partnerLeftReason === "kept-own-round"
            ? `${partner} stayed on their own round. Keep answering — ${partner} can answer on this phone at the end.`
            : `${partner} left the two-phone round. Keep answering — ${partner} can answer on this phone at the end.`;
          tone = "warning";
        } else if (state.screen === "question") {
          message = `The link to ${partner}’s phone has ended. Keep answering — you can reconnect or finish on one phone at the end.`;
          tone = "warning";
        } else if (state.screen === "reveal" && !linkEnded && !nearbyRuntime.partnerLeft) {
          message = `${partner}’s phone disconnected — reconnecting… your results are saved here.`;
        } else if (state.screen === "reveal") {
          message = `The link to ${partner}’s phone has ended. Your results are saved on this phone.`;
          tone = "warning";
        }
      }
      updateRevealNewRoundButton();
      let banner = document.getElementById("nearby-banner");
      if (!message) {
        banner?.remove();
        return;
      }
      if (!banner) {
        banner = document.createElement("div");
        banner.id = "nearby-banner";
        banner.setAttribute("role", "status");
      }
      const anchor = state.screen === "question" ? (app.querySelector(".question-screen .progress-constellation") || app.querySelector(".question-screen .progress-track")) : null;
      const screenElement = app.querySelector(".screen");
      if (anchor) {
        if (banner.previousElementSibling !== anchor) anchor.after(banner);
      } else if (screenElement) {
        if (banner.parentElement !== app || app.firstElementChild !== banner) app.prepend(banner);
      } else if (banner.parentElement !== document.body) {
        document.body.appendChild(banner);
      }
      banner.className = `nearby-banner ${anchor || screenElement ? "inline" : ""} ${tone === "warning" ? "warning" : ""}`;
      const signature = message + action;
      if (banner.dataset.signature !== signature) {
        banner.dataset.signature = signature;
        banner.innerHTML = `<span>${escapeHTML(message)}</span>${action}`;
        banner.querySelector("[data-nearby-banner-repair]")?.addEventListener("click", repairNearbyRound);
        banner.querySelector("[data-nearby-use-tab]")?.addEventListener("click", retryNearbyConnection);
      }
    }

    function nearbyPlayerPayload(player = state.activePlayer) {
      return {
        type: "player-complete",
        roundId: state.nearbyRoundId,
        player,
        answers: { ...state.answers[player] },
        guesses: { ...(state.guesses?.[player] || {}) },
        comments: { ...state.comments[player] },
        importance: { ...state.importance[player] },
        notReady: { ...state.notReady[player] }
      };
    }

    function nearbyLocalPlayer() {
      return state.nearbyRole === "join" ? 1 : 0;
    }

    function nearbyRoundInitPayload({ newRound = false } = {}) {
      return {
        type: "round-init", roundId: state.nearbyRoundId, newRound: Boolean(newRound), names: [...state.names], questionMode: state.questionMode,
        questionIntensity: state.questionIntensity, selectedTopics: [...state.selectedTopics],
        sessionPreset: state.sessionPreset, recentHeadlines: Array.isArray(state.recentHeadlines) ? state.recentHeadlines.slice(-5) : [],
        recentPrompts: Array.isArray(state.recentPrompts) ? state.recentPrompts.slice(-400) : [],
        selectedQuestionIds: [...state.selectedQuestionIds], questions: getSelectedQuestions().filter(Boolean)
      };
    }

    function nearbyRoundFinished() {
      return state.completedPlayers?.[0] === true && state.completedPlayers?.[1] === true;
    }

    // Sent on every (re)connection so both phones converge: missing round setup, answers and reveal state are re-sent.
    function syncStamp() {
      const at = Math.max(Date.now(), (Number(state.syncSeenAt) || 0) + 1);
      state.syncSeenAt = at;
      return at;
    }

    function noteRemoteStamp(at) {
      const value = Number(at) || 0;
      if (value > (Number(state.syncSeenAt) || 0)) state.syncSeenAt = value;
    }

    // Newest stamp wins; an exact tie goes to the host. Both phones apply the same rule, so they converge.
    function remoteWins(localAt, remoteAt, hasLocal) {
      const remoteIsHost = state.nearbyRole === "join";
      return !hasLocal || remoteAt > localAt || (remoteAt === localAt && remoteIsHost);
    }

    function acceptRemoteFollowThrough(questionId, status, at) {
      if (!state.selectedQuestionIds.includes(questionId) || !["talk", "ground", "revisit", "intention"].includes(status)) return false;
      if (!state.conversationTimes || typeof state.conversationTimes !== "object") state.conversationTimes = {};
      const remoteAt = Number(at) || 0;
      noteRemoteStamp(remoteAt);
      const localAt = Number(state.conversationTimes[questionId]) || 0;
      if (!remoteWins(localAt, remoteAt, Boolean(state.conversationStatus[questionId]))) {
        if (state.playStyle === "nearby") sendNearbyMessage({ type: "follow-through", roundId: state.nearbyRoundId, questionId, status: state.conversationStatus[questionId], at: localAt });
        return false;
      }
      state.conversationTimes[questionId] = remoteAt;
      if (state.conversationStatus[questionId] === status) return false;
      state.conversationStatus[questionId] = status;
      return true;
    }

    function acceptRemoteIntention(questionId, text, at) {
      if (!state.selectedQuestionIds.includes(questionId) || typeof text !== "string") return false;
      const remoteAt = Number(at) || 0;
      noteRemoteStamp(remoteAt);
      const existing = state.sharedIntentions.find((item) => item.questionId === questionId);
      const field = app.querySelector(`[data-intention-input="${CSS.escape(questionId)}"]`);
      const focused = Boolean(field && field === document.activeElement);
      if (existing && !remoteWins(Number(existing.updatedAt) || 0, remoteAt, Number(existing.updatedAt) > 0 || Boolean(String(existing.text || "").trim()))) {
        if (state.playStyle === "nearby") sendNearbyMessage({ type: "intention-update", roundId: state.nearbyRoundId, questionId, text: existing.text, at: Number(existing.updatedAt) || 0 });
        return false;
      }
      const clean = text.slice(0, 180);
      if (existing) { existing.text = clean; existing.updatedAt = remoteAt; }
      else state.sharedIntentions.push({ id: `intention_${Date.now()}_${randomIndex(10000)}`, questionId, text: clean, createdAt: new Date().toISOString(), completed: false, updatedAt: remoteAt });
      // Someone with the field open keeps what they see; untouched, it shows the partner's text on blur.
      if (field && !focused) field.value = clean;
      if (field && focused) field.dataset.partnerTyping = "1";
      return true;
    }

    function acceptRemoteRating(questionId, rating, at) {
      if (!state.selectedQuestionIds.includes(questionId) || !["aligned", "nuanced", "discuss", "different"].includes(rating)) return false;
      if (!state.textRatingTimes || typeof state.textRatingTimes !== "object") state.textRatingTimes = {};
      const remoteAt = Number(at) || 0;
      noteRemoteStamp(remoteAt);
      const localAt = Number(state.textRatingTimes[questionId]) || 0;
      const wins = remoteWins(localAt, remoteAt, Boolean(state.textRatings[questionId]));
      if (!wins) {
        // Tell the other phone which rating stands, so a rejected change never lingers there.
        if (state.playStyle === "nearby") sendNearbyMessage({ type: "text-rating", roundId: state.nearbyRoundId, questionId, rating: state.textRatings[questionId], at: localAt });
        return false;
      }
      if (state.textRatings[questionId] === rating) {
        state.textRatingTimes[questionId] = remoteAt;
        return false;
      }
      state.textRatings[questionId] = rating;
      state.textRatingTimes[questionId] = remoteAt;
      return true;
    }

    function sendNearbyHello() {
      const localPlayer = nearbyLocalPlayer();
      sendNearbyMessage({ type: "hello", appVersion: APP_VERSION, roundId: state.nearbyRoundId || "", role: nearbyRuntime.role, inRound: ["question", "nearby-wait"].includes(state.screen) && state.playStyle === "nearby" }, { queue: false });
      if (!state.nearbyRoundId || state.playStyle !== "nearby") return;
      if (state.screen === "question") sendNearbyMessage({ type: "progress", roundId: state.nearbyRoundId, answered: state.questionIndex, total: state.selectedQuestionIds.length });
      if (state.screen === "nearby-wait" || (nearbyRoundFinished() && state.completedPlayers?.[localPlayer])) sendNearbyMessage(nearbyPlayerPayload(localPlayer));
      if (["celebration", "reveal"].includes(state.screen)) sendNearbyMessage({ type: "reveal-state", roundId: state.nearbyRoundId, revealedIds: [...state.revealedIds] });
      if (nearbyRoundFinished()) {
        // Catch the partner up on anything sent while the link was down.
        sendNearbyMessage({ type: "reveal-state", roundId: state.nearbyRoundId, seenIds: [...(state.seenIds || []), ...state.revealedIds] }, { queue: false });
        sendNearbyMessage({ type: "rating-sync", roundId: state.nearbyRoundId, ratings: { ...state.textRatings }, times: { ...(state.textRatingTimes || {}) } }, { queue: false });
        sendNearbyMessage({
          type: "board-sync",
          roundId: state.nearbyRoundId,
          follow: { ...state.conversationStatus },
          followTimes: { ...(state.conversationTimes || {}) },
          intentions: state.sharedIntentions.filter((item) => state.selectedQuestionIds.includes(item.questionId)).map((item) => ({ questionId: item.questionId, text: item.text, at: Number(item.updatedAt) || 0 }))
        }, { queue: false });
      }
    }

    let pendingRevealRefresh = false;

    let unlockAnimatingUntil = 0;

    function refreshRevealFromPartner() {
      if (state.screen === "results") { render(); return; }
      if (state.screen === "setup" && ["celebration", "reveal"].includes(state.resumeScreen)) {
        const line = document.querySelector(".resume-card .resume-copy span");
        if (line) line.textContent = resumeRevealCopy();
        return;
      }
      if (state.screen !== "reveal") return;
      // The partner just finished the reveal: a "scores not revealed yet" warning is now false.
      if (!revealUnfinished()) dismissConfirmDialogs("reveal-guard");
      if (Date.now() < unlockAnimatingUntil) {
        pendingRevealRefresh = true;
        window.setTimeout(() => { if (pendingRevealRefresh) refreshRevealFromPartner(); }, unlockAnimatingUntil - Date.now() + 50);
        return;
      }
      const active = document.activeElement;
      if (active && app.contains(active) && active.matches("input, textarea")) {
        // Never rebuild the board under someone who is typing; refresh once they move on.
        pendingRevealRefresh = true;
        if (!active.dataset.refreshDeferred) {
          active.dataset.refreshDeferred = "1";
          active.addEventListener("blur", () => window.setTimeout(() => {
            if (!pendingRevealRefresh) return;
            const now = document.activeElement;
            if (now && app.contains(now) && now.matches("input, textarea")) return;
            refreshRevealFromPartner();
          }, 300), { once: true });
        }
        return;
      }
      pendingRevealRefresh = false;
      const cards = [...app.querySelectorAll(".flip-card[data-question-id]")];
      const anchorCard = cards.find((card) => card.getBoundingClientRect().bottom > 80);
      const anchorId = anchorCard?.dataset.questionId;
      const anchorTop = anchorCard?.getBoundingClientRect().top ?? 0;
      const scrollY = window.scrollY;
      const restore = () => {
        const card = anchorId ? app.querySelector(`.flip-card[data-question-id="${CSS.escape(anchorId)}"]`) : null;
        if (card) window.scrollBy(0, card.getBoundingClientRect().top - anchorTop);
        else window.scrollTo(0, scrollY);
      };
      render();
      restore();
      requestAnimationFrame(() => requestAnimationFrame(restore));
    }

    function finishNearbyRoundIfReady() {
      const remote = state.nearbyRemote;
      if (state.screen !== "nearby-wait" || !remote || remote.roundId !== state.nearbyRoundId) return;
      const player = remote.player === 0 ? 0 : 1;
      if (player === nearbyLocalPlayer()) return;
      const keep = (source) => Object.fromEntries(Object.entries(source && typeof source === "object" ? source : {}).filter(([id]) => state.selectedQuestionIds.includes(id)));
      const catalogById = new Map(getQuestionCatalog().map((question) => [question.id, question]));
      state.answers[player] = Object.fromEntries(Object.entries(cleanAnswerMap(keep(remote.answers))).flatMap(([id, value]) => {
        const question = catalogById.get(id);
        if (question?.type === "slider") {
          const number = Number(value);
          return Number.isFinite(number) ? [[id, Math.max(1, Math.min(10, Math.round(number)))]] : [];
        }
        return typeof value === "string" ? [[id, value]] : [];
      }));
      state.guesses = Array.isArray(state.guesses) ? state.guesses : [{}, {}];
      state.guesses[player] = Object.fromEntries(Object.entries(cleanAnswerMap(keep(remote.guesses))).filter(([, value]) => typeof value === "number"));
      state.comments[player] = Object.fromEntries(Object.entries(keep(remote.comments)).filter(([, value]) => typeof value === "string").map(([id, value]) => [id, value.slice(0, 400)]));
      state.privateNotes[player] = {};
      state.importance[player] = Object.fromEntries(Object.entries(keep(remote.importance)).filter(([, value]) => [0, 1, 2].includes(Number(value))).map(([id, value]) => [id, Number(value)]));
      state.notReady[player] = Object.fromEntries(Object.entries(keep(remote.notReady)).filter(([, value]) => value === true));
      state.completedPlayers = [true, true];
      state.nearbyRemote = null;
      state.completedRounds = [...state.completedRounds, createCompletedRoundSnapshot()];
      state.answeredQuestionIds = [...new Set([...state.answeredQuestionIds, ...state.selectedQuestionIds])];
      state.screen = "celebration";
      state.revealedIds = [];
      state.seenIds = [];
      saveState();
      playSound("celebrate");
      render();
    }

    function applyNearbyRoundInit(payload) {
      if (typeof payload.roundId !== "string" || !payload.roundId || !Array.isArray(payload.selectedQuestionIds) || !payload.selectedQuestionIds.length) return;
      payload.roundId = payload.roundId.slice(0, 80);
      if (payload.roundId === state.nearbyRoundId && state.playStyle === "nearby" && state.screen !== "nearby") return;
      if (state.playStyle !== "nearby" && ["question", "intermission", "celebration", "reveal"].includes(state.screen)) return;
      // A different host's round arriving over this phone's own unfinished two-phone round asks first.
      const localUnfinished = state.selectedQuestionIds.length > 0 && payload.roundId !== state.nearbyRoundId
        && (["question", "intermission", "nearby-wait"].includes(state.screen) || ["question", "intermission", "nearby-wait"].includes(state.resumeScreen) || revealUnfinished());
      const hostName = (names) => String(Array.isArray(names) ? names[0] || "" : "").trim().toLowerCase();
      if (localUnfinished && hostName(payload.names) !== hostName(state.names) && !nearbyRuntime.initConfirmed) {
        if (nearbyRuntime.initPending) return;
        nearbyRuntime.initPending = true;
        const onlyReveal = revealUnfinished() && !["question", "intermission", "nearby-wait"].includes(state.screen) && !["question", "intermission", "nearby-wait"].includes(state.resumeScreen);
        const newHost = String(payload.names?.[0] || "your partner").slice(0, 40);
        openConfirmDialog({
          title: `Join ${newHost}’s round?`,
          copy: onlyReveal
            ? `This ${POINTER_VERB === "Tap" ? "phone" : "device"} has a round whose scores aren’t revealed yet. Joining skips the count-up — its scores go straight to your Journal.`
            : `This ${POINTER_VERB === "Tap" ? "phone" : "device"} has an unfinished round. Joining discards it — its answers can’t be recovered.`,
          confirmLabel: onlyReveal ? "Save to Journal and join" : "Discard and join",
          cancelLabel: "Keep my round",
          danger: !onlyReveal,
          safeFirst: true
        }).then((ok) => {
          nearbyRuntime.initPending = false;
          if (!ok) {
            closeNearbyConnection({ notifyPartner: true, reason: "kept-own-round" });
            if (["question", "intermission", "nearby-wait", "celebration", "reveal"].includes(state.screen)) { state.resumeScreen = state.screen; state.screen = "setup"; }
            saveState(); render();
            showToast("Kept your round. You can finish it on this phone.");
            return;
          }
          nearbyRuntime.initConfirmed = true;
          applyNearbyRoundInit(payload);
          nearbyRuntime.initConfirmed = false;
        });
        return;
      }
      // Any leave/start-over question still open is about a round that has just been replaced.
      document.querySelectorAll(".modal-backdrop [data-modal-cancel]").forEach((button) => button.click());
      const answersInProgress = state.playStyle === "nearby" && state.nearbyRoundId && ["question", "nearby-wait"].includes(state.screen)
        && Object.keys(state.answers[1] || {}).length > 0;
      if (answersInProgress && !payload.newRound && !nearbyRuntime.initConfirmed) return;
      const validTopics = new Set(TOPIC_OPTIONS.map((topic) => topic.id));
      (payload.questions || []).forEach((remoteQuestion) => {
        if (!remoteQuestion || typeof remoteQuestion !== "object" || typeof remoteQuestion.id !== "string") return;
        const builtIn = ALL_QUESTIONS.find((question) => question.id === remoteQuestion.id);
        if (!builtIn && !remoteQuestion.id.startsWith("custom_") && typeof remoteQuestion.prompt === "string" && /^[\w-]{1,60}$/.test(remoteQuestion.id) && !state.customQuestions.some((question) => question.id === remoteQuestion.id) && state.customQuestions.length < 150) {
          // A question from a newer catalog on the other phone: keep it so both phones play the same round.
          const topic = validTopics.has(remoteQuestion.topic) ? remoteQuestion.topic : "connection";
          const type = remoteQuestion.type === "slider" ? "slider" : "text";
          state.customQuestions.push({
            id: remoteQuestion.id,
            topic,
            category: String(remoteQuestion.category || TOPIC_OPTIONS.find((option) => option.id === topic)?.label || "Connection").slice(0, 60),
            type,
            prompt: String(remoteQuestion.prompt).slice(0, 500),
            ...(type === "slider" ? { labels: [String(remoteQuestion.labels?.[0] || "Low").slice(0, 60), String(remoteQuestion.labels?.[1] || "High").slice(0, 60)] } : {})
          });
          return;
        }
        if (builtIn) {
          // Only adopt the host's wording when the host actually edited it, and never overwrite this player's own edits.
          const prompt = String(remoteQuestion.prompt || "").slice(0, 500);
          const labels = Array.isArray(remoteQuestion.labels) ? [String(remoteQuestion.labels[0] || "Low").slice(0, 60), String(remoteQuestion.labels[1] || "High").slice(0, 60)] : null;
          const edited = (prompt && prompt !== builtIn.prompt) || (labels && builtIn.labels && labels.join("|") !== builtIn.labels.join("|"));
          if (edited && !state.questionEdits[builtIn.id]) state.questionEdits[builtIn.id] = { prompt: prompt || builtIn.prompt, ...(labels ? { labels } : {}) };
        } else {
          const customId = remoteQuestion.id;
          if (!customId.startsWith("custom_")) return;
          const customExists = state.customQuestions.find((question) => question.id === customId);
          if (!customExists && state.customQuestions.length < 150) {
            const topic = validTopics.has(remoteQuestion.topic) ? remoteQuestion.topic : "connection";
            const type = remoteQuestion.type === "slider" ? "slider" : "text";
            const topicLabel = TOPIC_OPTIONS.find((option) => option.id === topic)?.label || "Connection";
            state.customQuestions.push({
              id: customId,
              topic,
              category: `Custom · ${topicLabel}`,
              type,
              prompt: String(remoteQuestion.prompt || "").slice(0, 500),
              ...(type === "slider"
                ? { labels: [String(remoteQuestion.labels?.[0] || "Low").slice(0, 60), String(remoteQuestion.labels?.[1] || "High").slice(0, 60)] }
                : {})
            });
          }
        }
      });
      const catalogIds = new Set(getQuestionCatalog().map((question) => question.id));
      const selectedQuestionIds = [...new Set(payload.selectedQuestionIds.filter((id) => typeof id === "string" && catalogIds.has(id)))].slice(0, 30);
      if (!selectedQuestionIds.length) return;
      const names = Array.isArray(payload.names) ? [String(payload.names[0] || "Player 1").slice(0, 40), String(payload.names[1] || "Player 2").slice(0, 40)] : ["Player 1", "Player 2"];
      if (payload.newRound && state.playStyle === "nearby" && state.nearbyRoundId && state.nearbyRoundId !== payload.roundId && nearbyRoundFinished()) {
        const skipped = revealUnfinished() ? " · last round’s scores are in your Journal" : "";
        const message = `${names[0]} started a new round · ${roundToastCopy(roundsPlayedToday() + 1, selectedQuestionIds).replace(/^Round \d+ tonight · /, "")}${skipped}`;
        window.setTimeout(() => showToast(message), 250);
      }
      state.tutorialSeen = true;
      document.querySelector("#tutorial-finish")?.closest(".modal-backdrop")?.remove();
      const settings = persistentSetupState();
      state = {
        ...initialState(), ...settings,
        screen: "question", playStyle: "nearby", names,
        questionMode: ["mixed", "slider-heavy", "sliders-only"].includes(payload.questionMode) ? payload.questionMode : state.questionMode,
        questionCount: selectedQuestionIds.length,
        questionIntensity: INTENSITY_OPTIONS.some((option) => option.id === payload.questionIntensity) ? payload.questionIntensity : state.questionIntensity,
        selectedTopics: Array.isArray(payload.selectedTopics) ? payload.selectedTopics.filter((topic) => validTopics.has(topic)) : state.selectedTopics,
        selectedQuestionIds, activePlayer: 1,
        nearbyRole: "join", nearbyRoundId: payload.roundId,
        sessionPreset: payload.sessionPreset === "pack" || SESSION_PRESETS.some((preset) => preset.id === payload.sessionPreset) ? payload.sessionPreset : "custom",
        recentPrompts: Array.isArray(payload.recentPrompts) ? payload.recentPrompts.filter((text) => typeof text === "string").map((text) => text.slice(0, 300)).slice(-400) : settings.recentPrompts,
        cardPrompts: {},
        recentHeadlines: Array.isArray(payload.recentHeadlines) ? [...new Set(payload.recentHeadlines.filter((item) => ["vibe", "roll", "another", "best", "finding", "locked"].includes(item)))].slice(-5) : settings.recentHeadlines
      };
      if (!state.selectedTopics.length) state.selectedTopics = [...DEFAULT_TOPICS];
      nearbyRuntime.role = "join";
      nearbyRuntime.partnerProgress = null;
      nearbyRuntime.initConfirmed = false;
      saveState(); render(); playSound("unlock");
    }

    function handleNearbyMessage(message) {
      let payload;
      try { payload = JSON.parse(message.data); } catch { return; }
      if (!payload || typeof payload !== "object") return;
      const sameRound = !payload.roundId || payload.roundId === state.nearbyRoundId;
      if (payload.type === "hello") {
        nearbyRuntime.partnerLeft = false;
        if (typeof payload.appVersion === "string" && payload.appVersion !== APP_VERSION && compareVersions(payload.appVersion, APP_VERSION) > 0) {
          showToast(`The other phone has a newer Aligned (${payload.appVersion.slice(0, 12)}). Everything still works; update this one when you can.`);
        } else if (typeof payload.appVersion === "string" && payload.appVersion !== APP_VERSION && compareVersions(payload.appVersion, APP_VERSION) < 0) {
          showToast(`The other phone has an older Aligned (${payload.appVersion.slice(0, 12)}). Everything still works; a few touches may differ until it updates.`);
        }
        const roundInProgress = state.playStyle === "nearby" && state.nearbyRoundId && ["question", "nearby-wait"].includes(state.screen);
        if (nearbyRuntime.role === "host" && roundInProgress && payload.roundId !== state.nearbyRoundId) sendNearbyMessage(nearbyRoundInitPayload());
      } else if (payload.type === "round-init") {
        applyNearbyRoundInit(payload);
      } else if (payload.type === "delivered") {
        if (payload.roundId && payload.roundId === state.nearbyRoundId && state.nearbyDelivered !== payload.roundId) {
          state.nearbyDelivered = payload.roundId;
          saveState();
          updateNearbyBanner();
        }
      } else if (payload.type === "player-complete") {
        if (payload.roundId && payload.roundId === state.nearbyRoundId) sendNearbyMessage({ type: "delivered", roundId: payload.roundId }, { queue: false });
        if (!payload.roundId || payload.roundId !== state.nearbyRoundId || nearbyRoundFinished()) return;
        state.nearbyRemote = {
          roundId: payload.roundId,
          player: payload.player === 0 ? 0 : 1,
          answers: payload.answers, guesses: payload.guesses, comments: payload.comments, importance: payload.importance, notReady: payload.notReady
        };
        nearbyRuntime.partnerProgress = { answered: state.selectedQuestionIds.length, total: state.selectedQuestionIds.length };
        saveState();
        if (state.screen === "nearby-wait") finishNearbyRoundIfReady();
      } else if (payload.type === "progress") {
        if (!sameRound) return;
        nearbyRuntime.partnerProgress = { answered: Math.max(0, Number(payload.answered) || 0), total: Math.max(1, Number(payload.total) || state.selectedQuestionIds.length) };
        if (state.screen === "nearby-wait") render();
      } else if (payload.type === "leave") {
        nearbyRuntime.partnerLeft = true;
        dismissConfirmDialogs("link");
        const partner = state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "Your partner";
        const declinedNewRound = payload.reason === "kept-own-round";
        closeNearbyConnection();
        nearbyRuntime.partnerLeft = true;
        nearbyRuntime.partnerLeftReason = declinedNewRound ? "kept-own-round" : "";
        // A host who hasn't answered anything yet goes back to pairing rather than a round nobody joined.
        const hostUntouched = declinedNewRound && state.nearbyRole === "host" && state.screen === "question" && !Object.keys(state.answers?.[0] || {}).length;
        if (hostUntouched) state.screen = "nearby";
        showToast(declinedNewRound ? `${partner} stayed on their own round. ${hostUntouched ? "Show a new QR when you’re both ready." : state.screen === "nearby-wait" ? "Choose how to finish below." : "You can show a new QR from Home later."}` : `${partner} left the two-phone round. Your answers are saved on this phone.`, { tone: "warning" });
        if (state.screen === "nearby" && !hostUntouched) state.screen = "setup";
        saveState();
        render();
      } else if (payload.type === "follow-through") {
        if (sameRound && acceptRemoteFollowThrough(payload.questionId, payload.status, payload.at)) {
          syncLatestRoundSnapshot(); saveState();
          refreshRevealFromPartner();
        }
      } else if (payload.type === "intention-update") {
        if (sameRound && acceptRemoteIntention(payload.questionId, payload.text, payload.at)) {
          syncLatestRoundSnapshot(); saveState();
        }
      } else if (payload.type === "reveal-state") {
        if (!sameRound || !nearbyRoundFinished()) return;
        const roundIds = new Set(state.selectedQuestionIds);
        if (Array.isArray(payload.seenIds)) {
          const before = (state.seenIds || []).length;
          state.seenIds = [...new Set([...(state.seenIds || []), ...payload.seenIds.filter((id) => roundIds.has(id))])];
          if (state.seenIds.length !== before) { saveState(); refreshRevealFromPartner(); }
          if (payload.all === undefined && !payload.change && !Array.isArray(payload.revealedIds)) return;
        }
        let next;
        if (payload.all === true) next = [...state.selectedQuestionIds];
        else if (payload.all === false) next = [];
        else if (payload.change && typeof payload.change.id === "string") {
          next = payload.change.revealed
            ? [...new Set([...state.revealedIds, payload.change.id])]
            : state.revealedIds.filter((id) => id !== payload.change.id);
        } else {
          next = [...new Set([...state.revealedIds, ...(Array.isArray(payload.revealedIds) ? payload.revealedIds : [])])];
        }
        next = next.filter((id) => roundIds.has(id));
        if (next.length === state.revealedIds.length && next.every((id) => state.revealedIds.includes(id))) return;
        const newlyRevealed = next.filter((id) => !state.revealedIds.includes(id));
        state.revealedIds = next;
        saveState();
        refreshRevealFromPartner();
        if (state.screen === "reveal" && (payload.all === true || payload.all === false)) {
          const partner = state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "Your partner";
          showToast(payload.all ? `${partner} revealed every card` : `${partner} hid every card`);
          if (payload.all) {
            const anyMatch = getSelectedQuestions().filter(Boolean).some((question) => revealMatchInfo(question, state.answers[0][question.id], state.answers[1][question.id])?.isMatch);
            playSound("partner-flip", { match: anyMatch, degree: 0 });
          }
        } else if (state.screen === "reveal" && newlyRevealed.length === 1) {
          const partner = state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "Your partner";
          const number = state.selectedQuestionIds.indexOf(newlyRevealed[0]) + 1;
          showToast(`${partner} flipped card ${number}`);
          const question = getSelectedQuestions().find((item) => item?.id === newlyRevealed[0]);
          const match = question ? revealMatchInfo(question, state.answers[0][question.id], state.answers[1][question.id]) : null;
          playSound("partner-flip", { topic: question?.topic, degree: number - 1, match: Boolean(match?.isMatch) });
        }
      } else if (payload.type === "text-rating") {
        if (sameRound && acceptRemoteRating(payload.questionId, payload.rating, payload.at)) {
          syncLatestRoundSnapshot(); saveState();
          refreshRevealFromPartner();
        }
      } else if (payload.type === "board-sync") {
        if (!sameRound) return;
        let changed = false;
        const follow = payload.follow && typeof payload.follow === "object" ? payload.follow : {};
        const followTimes = payload.followTimes && typeof payload.followTimes === "object" ? payload.followTimes : {};
        Object.entries(follow).forEach(([id, status]) => { if (acceptRemoteFollowThrough(id, status, followTimes[id])) changed = true; });
        (Array.isArray(payload.intentions) ? payload.intentions : []).slice(0, 60).forEach((item) => {
          if (item && typeof item === "object" && acceptRemoteIntention(String(item.questionId || ""), item.text, item.at)) changed = true;
        });
        if (changed) { syncLatestRoundSnapshot(); saveState(); refreshRevealFromPartner(); }
      } else if (payload.type === "rating-sync") {
        if (!sameRound || !payload.ratings || typeof payload.ratings !== "object") return;
        const times = payload.times && typeof payload.times === "object" ? payload.times : {};
        let changed = false;
        Object.entries(payload.ratings).forEach(([id, rating]) => { if (acceptRemoteRating(id, rating, times[id])) changed = true; });
        if (changed) { syncLatestRoundSnapshot(); saveState(); refreshRevealFromPartner(); }
      }
    }

    function attachNearbyChannel(channel) {
      nearbyDataChannel = channel;
      channel.addEventListener("open", () => {
        if (nearbyDataChannel !== channel) return;
        nearbyNegotiationFailures = 0;
        nearbyRuntime.partnerLeft = false;
        clearTimeout(nearbyPeerLostTimer);
        if (nearbyRuntime.role === "host" && state.screen === "nearby" && state.nearbyRepairScreen) {
          state.screen = state.nearbyRepairScreen;
          state.nearbyRepairScreen = "";
          nearbyRuntime.roundStarted = true;
          saveNearbySession();
          saveState();
          render();
        }
        setNearbyStatus("connected");
        playSound("match");
        sendNearbyHello();
        flushNearbyOutbox();
        if (nearbyRuntime.role === "host" && state.screen === "nearby" && !nearbyRuntime.roundStarted && !state.nearbyRepairScreen) {
          clearTimeout(nearbyAutoStartTimer);
          nearbyAutoStartTimer = window.setTimeout(startNearbyRound, 650);
        }
      });
      channel.addEventListener("message", (message) => {
        nearbyLastPeerMessageAt = Date.now();
        handleNearbyMessage(message);
      });
      channel.addEventListener("open", () => {
        nearbyLastPeerMessageAt = Date.now();
        clearInterval(nearbyPeerWatchTimer);
        nearbyPeerWatchTimer = window.setInterval(() => {
          if (nearbyDataChannel !== channel || channel.readyState !== "open") return;
          try { channel.send(JSON.stringify({ type: "keepalive" })); } catch {}
          if (state.nearbyRoundId && state.completedPlayers?.[nearbyLocalPlayer()] && state.nearbyDelivered !== state.nearbyRoundId) {
            try { channel.send(JSON.stringify(nearbyPlayerPayload(nearbyLocalPlayer()))); } catch {}
          }
          if (Date.now() - nearbyLastPeerMessageAt > NEARBY_PEER_SILENCE_MS) {
            // The other phone has gone quiet: treat the link as lost now rather than waiting for the transport to time out.
            handleNearbyChannelLost(channel);
            try { channel.close(); } catch {}
          }
        }, 5000);
      });
      channel.addEventListener("close", () => handleNearbyChannelLost(channel));
    }

    function createNearbyPeer() {
      if (!window.RTCPeerConnection) throw new Error("This browser does not support two-phone play.");
      if (nearbyDataChannel) {
        nearbyDataChannel.__manualClose = true;
        try { nearbyDataChannel.close(); } catch {}
        nearbyDataChannel = null;
      }
      try { nearbyPeerConnection?.close(); } catch {}
      nearbyPendingCandidates = [];
      const peer = new RTCPeerConnection({ iceServers: nearbyIceServers.length ? nearbyIceServers : [{ urls: "stun:stun.cloudflare.com:3478" }] });
      nearbyPeerConnection = peer;
      peer.addEventListener("icecandidate", (event) => {
        if (event.candidate) sendNearbySignal({ type: "candidate", candidate: event.candidate.toJSON?.() || event.candidate });
      });
      peer.addEventListener("connectionstatechange", () => {
        if (peer !== nearbyPeerConnection || peer.connectionState !== "failed") return;
        // Some browsers keep the data channel "open" after the connection has failed; close it so both phones notice.
        if (nearbyDataChannel?.readyState === "open") {
          const failedChannel = nearbyDataChannel;
          handleNearbyChannelLost(failedChannel);
          try { failedChannel.close(); } catch {}
        }
        nearbyNegotiationFailures += 1;
        if (nearbyNegotiationFailures >= 3) {
          setNearbyStatus("blocked");
          return;
        }
        if (nearbyRuntime.role === "host" && nearbySignalingSocket?.readyState === WebSocket.OPEN) {
          window.setTimeout(() => {
            if (peer === nearbyPeerConnection) negotiateNearbyHost();
          }, 700);
        }
      });
      return peer;
    }

    function nearbyRelayAvailable() {
      return nearbyIceServers.some((server) => [].concat(server?.urls || []).some((url) => /^turns?:/i.test(String(url))));
    }

    async function prepareNearbyHost() {
      if (!NEARBY_PLAY_SUPPORTED) {
        setNearbyStatus("unsupported");
        return;
      }
      try {
        closeNearbyConnection();
        nearbyRuntime.role = "host";
        setNearbyStatus("creating-room");
        const room = await signalingRequest("/api/rooms", { method: "POST", body: "{}" });
        nearbyIceServers = Array.isArray(room.iceServers) ? room.iceServers : [];
        nearbyRuntime = {
          ...nearbyRuntime,
          role: "host",
          roomId: room.roomId,
          hostToken: room.hostToken,
          joinToken: room.joinToken,
          expiresAt: Number(room.expiresAt) || Date.now() + 15 * 60 * 1000,
          joinURL: pairingJoinURL(room.roomId, room.joinToken)
        };
        state.nearbyRole = "host";
        saveState();
        saveNearbySession();
        setNearbyStatus("connecting-service");
        await connectNearbySignaling("host", room.roomId, room.hostToken);
      } catch (error) {
        if (nearbyRuntime.role !== "host") return;
        setNearbyStatus("failed", error.message || "Two-phone pairing couldn't start. Try again in a moment.");
      }
    }

    async function prepareNearbyJoin(roomId, joinToken) {
      if (!NEARBY_PLAY_SUPPORTED) {
        setNearbyStatus("unsupported");
        return;
      }
      try {
        const confirmed = Boolean(nearbyRuntime.initConfirmed);
        closeNearbyConnection();
        nearbyRuntime = { ...nearbyRuntime, role: "join", roomId, joinToken, expiresAt: Date.now() + 15 * 60 * 1000, initConfirmed: confirmed };
        state.nearbyRole = "join";
        saveState();
        saveNearbySession();
        setNearbyStatus("joining");
        const room = await signalingRequest(`/api/rooms/${encodeURIComponent(roomId)}/join`, {
          method: "POST",
          body: JSON.stringify({ token: joinToken })
        });
        if (nearbyRuntime.roomId !== roomId) return;
        nearbyIceServers = Array.isArray(room.iceServers) ? room.iceServers : [];
        nearbyRuntime.expiresAt = Number(room.expiresAt) || Date.now() + 15 * 60 * 1000;
        state.nearbyRole = "join";
        saveState();
        saveNearbySession();
        await connectNearbySignaling("join", roomId, joinToken);
      } catch (error) {
        if (nearbyRuntime.roomId !== roomId) return;
        clearNearbySession();
        setNearbyStatus(error.reason === "expired" ? "expired" : "failed", error.message || "That join link is no longer valid.");
      }
    }

    // After a reload (or the app being reopened), quietly rejoin the same private room and resync the round.
    function resumeNearbySession() {
      if (!NEARBY_PLAY_SUPPORTED || state.playStyle !== "nearby" || nearbyRuntime.role) return false;
      const session = loadNearbySession();
      if (!session) return false;
      const resumable = session.role === "host"
        ? ["nearby", "question", "nearby-wait", "celebration", "reveal"].includes(state.screen) || state.resumeScreen
        : ["nearby", "question", "nearby-wait", "celebration", "reveal"].includes(state.screen) || state.resumeScreen;
      if (!resumable) {
        clearNearbySession();
        return false;
      }
      nearbyIceServers = Array.isArray(session.iceServers) ? session.iceServers : [];
      nearbyRuntime = {
        ...freshNearbyRuntime(),
        role: session.role,
        roomId: session.roomId,
        hostToken: session.role === "host" ? session.token : "",
        joinToken: session.role === "host" ? session.joinToken : session.token,
        expiresAt: Number(session.expiresAt),
        roundStarted: Boolean(session.roundStarted) || state.screen !== "nearby",
        joinURL: session.role === "host" && session.joinToken ? pairingJoinURL(session.roomId, session.joinToken) : "",
        status: "reconnecting"
      };
      connectNearbySignaling(session.role, session.roomId, session.token).catch(() => {});
      return true;
    }

    function retryNearbyConnection() {
      nearbyNegotiationFailures = 0;
      nearbyRuntime.otherTab = false;
      if (nearbyRuntime.role === "host") {
        if (nearbySignalingSocket?.readyState === WebSocket.OPEN) negotiateNearbyHost();
        else if (nearbyRuntime.roomId && !nearbyRoomExpired()) connectNearbySignaling("host", nearbyRuntime.roomId, nearbyRuntime.hostToken).catch(() => {});
        else prepareNearbyHost();
        return;
      }
      if (nearbyRuntime.role === "join" && nearbyRuntime.roomId && !nearbyRoomExpired()) {
        // Reopening the joiner's room connection makes the host's phone start a fresh negotiation.
        setNearbyStatus("waiting-host");
        connectNearbySignaling("join", nearbyRuntime.roomId, nearbyRuntime.joinToken).catch(() => {});
      }
    }

    // When the old room has ended, the host shows a fresh QR; scanning it reconnects the same round.
    function repairNearbyRound() {
      state.nearbyRepairScreen = state.screen;
      closeNearbyConnection();
      state.screen = "nearby";
      saveState();
      render();
      prepareNearbyHost();
    }

    // Used when the phones cannot reconnect: the other person finishes their turn on this phone instead.
    function finishNearbyRoundOnThisDevice() {
      const localPlayer = nearbyLocalPlayer();
      const other = localPlayer === 0 ? 1 : 0;
      closeNearbyConnection({ notifyPartner: true });
      state.answers[other] = {};
      state.comments[other] = {};
      state.privateNotes[other] = {};
      state.importance[other] = {};
      state.notReady[other] = {};
      if (Array.isArray(state.guesses)) state.guesses[other] = {};
      state.completedPlayers = [localPlayer === 0, localPlayer === 1];
      state.activePlayer = localPlayer;
      state.playStyle = "pass-and-play";
      state.nearbyRemote = null;
      state.questionIndex = 0;
      state.screen = "intermission";
      saveState();
      render();
    }

      return [...ALL_QUESTIONS, ...state.customQuestions].map((question) => {

    function exportBackup() {

      lastExportAt = Date.now();
      const json = JSON.stringify(createBackupPayload(), null, 2);

    function unreadableSaveKeys() {

    // Hands back a save Aligned couldn't read, exactly as it was stored, for recovery or support.
    function downloadUnreadableSave() {
      const keys = unreadableSaveKeys();
      if (!keys.length) return;
      const text = keys.length === 1 ? localStorage.getItem(keys[0]) : JSON.stringify(keys.map((key) => localStorage.getItem(key)));
      const name = `aligned-unreadable-save-${localDateStamp()}.json`;

    }

    function bytesToBase64(bytes) {
      let binary = "";
      for (let index = 0; index < bytes.length; index += 32768) {
        binary += String.fromCharCode(...bytes.subarray(index, index + 32768));
      }
      return btoa(binary);
    }

    function base64ToBytes(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (character) => character.charCodeAt(0));
    }

    function requestSecret({ title, copy, confirmLabel = "Continue", minimum = 1, creating = false }) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "modal-backdrop";
        overlay.innerHTML = `
          <section class="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="secret-title">
            <p class="eyebrow">Private & local</p>
            <h2 id="secret-title">${escapeHTML(title)}</h2>
            <p class="dialog-copy">${escapeHTML(copy)}</p>
            <label class="custom-label">${minimum >= 8 || /passphrase|backup/i.test(title) ? "Passphrase" : "PIN"}<input class="custom-input" id="secret-input" type="password" autocomplete="${creating ? "new-password" : "current-password"}"></label>
            <p class="error" id="secret-error" role="alert"></p>
            <div class="dialog-actions"><button class="secondary-btn" id="secret-cancel" type="button">Cancel</button><button class="primary-btn" id="secret-confirm" type="button">${escapeHTML(confirmLabel)}</button></div>
          </section>`;
        const finish = (value) => { overlay.remove(); resolve(value); };
        overlay.querySelector("#secret-cancel").addEventListener("click", () => finish(null));
        overlay.querySelector("#secret-confirm").addEventListener("click", () => {
          const value = overlay.querySelector("#secret-input").value;
          if (value.length < minimum) {
            overlay.querySelector("#secret-error").textContent = `Use at least ${minimum} characters.`;
            return;
          }
          finish(value);
        });
        overlay.querySelector("#secret-input").addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            event.stopPropagation();
            overlay.querySelector("#secret-confirm").click();
          }
        });
        document.body.appendChild(overlay);
        overlay.querySelector("#secret-input").focus();
      });
    }

    async function deriveBackupKey(passphrase, salt) {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt, iterations: 250000 },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function exportEncryptedBackup() {
      if (!window.crypto?.subtle) { showToast("Encrypted backups require a secure browser connection."); return; }
      const passphrase = await requestSecret({ title: "Encrypt this backup", copy: "Choose a passphrase you can remember. It cannot be recovered by the app.", confirmLabel: "Next", minimum: 8, creating: true });
      if (!passphrase) return;
      const repeatPassphrase = await requestSecret({ title: "Confirm the passphrase", copy: "Type the same passphrase again so a typo can\u2019t lock this backup.", confirmLabel: "Export encrypted", minimum: 8, creating: true });
      if (!repeatPassphrase) return;
      if (repeatPassphrase !== passphrase) { showToast("Those passphrases didn\u2019t match. No backup was created.", { tone: "warning" }); return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveBackupKey(passphrase, salt);
      const plaintext = new TextEncoder().encode(JSON.stringify(createBackupPayload()));
      const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext));
      const wrapper = { app: "Aligned", formatVersion: 2, encrypted: true, cipher: "AES-GCM", kdf: "PBKDF2-SHA256", iterations: 250000, salt: bytesToBase64(salt), iv: bytesToBase64(iv), data: bytesToBase64(encrypted) };
      const blob = new Blob([JSON.stringify(wrapper)], { type: "application/json" });
      if (saveWithAndroidBridge(`aligned-private-${localDateStamp()}.aligned`, "application/octet-stream", JSON.stringify(wrapper))) {
        playSound("lock");
        showToast("Keep the backup’s passphrase somewhere safe — it can’t be recovered.");
        return;
      }
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `aligned-private-${localDateStamp()}.aligned`;
      document.body.appendChild(anchor); anchor.click(); anchor.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      playSound("lock");
      showToast("Encrypted backup created. Keep its passphrase somewhere safe.");
    }

    async function decryptBackupWrapper(wrapper) {
      if (!window.crypto?.subtle) throw new Error("This browser cannot decrypt the backup without a secure connection.");
      try {
        if (![wrapper.salt, wrapper.iv, wrapper.data].every((part) => typeof part === "string" && part.length)) throw new Error();
        [wrapper.salt, wrapper.iv, wrapper.data].forEach((part) => base64ToBytes(part));
      } catch {
        throw new Error("This encrypted backup is damaged, so it can’t be opened. Try another copy.");
      }
      for (let attempt = 0; attempt < 5; attempt += 1) {
        const passphrase = await requestSecret({
          title: "Unlock encrypted backup",
          copy: attempt ? "That passphrase didn’t work. Check it and try again." : "Enter the passphrase used when this backup was created.",
          confirmLabel: "Unlock",
          minimum: 1
        });
        if (!passphrase) throw new Error("Import cancelled.");
        try {
          const key = await deriveBackupKey(passphrase, base64ToBytes(wrapper.salt));
          const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: base64ToBytes(wrapper.iv) }, key, base64ToBytes(wrapper.data));
          return JSON.parse(new TextDecoder().decode(decrypted));
        } catch {}
      }
      throw new Error("That passphrase is incorrect or the encrypted backup is damaged.");
    }

    async function hashPin(pin) {
      if (!window.crypto?.subtle) {
        let hash = 2166136261;
        // Retain the legacy namespace so existing device PIN hashes remain valid after the rebrand.
        for (const character of `awc-private-notes:${pin}`) {
          hash ^= character.charCodeAt(0);
          hash = Math.imul(hash, 16777619);
        }
        return `local-${(hash >>> 0).toString(36)}`;
      }
      const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`awc-private-notes:${pin}`)));
      return bytesToBase64(digest);
    }

    async function configurePrivatePin() {
      if (state.privatePinHash) {
        const current = await requestSecret({ title: "Change private-notes PIN", copy: "Enter the current PIN to remove it. You can then set a new one.", confirmLabel: "Remove PIN", minimum: 4 });
        if (!current) return;
        if (await hashPin(current) !== state.privatePinHash) { showToast("That PIN did not match."); return; }
        state.privatePinHash = "";
        saveState(); renderSettings(); document.getElementById("configure-pin")?.focus(); showToast("Private-notes PIN removed.");
        return;
      }
      const pin = await requestSecret({ title: "Protect private reflections", copy: "Set one PIN for this device. It locks both players' private notes, not the shared reveal board.", confirmLabel: "Next", minimum: 4, creating: true });
      if (!pin) return;
      const repeat = await requestSecret({ title: "Confirm the PIN", copy: "Enter the same PIN again so a typo can't lock you out.", confirmLabel: "Set PIN", minimum: 4, creating: true });
      if (!repeat) return;
