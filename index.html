      // Freshness is about this couple: tonight's questions come back only when nothing else is left.
      const tonightIds = new Set(state.completedRounds.filter(isTonightRound).flatMap((round) => round.questionIds || []));
      const coupleSeen = coupleAnsweredIds();
      const lastUsed = questionLastUsedMap();
      const catalogById = new Map(getQuestionCatalog().map((item) => [item.id, item]));
      const tonightQuestions = [...tonightIds].map((id) => catalogById.get(id)).filter(Boolean);
      const tonightTwin = new Map();
      const isTwin = (question) => {
        if (!tonightTwin.has(question.id)) tonightTwin.set(question.id, tonightQuestions.some((other) => promptsAreTwins(question, other)));
        return tonightTwin.get(question.id) || selected.some((id) => promptsAreTwins(question, catalogById.get(id)));
      };
      for (let index = 0; index < count; index += 1) {
        const topic = topicSequence[index];
        const type = typeSequence[index];
        const remaining = pool.filter((question) => !selectedIds.has(question.id));
        if (!remaining.length) break;
        const wantPlayful = topic === "spicy" && activePreset?.id === "spicy-night" && selected.filter((id) => PLAYFUL_SPICY.test(id)).length < 3;
        // Written slots still to come count toward the drift limits, so the round's total stays near its promise.
        const textSlotsLeft = typeSequence.slice(index + 1).filter((slot) => slot === "text").length;
        const drifted = type === "slider"
          ? selected.filter((id) => catalogById.get(id)?.type === "text").length + textSlotsLeft >= textTarget + 2
          : selected.filter((id) => catalogById.get(id)?.type === "slider").length >= sliderTarget + 2;
        // Beyond a hard limit (written-heavy rounds are slow), the right format wins even over a repeat from tonight.
        const writtenSoFar = selected.filter((id) => catalogById.get(id)?.type === "text").length;
        const hardCap = mode === "mixed" ? textTarget + 1 : Math.max(textTarget + 1, Math.ceil(count * 0.5));
        const hardDrifted = type === "slider" && writtenSoFar + textSlotsLeft >= hardCap;
        const rank = (question) => [
          // "Sliders only" means sliders: a written question never stands in while any slider exists.
          mode === "sliders-only" && question.type !== "slider" ? 1 : 0,
          hardDrifted && question.type !== type ? 1 : 0,
          selected.some((id) => promptsAreTwins(question, catalogById.get(id))) ? 1 : 0,
          tonightIds.has(question.id) ? 1 : 0,
          drifted && question.type !== type ? 1 : 0,
          question.type === type ? 0 : 1,
          activePreset?.tone === "light" && questionTone(question) !== "light" ? 1 : 0,
          coupleSeen.has(question.id) ? 1 : 0,
          isTwin(question) ? 1 : 0,
          wantPlayful && !PLAYFUL_SPICY.test(question.id) ? 1 : 0,
          question.topic === topic ? 0 : 1,
          coupleSeen.has(question.id) ? lastUsed.get(question.id) ?? -Infinity : 0
        ];
        const ranked = remaining.map((question) => ({ question, key: rank(question) }));
        const better = (a, b) => { for (let i = 0; i < a.length; i += 1) if (a[i] !== b[i]) return a[i] < b[i]; return false; };
        let best = ranked[0].key;
        ranked.forEach((item) => { if (better(item.key, best)) best = item.key; });
        const candidates = ranked.filter((item) => item.key.every((value, i) => value === best[i])).map((item) => item.question);
        const chosen = candidates[randomIndex(candidates.length)];
        selected.push(chosen.id);
        selectedIds.add(chosen.id);
      }

      return orderRoundAsRamp(selected);
    }

    function allowedTopicsForIntensity(intensity = state.questionIntensity) {
      if (intensity === "cozy") return new Set(["connection", "love", "fun", "lifestyle"]);
      if (intensity === "curious") return new Set(DEFAULT_TOPICS);
      if (intensity === "deep") return new Set([...DEFAULT_TOPICS, "money", "politics"]);
      if (intensity === "spicy") return new Set([...DEFAULT_TOPICS, "spicy", "money", "politics"]);
      return new Set(TOPIC_OPTIONS.map((topic) => topic.id));
    }

    function roundsPlayedToday() {
      return state.completedRounds.filter(isTonightRound).length;
    }

    // A round from today played by the same two people (in either order).
    function isTonightRound(round) {
      if (!round || new Date(round.completedAt).toDateString() !== new Date().toDateString()) return false;
      return sameCouple(round);
    }
    function sameCouple(round) {
      const couple = (names) => (Array.isArray(names) ? names : []).map((name) => String(name || "").trim().toLowerCase()).sort().join("|");
      return !Array.isArray(round.names) || couple(round.names) === couple(state.names);
    }
    function coupleAnsweredIds() {
      return new Set(state.completedRounds.filter(sameCouple).flatMap((round) => round.questionIds || []));
    }

    // Only promise "fresh" questions when none of them has been answered before.
    function roundToastCopy(roundNumber, selectedQuestionIds) {
      const total = selectedQuestionIds.length;
      const answered = coupleAnsweredIds();
      const fresh = selectedQuestionIds.filter((id) => !answered.has(id)).length;
      if (fresh === total) return `Round ${roundNumber} tonight · ${total} fresh questions`;
      if (!fresh) return `Round ${roundNumber} tonight · old favorites, new answers`;
      return `Round ${roundNumber} tonight · ${fresh} new, ${total - fresh} back for another look`;
    }

    // Shown in the first question's header (and announced) instead of a toast that would cover it.
    let roundIntro = "";

    function startGame({ names, questionMode, questionCount, selectedTopics, selectedQuestionIds, playStyle = "pass-and-play" }) {
      roundIntro = "";
      const roundNumber = roundsPlayedToday() + 1;
      if (roundNumber > 1) {
        roundIntro = roundToastCopy(roundNumber, selectedQuestionIds);
        announce(roundIntro);
      }
      const settings = persistentSetupState();
      state = {
        ...initialState(),
        ...settings,
        screen: "question",
        resumeScreen: null,
        names: [...names],
        playStyle,
        questionMode,
        questionCount: selectedQuestionIds.length || questionCount,
        selectedTopics: [...selectedTopics],
        selectedQuestionIds: [...selectedQuestionIds]
      };
      saveState();
      playSound("unlock");
      render();
    }

    function openSensitiveConsent(topics, onConfirm) {
      const labels = topics
        .filter((topic) => SENSITIVE_TOPICS.has(topic))
        .map((id) => TOPIC_OPTIONS.find((topic) => topic.id === id)?.label)
        .filter(Boolean);
      if (!labels.length) {
        onConfirm();
        return;
      }
      const overlay = document.createElement("div");
      overlay.className = "modal-backdrop";
      overlay.innerHTML = `
        <section class="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="sensitive-title" aria-describedby="sensitive-copy">
          <div class="dialog-graphic" aria-hidden="true">♡</div>
          <p class="eyebrow">Comfort check</p>
          <h2 id="sensitive-title">Both players should opt in</h2>
          <p class="dialog-copy" id="sensitive-copy">This round may include ${escapeHTML(labels.length > 1 ? `${labels.slice(0, -1).join(", ")} and ${labels[labels.length - 1]}` : labels.join(""))}. Either person can skip any prompt without explaining why.</p>
          <div class="dialog-actions">
            <button class="secondary-btn" id="sensitive-cancel" type="button">Change packs</button>
            <button class="primary-btn" id="sensitive-confirm" type="button">We both agree</button>
          </div>
        </section>
      `;
      const close = () => overlay.remove();
      overlay.addEventListener("click", (event) => { if (event.target === overlay) close(); });
      overlay.querySelector("#sensitive-cancel").addEventListener("click", close);
      overlay.querySelector("#sensitive-confirm").addEventListener("click", () => {
        close();
        onConfirm();
      });
      document.body.appendChild(overlay);
      // Start safe: a stray second Enter must not opt both people into sensitive packs.
      overlay.querySelector("#sensitive-cancel").focus();
    }

    function openTutorial() {
      if (document.querySelector(".modal-backdrop")) return;
      const overlay = document.createElement("div");
      overlay.className = "modal-backdrop";
      overlay.innerHTML = `
        <section class="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
          <p class="eyebrow">A quick tour</p>
          <h2 id="tutorial-title">Answer, then reveal together</h2>
          <div class="tutorial-steps">
            <div class="tutorial-step"><span>1</span><strong>Answer privately</strong><small>Each partner receives the same questions in the same order.</small></div>
            <div class="tutorial-step"><span>2</span><strong>Pass or pair</strong><small>Hand over one device (a lock screen hides the first answers) or link two phones with one QR scan.</small></div>
            <div class="tutorial-step"><span>3</span><strong>Flip & rate together</strong><small>Reveal each card, rate the written answers together — then your two scores unlock. Guessing your partner’s answers earns mind-reader points.</small></div>
          </div>
          <div class="dialog-actions"><button class="primary-btn" id="tutorial-finish" type="button">Let’s play</button></div>
        </section>
      `;
      overlay.querySelector("#tutorial-finish").addEventListener("click", () => {
        state.tutorialSeen = true;
        saveState();
        overlay.remove();
        playSound("unlock");
      });
      document.body.appendChild(overlay);
      overlay.querySelector("#tutorial-finish").focus();
    }

    function roundMixSummary(questions) {
      const picks = questions.filter((question) => isQuickPickQuestion(question)).length;
      const sliders = questions.filter((question) => question.type === "slider").length - picks;
      const written = questions.filter((question) => question.type === "text").length;
      const plural = (count, one, many) => `${count} ${count === 1 ? one : many}`;
      return [picks && plural(picks, "pick", "picks"), sliders && plural(sliders, "slider", "sliders"), written && `${written} written`].filter(Boolean).join(" · ");
    }

    function modeSummary(mode, count = state.questionCount) {
      const sliders = mode === "sliders-only"
        ? count
        : mode === "mixed"
          ? Math.ceil(count * 0.6)
          : Math.ceil(count * 0.8);
      const written = count - sliders;
      return written ? `${sliders} sliders + ${written} written` : `${sliders} sliders`;
    }

    function initials(name) {
      return String(name || "")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map((part) => Array.from(part).find((character) => /\p{L}|\p{N}/u.test(character)) || "")
        .join("")
        .toUpperCase() || Array.from(String(name || "").trim())[0] || "?";
    }

    function categorySymbol(category) {
      const symbols = {
        "Intimacy": "♡",
        "Values & Lifestyle": "◇",
        "Planning for the Future": "↗",
        "Expressing Love": "✦",
        "Wild Cards": "✺",
        "Politics & Society": "⚖",
        "Money & Power": "$",
        "Spicy": "♨",
        "Dealbreakers": "!"
      };
      return symbols[category] || (String(category).startsWith("Custom ·") ? "+" : "•");
    }

    function topicColor(tone) {
      return {
        blue: "var(--blue)",
        violet: "var(--violet)",
        green: "var(--green)",
        coral: "var(--coral)",
        sun: "var(--sun)"
      }[tone] || "var(--coral)";
    }

    function getSelectedQuestions() {
      const catalog = getQuestionCatalog();
      return state.selectedQuestionIds.map((id) => catalog.find((question) => question.id === id));
    }

    function copyPairingCode(value, message) {
      if (window.AlignedAndroid?.copyText) {
        showToast(window.AlignedAndroid.copyText(value) ? message : "Couldn't copy. Use Share instead.");
        return;
      }
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(value).then(() => showToast(message)).catch(() => showToast("Select and copy the code manually."));
      else showToast("Select and copy the code manually.");
    }

    function newNearbyRoundId() {
      const bytes = crypto.getRandomValues(new Uint8Array(9));
      return `r${Date.now().toString(36)}${Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("")}`;
    }

    function startNearbyRound() {
      if (nearbyRuntime.role !== "host" || nearbyRuntime.roundStarted || state.screen !== "nearby" || state.nearbyRepairScreen) return;
      if (!nearbyChannelOpen()) {
        showToast("The second phone isn't connected yet.", { tone: "warning" });
        return;
      }
      const roundId = newNearbyRoundId();
      startGame({ names: state.names, questionMode: state.questionMode, questionCount: state.selectedQuestionIds.length, selectedTopics: state.selectedTopics, selectedQuestionIds: state.selectedQuestionIds, playStyle: "nearby" });
      state.activePlayer = 0;
      state.nearbyRole = "host";
      state.nearbyRoundId = roundId;
      saveState();
      nearbyRuntime.roundStarted = true;
      nearbyRuntime.partnerProgress = null;
      saveNearbySession();
      sendNearbyMessage(nearbyRoundInitPayload({ newRound: true }));
    }

    function nearbyStatusPill() {
      const status = nearbyRuntime.status;
      const isHost = nearbyRuntime.role === "host";
      const partner = escapeHTML(state.names[1] || "your partner");
      const copy = {
        idle: "Not connected yet",
        "creating-room": "Creating a private room…",
        "connecting-service": "Opening the room…",
        joining: "Finding the room…",
        "room-ready": `Waiting for ${partner} to scan…`,
        "waiting-host": "Room found · waiting for the host’s phone…",
        "host-missing": "Still waiting for the host’s phone…",
        connecting: "Partner found · linking the phones…",
        connected: "Phones connected",
        reconnecting: "Reconnecting…",
        blocked: "The phones couldn’t link",
        expired: "This QR has expired",
        "in-use": "Link already in use",
        failed: "Couldn’t connect",
        unsupported: "Two-phone play isn’t available here"
      }[status] || "Not connected yet";
      const tone = status === "connected" ? "connected" : ["blocked", "expired", "in-use", "failed", "unsupported", "host-missing"].includes(status) ? "warning" : "";
      const busy = ["creating-room", "connecting-service", "joining", "room-ready", "waiting-host", "connecting", "reconnecting"].includes(status);
      return `<span class="connection-pill ${tone} ${busy ? "busy" : ""}" role="status" aria-live="polite"><span class="pulse-dot" aria-hidden="true"></span>${copy}</span>`;
    }

    function nearbyTrack() {
      const status = nearbyRuntime.status;
      const roomDone = !["idle", "creating-room", "connecting-service", "joining", "failed", "unsupported", "expired"].includes(status);
      const partnerDone = ["connecting", "connected", "blocked"].includes(status);
      const linked = status === "connected";
      const step = (done, active, number, label, failed = false) => `<li class="${failed ? "failed" : done ? "done" : active ? "active" : ""}"><span aria-hidden="true">${failed ? "✕" : done ? "✓" : number}</span>${label}</li>`;
      const isHost = nearbyRuntime.role === "host";
      return `<ol class="nearby-track" aria-label="Pairing progress">
        ${step(roomDone, !roomDone, 1, isHost ? "Room ready" : "Room found")}
        ${step(partnerDone, roomDone && !partnerDone, 2, isHost ? "Partner scanned" : "Host’s phone found")}
        ${step(linked, partnerDone && !linked && status !== "blocked", 3, status === "blocked" ? "Couldn’t link" : "Phones linked", status === "blocked")}
      </ol>`;
    }

    function nearbyProblemPanel() {
      const status = nearbyRuntime.status;
      const isHost = nearbyRuntime.role === "host";
      const retry = '<button class="primary-btn" id="nearby-retry" type="button">Try again</button>';
      const newQR = '<button class="primary-btn" id="nearby-new-room" type="button">Create a new QR</button>';
      const oneDevice = '<button class="secondary-btn" id="nearby-one-device" type="button">Play on one device instead</button>';
      if (status === "blocked") {
        return `<div class="nearby-alert" role="alert"><h3>The phones couldn’t link directly</h3><p>Some networks block phone-to-phone connections. Usually one of these fixes it:</p><ul><li>Put both phones on the same Wi-Fi network — this works almost everywhere.</li><li>Turn off any VPN or “private relay” on both phones.</li><li>Guest, hotel and work Wi-Fi often block phone-to-phone links${nearbyRelayAvailable() ? "; switching both phones to mobile data usually helps" : ""}.</li></ul><div class="actions">${retry}${oneDevice}</div></div>`;
      }
      if (status === "expired") {
        return `<div class="nearby-alert" role="alert"><h3>This QR is no longer active</h3><p>Pairing rooms close after a while for privacy, and old or mistyped links stop working. ${isHost ? "Create a new QR and scan it again." : "Ask your partner to create a new QR, then scan it again."}</p><div class="actions">${isHost ? newQR : ""}${oneDevice}</div></div>`;
      }
      if (status === "in-use") {
        return `<div class="nearby-alert" role="alert"><h3>This link is already being used</h3><p>Another phone opened the same join link. Each QR connects exactly two phones. ${isHost ? "Create a new QR if the wrong phone joined." : "Ask your partner for a new QR."}</p><div class="actions">${isHost ? newQR : ""}${oneDevice}</div></div>`;
      }
      if (status === "failed") {
        return `<div class="nearby-alert" role="alert"><h3>Couldn’t connect</h3><p>${escapeHTML(nearbyRuntime.errorReason || "Something interrupted the connection.")}</p><div class="actions">${isHost ? retry : ""}${oneDevice}</div></div>`;
      }
      if (status === "unsupported") {
        const offlineCopy = location.protocol === "file:"
          ? `This offline copy can’t create pairing rooms. Use the installed app or open <strong>${escapeHTML(PUBLIC_APP_URL.replace(/^https:\/\//, "").replace(/\/$/, ""))}</strong> to pair two phones.`
          : IS_IOS
            ? "This browser can’t make direct phone-to-phone connections. Open this page in Safari, and if Lockdown Mode is on, allow this site."
            : "This browser can’t make direct phone-to-phone connections. Update it, or use Chrome, Edge, Firefox or Safari.";
        return `<div class="nearby-alert" role="alert"><h3>Two-phone play isn’t available here</h3><p>${offlineCopy}</p><div class="actions">${oneDevice}</div></div>`;
      }
      if (status === "other-tab") {
        return `<div class="nearby-alert" role="alert"><h3>Open in another tab</h3><p>Aligned is open in another tab or window on this device, and that one is using the pairing room.</p><div class="actions"><button class="primary-btn" id="nearby-retry" type="button">Use this tab</button></div></div>`;
      }
      if (status === "partner-cancelled") {
        return `<div class="nearby-alert" role="alert"><h3>${isHost ? "Your partner left" : "Your partner cancelled pairing"}</h3><p>${isHost ? "Create a new QR when you’re both ready." : "Ask them to show a new QR when you’re both ready."}</p><div class="actions">${isHost ? newQR : ""}${oneDevice}</div></div>`;
      }
      if (status === "host-missing") {
        return `<div class="nearby-alert" role="status"><h3>Still waiting for the host</h3><p>Ask your partner to keep the QR screen open on their phone. If they closed it, they can create a new QR for you to scan.</p><div class="actions">${retry}${oneDevice}</div></div>`;
      }
      return "";
    }

    function renderNearby() {
      const status = nearbyRuntime.status;
      const initial = status === "idle" && !nearbyRuntime.role;
      const isHost = nearbyRuntime.role === "host";
      const isJoin = nearbyRuntime.role === "join";
      const connected = status === "connected";
      const hostRoom = isHost && nearbyRuntime.joinURL && ["room-ready", "connecting-service", "reconnecting"].includes(status);
      const relayCopy = nearbyRelayAvailable()
        ? "Phones connect directly when they can; if a network blocks that, an encrypted relay carries the game. The temporary room only handles connection setup and closes automatically."
        : "Phones connect directly and work best on the same Wi-Fi. The temporary room only handles connection setup, never answers, and closes automatically.";
      const hostName = escapeHTML(state.names[0] || "Player 1");
      const partnerName = escapeHTML(state.names[1] || "Player 2");
      app.innerHTML = `
        <section class="screen nearby-screen" aria-labelledby="nearby-title">
          <div class="nearby-card">
            <p class="eyebrow">Two phones · one scan</p>
            <h2 id="nearby-title">${isJoin ? `Joining your <span class="accent-text">partner’s round.</span>` : `Scan once, <span class="accent-text">connect automatically.</span>`}</h2>
            <p class="lede">${isJoin ? "Your partner’s phone sends the questions. You’ll each answer privately, then reveal together." : state.nearbyRepairScreen ? `Reconnecting your round: ${partnerName} scans this new QR and you carry on where you left off.` : "Each person answers privately on their own phone, then you reveal together. No account needed."}</p>
            ${["blocked", "expired", "in-use", "failed", "unsupported", "host-missing", "partner-cancelled", "other-tab"].includes(status) ? "" : nearbyStatusPill()}
            ${initial ? `
              <div class="nearby-choice-grid" style="grid-template-columns:1fr">
                <button class="nearby-choice" id="nearby-host" type="button"><strong>♡ Show the pairing QR</strong><small>${hostName} answers on this ${COARSE_POINTER ? "phone" : "device"}. ${partnerName} scans the QR with their regular camera and joins automatically.</small></button>
              </div>
              <ol class="nearby-steps"><li>${POINTER_VERB} “Show the pairing QR” on this ${COARSE_POINTER ? "phone" : "device"}.</li><li>${partnerName} scans it with their phone’s camera and opens the link.</li><li>The phones link by themselves and the questions open on both.</li></ol>
            ` : ["unsupported", "failed", "expired", "in-use", "partner-cancelled"].includes(status) ? "" : nearbyTrack()}
            ${hostRoom ? `
              <div class="qr-pairing-panel">
                ${renderPairingQR(nearbyRuntime.joinURL, "QR code to join this private alignment round automatically")}
                <div class="qr-pairing-copy"><strong>Scan with ${partnerName}’s camera</strong><span>Keep this screen open — the phones link automatically. Not nearby? Share the link instead. The QR expires after 15 minutes.</span><div class="actions">${navigator.share ? '<button class="secondary-btn" id="share-join-link" type="button">Share join link</button>' : ""}<button class="secondary-btn" id="copy-join-link" data-join-url="${escapeHTML(nearbyRuntime.joinURL)}" type="button">Copy join link</button></div></div>
              </div>
            ` : ""}
            ${isJoin && !connected && !["blocked", "expired", "in-use", "failed", "host-missing", "unsupported", "partner-cancelled"].includes(status) ? `<div class="nearby-join-state"><div class="celebration-orb" aria-hidden="true">⌁</div><h3>You’re joining automatically</h3><p class="topic-note">Keep this screen open. Nothing needs to be scanned or typed on this phone.</p></div>` : ""}
            ${nearbyProblemPanel()}
            ${connected ? isHost ? `<p class="topic-note">Connected! ${hostName} answers here; ${partnerName} answers on the other phone. The questions are opening…</p><div class="actions"><button class="primary-btn" id="start-nearby-round" type="button">Start now</button></div>` : `<p class="topic-note">Connected. Your private questions are opening…</p>` : ""}
            ${!initial && !connected ? `<button class="text-btn" id="${isHost ? "restart-nearby" : "leave-nearby"}" type="button" style="margin-top:18px">${isHost ? (state.nearbyRepairScreen ? "Back to the round" : "Cancel and start over") : "Leave"}</button>` : ""}
            <p class="privacy-note" style="margin-top:20px"><span aria-hidden="true">⌁</span><span>${relayCopy}</span></p>
          </div>
        </section>`;

      document.getElementById("nearby-host")?.addEventListener("click", prepareNearbyHost);
      document.getElementById("copy-join-link")?.addEventListener("click", () => copyPairingCode(nearbyRuntime.joinURL, "Join link copied."));
      document.getElementById("share-join-link")?.addEventListener("click", async () => {
        try { await navigator.share({ title: "Join our Aligned round", text: "Open this private link to join automatically.", url: nearbyRuntime.joinURL }); } catch {}
      });
      document.getElementById("restart-nearby")?.addEventListener("click", () => {
        closeNearbyConnection({ notifyPartner: true });
        if (state.nearbyRepairScreen) {
          state.screen = state.nearbyRepairScreen;
          state.nearbyRepairScreen = "";
          saveState();
        }
        render();
      });
      document.getElementById("leave-nearby")?.addEventListener("click", () => {
        closeNearbyConnection({ notifyPartner: true });
        state.screen = "setup";
        state.playStyle = "pass-and-play";
        saveState();
        render();
      });
      document.getElementById("nearby-retry")?.addEventListener("click", retryNearbyConnection);
      document.getElementById("nearby-new-room")?.addEventListener("click", prepareNearbyHost);
      document.getElementById("nearby-one-device")?.addEventListener("click", () => {
        closeNearbyConnection({ notifyPartner: true });
        state.playStyle = "pass-and-play";
        state.playStyleBeforeJoin = "";
        nearbyRuntime.initConfirmed = false;
        state.screen = "setup";
        saveState();
        render();
        showToast("One-device mode selected. Start the round when you’re ready.");
      });
      document.getElementById("start-nearby-round")?.addEventListener("click", startNearbyRound);
    }

    function renderNearbyWait() {
      const localPlayer = nearbyLocalPlayer();
      const partner = escapeHTML(state.names[localPlayer === 0 ? 1 : 0] || "your partner");
      const total = state.selectedQuestionIds.length;
      const progress = nearbyRuntime.partnerProgress;
      const answered = progress ? Math.min(total, progress.answered) : null;
      const connected = nearbyChannelOpen();
      const canReconnect = Boolean(nearbyRuntime.roomId) && !nearbyRoomExpired() && !["expired", "in-use"].includes(nearbyRuntime.status);
      const statusBlock = connected
        ? '<span class="connection-pill connected" role="status"><span class="pulse-dot" aria-hidden="true"></span>Phones connected</span>'
        : nearbyRuntime.partnerLeft
          ? `<span class="connection-pill warning" role="status"><span class="pulse-dot" aria-hidden="true"></span>${nearbyRuntime.partnerLeftReason === "kept-own-round" ? `${partner} kept their own round` : `${partner} left the round`}</span>`
          : canReconnect
            ? '<span class="connection-pill busy" role="status"><span class="pulse-dot" aria-hidden="true"></span>Reconnecting… your answers will send automatically</span>'
            : '<span class="connection-pill warning" role="status"><span class="pulse-dot" aria-hidden="true"></span>The phones are no longer connected</span>';
      const showFallback = !connected && (!canReconnect || nearbyRuntime.partnerLeft || ["blocked", "peer-lost"].includes(nearbyRuntime.status));
      const isHost = state.nearbyRole !== "join";
      const repairCopy = isHost
        ? `<p>Or show a new QR for ${partner} to scan — the same round continues and nothing is lost.</p><div class="actions"><button class="secondary-btn" id="nearby-repair" type="button">Pair again with a new QR</button></div>`
        : `<p>Or ask ${partner} to tap “Pair again” on their phone and scan the new QR — this round continues.</p>`;
      const fallback = showFallback
        ? `<div class="nearby-alert" role="alert" style="text-align:left"><h3>Finish without the second phone</h3><p>Your answers stay locked in. ${partner} can answer here instead (they start their answers again on this phone), and you’ll still reveal together.</p><div class="actions"><button class="primary-btn" id="nearby-finish-here" type="button">Let ${partner} answer here</button></div>${nearbyRuntime.partnerLeft ? "" : repairCopy}</div>`
        : !connected && canReconnect
          ? '<div class="actions" style="justify-content:center"><button class="secondary-btn" id="nearby-retry" type="button">Reconnect now</button></div>'
          : "";
      const heading = connected || (!showFallback)
        ? `Waiting for <span class="accent-text">${partner}</span>`
        : nearbyRuntime.partnerLeft
          ? `<span class="accent-text">${partner}</span> ${nearbyRuntime.partnerLeftReason === "kept-own-round" ? "stayed on their own round" : "left the round"}`
          : "The phones lost their connection";
      const lede = connected || !showFallback
        ? `The reveal board opens on both phones as soon as ${partner} finishes.`
        : canReconnect && !nearbyRuntime.partnerLeft
          ? "Your answers are saved on this phone. The phones keep trying to reconnect by themselves — or choose how to finish below."
          : "Your answers are saved on this phone. Choose how to finish below.";
      app.innerHTML = `<section class="screen nearby-screen" aria-labelledby="nearby-wait-title"><div class="nearby-card" style="text-align:center"><div class="celebration-orb" aria-hidden="true">⌁</div><p class="eyebrow">Your answers are locked in</p><h2 id="nearby-wait-title">${heading}</h2><p class="lede">${lede}</p>
        ${answered !== null ? `<div class="partner-progress"><div class="partner-progress-label"><span>${partner}</span><span>${answered} of ${total} answered</span></div><div class="partner-progress-bar" role="progressbar" aria-label="${partner}’s progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answered}"><span style="width:${(answered / Math.max(1, total)) * 100}%"></span></div></div>` : ""}
        ${showFallback ? "" : statusBlock}${fallback}</div></section>`;
      document.getElementById("nearby-retry")?.addEventListener("click", retryNearbyConnection);
      document.getElementById("nearby-repair")?.addEventListener("click", repairNearbyRound);
      document.getElementById("nearby-finish-here")?.addEventListener("click", finishNearbyRoundOnThisDevice);
    }

    function focusKeyFor(element) {
      if (!(element instanceof Element) || !app.contains(element)) return "";
      if (element.id) return `#${CSS.escape(element.id)}`;
      const parts = [...element.attributes]
        .filter((attribute) => attribute.name.startsWith("data-") || attribute.name === "name" || (attribute.name === "value" && element.matches("input[type=radio], input[type=checkbox]")))
        .map((attribute) => `[${attribute.name}="${CSS.escape(attribute.value)}"]`);
      return parts.length ? element.tagName.toLowerCase() + parts.join("") : "";
    }

    let lastRenderedQuestionKey = "";
    let lastScreenChangeAt = 0;
    let lastScreenSettledAt = -Infinity;
    let lastExportAt = 0;

    // Compact shrinks the root, so rem-sized captions written for Standard can fall under 12 px.
    // Rather than chase every selector, lift whatever actually renders smaller (decorative glyphs excepted).
    function enforceCompactFloor() {
      document.querySelectorAll("[data-compact-floor]").forEach((element) => { element.style.removeProperty("font-size"); element.removeAttribute("data-compact-floor"); });
      if (state.textSize !== "small") return;
      document.documentElement.classList.add("measuring-text");
      document.querySelectorAll("#app *, .topbar *, .bottom-nav *").forEach((element) => {
        if (element.closest(".text-size-option, svg, .reveal-buddy, .progress-star, .pass-person, .card-spark, .question-decor") || element.matches(".type-chip") || !element.textContent.trim()) return;
        if (parseFloat(getComputedStyle(element).fontSize) < 11.95) {
          element.style.setProperty("font-size", "12px", "important");
          element.setAttribute("data-compact-floor", "");
        }
      });
      document.documentElement.classList.remove("measuring-text");
    }

    function render() {
      const previousFocusKey = focusKeyFor(document.activeElement);
      if (state.screen === "nearby-wait" && state.nearbyRemote) {
        finishNearbyRoundIfReady();
        if (state.screen !== "nearby-wait") return;
      }
      const screenChanged = lastRenderedScreen !== state.screen;
      if (screenChanged && state.screen !== "setup") document.querySelector("#tutorial-finish")?.closest(".modal-backdrop")?.remove();
      if (["question", "celebration", "reveal", "nearby-wait"].includes(state.screen) && !state.tutorialSeen) state.tutorialSeen = true;
      if (screenChanged) lastScreenChangeAt = Date.now();
      if (screenChanged && state.screen === "reveal" && state.playStyle === "nearby" && state.nearbyRoundId) {
        sendNearbyMessage({ type: "reveal-state", roundId: state.nearbyRoundId, revealedIds: [...state.revealedIds] });
      }
      lastRenderedScreen = state.screen;
      cleanupResponsiveRender();
      cleanupResponsiveRender = () => {};
      applyPreferences();
      document.title = {
        reveal: "Your Reveal Board — Aligned",
        library: "Question Library — Aligned",
        results: "Results Journal — Aligned",
        settings: "Settings — Aligned",
        question: "Answering — Aligned",
        intermission: "Pass the device — Aligned",
        celebration: "Round complete — Aligned",
        nearby: "Two phones — Aligned",
        "nearby-wait": "Waiting for your partner — Aligned"
      }[state.screen] || "Aligned — Discover How Well You Align";

      if (state.screen === "question") renderQuestion();
      else if (state.screen === "intermission") renderIntermission();
      else if (state.screen === "celebration") renderCelebration();
      else if (state.screen === "reveal") renderReveal();
      else if (state.screen === "library") renderLibrary();
      else if (state.screen === "results") renderResults();
      else if (state.screen === "settings") renderSettings();
      else if (state.screen === "nearby") renderNearby();
      else if (state.screen === "nearby-wait") renderNearbyWait();
      else renderSetup();

      homeButton.hidden = false;
      const screenTitle = document.getElementById(app.querySelector(".screen[aria-labelledby]")?.getAttribute("aria-labelledby") || "");
      if (screenTitle && screenTitle.tagName !== "H1") { screenTitle.setAttribute("role", "heading"); screenTitle.setAttribute("aria-level", "1"); }
      armBackGuard();
      enforceCompactFloor();
      bottomNav.querySelectorAll("[data-app-route]").forEach((button) => {
        button.classList.toggle("active", button.dataset.appRoute === state.screen || (state.screen === "setup" && button.dataset.appRoute === "setup"));
        if (button.classList.contains("active")) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
      if (screenChanged) {
        window.scrollTo({ top: 0, behavior: "auto" });
      } else {
        const screenEl = app.querySelector(".screen");
        if (screenEl) {
          screenEl.classList.add("no-enter");
        }
      }
      // Re-rendering replaces the focused control; move keyboard and screen-reader focus to the new heading.
      // A new question starts at the top of the card so the progress header and prompt are visible.
      const questionKey = state.screen === "question" ? `${state.activePlayer}:${state.questionIndex}` : "";
      if (questionKey && questionKey !== lastRenderedQuestionKey && !screenChanged) {
        app.querySelector(".question-screen")?.scrollIntoView({ block: "start", behavior: motionReduced() ? "auto" : "smooth" });
      }
      if (screenChanged || (questionKey && questionKey !== lastRenderedQuestionKey)) {
        lastScreenSettledAt = performance.now();
        requestAnimationFrame(() => { lastScreenSettledAt = performance.now(); });
      }
      const questionChanged = Boolean(questionKey) && lastRenderedQuestionKey !== questionKey;
      lastRenderedQuestionKey = questionKey;
      const focusLost = !document.activeElement || document.activeElement === document.body || !document.contains(document.activeElement);
      if (hasRenderedOnce && focusLost && !document.querySelector(".modal-backdrop")) {
        let restored = null;
        if (!screenChanged && !questionChanged && previousFocusKey && !(questionKey && previousFocusKey.includes("submit"))) {
          try { restored = app.querySelector(previousFocusKey); } catch {}
        }
        if (restored) restored.focus({ preventScroll: true });
        else focusScreenHeading();
      }
      hasRenderedOnce = true;
      syncPressedStates();
      updateNearbyBanner();
    }

    let hasRenderedOnce = false;

    // Partial re-renders (library list, settings sections) replace the focused control; put focus back on its
    // equivalent so keyboard users keep their place.
    new MutationObserver(() => {
      if (!hasRenderedOnce || !lastFocusKey || document.querySelector(".modal-backdrop")) return;
      if (document.activeElement && document.activeElement !== document.body) return;
      if (lastFocusOutsideModal && lastFocusOutsideModal.isConnected) return;
      let element = null;
      try { element = app.querySelector(lastFocusKey); } catch {}
      if (element && element.matches("input:not([type=range]):not([type=checkbox]):not([type=radio]), textarea")) return;
      const closedMenu = element?.closest("details:not([open])");
      (closedMenu ? closedMenu.querySelector("summary") : element)?.focus({ preventScroll: true });
    }).observe(app, { childList: true, subtree: true });

    // Android app shell: the hardware Back button closes dialogs first, then returns to Home.
    // Cards opened by hand on the reveal board, oldest first; Back closes the newest before leaving the board.
    let openedCards = [];
    window.alignedHandleBack = () => {
      const openMenu = document.querySelector(".session-dropdown-container.open");
      if (openMenu) {
        openMenu.classList.remove("open");
        const trigger = openMenu.querySelector(".session-dropdown-trigger");
        trigger?.setAttribute("aria-expanded", "false");
        trigger?.focus();
        return true;
      }
      const overlays = document.querySelectorAll(".modal-backdrop");
      if (overlays.length) {
        const overlay = overlays[overlays.length - 1];
        const cancel = overlay.querySelector(MODAL_CANCEL_SELECTOR);
        if (cancel) cancel.click();
        else overlay.remove();
        return true;
      }
      const focusedCard = document.activeElement?.closest?.(".flip-card.flipped");
      openedCards = openedCards.filter((card) => card.isConnected && card.classList.contains("flipped"));
      const lastCard = openedCards.pop() || null;
      // Cards opened by hand close one Back at a time (newest first); "Reveal all" cards don't hold Back hostage.
      const openCard = state.screen === "reveal" ? focusedCard || lastCard : null;
      if (openCard) {
        openCard.querySelector(".card-close-button")?.click();
        return true;
      }
      if (state.screen !== "setup") {
        navigateToScreen("setup");
        return true;
      }
      return false;
    };

    // Browser and installed-PWA Back mirrors the Android shell: close a dialog, then return Home,
    // and only then leave. One guard entry sits on the history stack while there is somewhere to go back to.
    // After a reload the current entry may already be our guard; reuse it instead of stacking another.
    let backGuardArmed = Boolean(history.state && history.state.alignedBack);
    function armBackGuard() {
      if (window.AlignedAndroid || backGuardArmed) return;
      if (state.screen === "setup" && !document.querySelector(".modal-backdrop, .session-dropdown-container.open")) return;
      try {
        history.pushState({ alignedBack: true }, "", location.href);
        backGuardArmed = true;
      } catch {}
    }
    window.addEventListener("popstate", () => {
      if (!backGuardArmed) return;
      backGuardArmed = false;
      // Opening a join link in an open app is a hash navigation, not Back; the hashchange handler owns it.
      if (location.hash.includes("join=")) return;
      // Nothing left to close or leave in-app: finish the Back the person asked for.
      if (window.alignedHandleBack()) armBackGuard();
      else history.back();
    });

    function savedQuestionAnswersMarkup(question, round) {
      const playerColors = state.visualTheme === "pastel" ? ["#1d4ed8", "#15803d"] : ["#60a5fa", "#4ade80"];
      const answers = [0, 1].map((playerIndex) => {
        const rawAnswer = round.answers?.[playerIndex]?.[question.id];
        const rawComment = round.comments?.[playerIndex]?.[question.id];
        const answer = question.type === "slider" && rawAnswer !== "" && rawAnswer != null
          ? (pickLabel(question, rawAnswer) || `${rawAnswer} / 10`)
          : (typeof rawAnswer === "string" && rawAnswer ? rawAnswer : "No saved answer");
        const comment = String(rawComment || "").trim();
        return `
          <div class="saved-answer" style="--saved-player-color: ${playerColors[playerIndex]}">
            <span class="saved-answer-name">${escapeHTML(round.names?.[playerIndex] || `Player ${playerIndex + 1}`)}</span>
            <span class="saved-answer-value">${escapeHTML(answer)}</span>
            ${comment ? `<span class="saved-answer-comment">“${escapeHTML(comment)}”</span>` : ""}
          </div>
        `;
      }).join("");
      return `
        <div class="saved-round">
          <span class="saved-round-date">${escapeHTML(formatRoundDate(round.completedAt))}</span>
          <div class="saved-answer-grid">${answers}</div>
        </div>
      `;
    }

    function renderLibrary() {
      const catalog = getQuestionCatalog();
      const answeredIds = new Set(state.answeredQuestionIds);
      const excludedIds = new Set(state.excludedQuestionIds);
      const neverIds = new Set(state.neverQuestionIds);
      const favoriteIds = new Set(state.favoriteQuestionIds);
      const answeredCount = catalog.filter((question) => answeredIds.has(question.id)).length;

      const progressCards = TOPIC_OPTIONS.map((topic) => {
        const questions = catalog.filter((question) => question.topic === topic.id);
        const answered = questions.filter((question) => answeredIds.has(question.id)).length;
        const percent = questions.length ? (answered / questions.length) * 100 : 0;
        return `
          <button class="topic-progress-card ${libraryView.topic === topic.id ? "active" : ""}" type="button" data-library-topic="${topic.id}" style="--topic-color: ${topicColor(topic.tone)}; --topic-progress: ${percent}%">
            <span class="topic-progress-top"><span>${topic.icon} ${topic.label}</span><strong>${answered}/${questions.length}</strong></span>
            <span class="topic-progress-track"><span class="topic-progress-fill"></span></span>
          </button>
        `;
      }).join("");

      app.innerHTML = `
        <section class="screen library-screen" aria-labelledby="library-title">
          <div class="library-header">
            <div>
              <p class="eyebrow">Every prompt, your way</p>
              <h2 id="library-title">Question <span class="accent-text">Library</span></h2>
              <p class="lede">Track what you have explored, exclude prompts, or add questions that are uniquely yours.</p>
            </div>
            <div class="library-overall"><strong>${answeredCount}/${catalog.length}</strong><span>questions answered together</span></div>
          </div>

          <div class="topic-progress-grid">${progressCards}</div>

          <details class="library-add" id="library-add">
            <summary>Add your own question</summary>
            <form class="custom-form" id="custom-question-form" novalidate>
              <div class="custom-form-grid">
                <label class="custom-label custom-full">Question prompt
                  <textarea class="comment-textarea custom-prompt" id="custom-prompt" maxlength="500" placeholder="What would you love to ask each other?"></textarea>
                </label>
                <label class="custom-label">Answer type
                  <select class="custom-select" id="custom-type">
                    <option value="slider">Slider (1–10)</option>
                    <option value="text">Written answer</option>
                  </select>
                </label>
                <label class="custom-label">Question pack
                  <select class="custom-select" id="custom-topic">
                    ${TOPIC_OPTIONS.map((topic) => `<option value="${topic.id}">${topic.label}</option>`).join("")}
                  </select>
                </label>
                <label class="custom-label" data-slider-label>Left label
                  <input class="custom-input" id="custom-left-label" maxlength="50" placeholder="Low / Never / Option A">
                </label>
                <label class="custom-label" data-slider-label>Right label
                  <input class="custom-input" id="custom-right-label" maxlength="50" placeholder="High / Always / Option B">
                </label>
              </div>
              <p class="error" id="custom-error" role="alert"></p>
              <div class="actions"><button class="primary-btn" type="submit">Add to library</button></div>
            </form>
          </details>

          <details class="library-add" id="pack-builder" ${libraryView.packBuilderOpen ? "open" : ""}>
            <summary>Create a named pack from favorites</summary>
            <div class="custom-form">
              <p class="topic-note">Favorite questions with the ★ button, then save them together as a replayable pack.</p>
              <div class="field-grid" style="margin-top:12px">
                <label for="pack-name">Pack name<input class="custom-input" id="pack-name" maxlength="60" placeholder="Sunday night check-in"></label>
                <div class="actions" style="align-self:end;margin-top:0"><button class="primary-btn" id="save-favorite-pack" type="button">Save ${favoriteIds.size} ${favoriteIds.size === 1 ? "favorite" : "favorites"}</button></div>
              </div>
              ${state.customPacks.length ? `<div class="library-filters" style="margin-top:14px">${state.customPacks.map((pack) => `<span class="library-filter active saved-pack-chip" title="Play it from Home under “Your packs”">${escapeHTML(pack.name)} · ${pack.questionIds.length}Q <button type="button" data-delete-pack="${escapeHTML(pack.id)}" aria-label="Delete ${escapeHTML(pack.name)}" style="border:0;color:inherit;background:transparent;cursor:pointer;min-width:44px;min-height:44px">×</button></span>`).join("")}</div>` : ""}
              <p class="error" id="pack-error" role="alert"></p>
            </div>
          </details>

          <div class="library-controls">
            <input class="library-search" id="library-search" type="search" placeholder="Search all ${catalog.length} questions…" value="${escapeHTML(libraryView.search)}" aria-label="Search questions">
            <div class="library-filters" aria-label="Question status filters">
              ${[
                ["all", "All"],
                ["answered", "Answered"],
                ["unanswered", "Unanswered"],
                ["favorites", "★ Favorites"],
                ["excluded", "Excluded"],
                ["never", "Never ask"],
                ["valuable", "Valuable"],
                ["uncomfortable", "Uncomfortable"]
              ].map(([value, label]) => `<button class="library-filter ${libraryView.filter === value ? "active" : ""}" type="button" data-library-filter="${value}">${label}</button>`).join("")}
              <button class="library-filter ${libraryView.topic === "all" ? "active" : ""}" id="all-library-topics" type="button">All packs</button>
            </div>
          </div>
          <div class="question-library-list" id="question-library-list" aria-live="polite"></div>
        </section>
      `;

      const list = document.getElementById("question-library-list");

      function renderQuestionList() {
        const search = normalizeAnswer(libraryView.search);
        const filtered = catalog.filter((question) => {
          const answered = answeredIds.has(question.id);
          const excluded = excludedIds.has(question.id);
          const never = neverIds.has(question.id);
          const favorite = favoriteIds.has(question.id);
          const matchesStatus = libraryView.filter === "all"
            || (libraryView.filter === "answered" && answered)
            || (libraryView.filter === "unanswered" && !answered)
            || (libraryView.filter === "favorites" && favorite)
            || (libraryView.filter === "excluded" && excluded)
            || (libraryView.filter === "never" && never)
            || (libraryView.filter === "valuable" && (state.questionFlags[question.id] || []).includes("valuable"))
            || (libraryView.filter === "uncomfortable" && (state.questionFlags[question.id] || []).includes("uncomfortable"));
          const matchesTopic = libraryView.topic === "all" || question.topic === libraryView.topic;
          const matchesSearch = !search || normalizeAnswer(`${question.prompt} ${question.category} ${(question.tags || []).join(" ")}`).includes(search);
          return matchesStatus && matchesTopic && matchesSearch;
        });

        if (!filtered.length) {
          list.innerHTML = `<div class="library-empty">No questions match these filters yet.</div>`;
          return;
        }

        const visible = filtered.slice(0, libraryView.limit);
        list.innerHTML = visible.map((question) => {
          const answered = answeredIds.has(question.id);
          const excluded = excludedIds.has(question.id);
          const never = neverIds.has(question.id);
          const favorite = favoriteIds.has(question.id);
          const custom = question.id.startsWith("custom_");
          const escapedQuestionId = escapeHTML(question.id);
          const topic = TOPIC_OPTIONS.find((option) => option.id === question.topic);
          const answerHistory = state.completedRounds
            .filter((round) => round.questionIds.includes(question.id))
            .slice()
            .reverse();
          return `
            <article class="library-question ${answered ? "answered" : ""} ${excluded || never ? "excluded" : ""}">
              <span class="question-status" aria-label="${answered ? "Answered" : "Not answered"}">${answered ? "✓" : "·"}</span>
              <div class="library-question-copy">
                <strong>${escapeHTML(question.prompt)}</strong>
                <div class="library-question-meta">
                  <span>${topic?.icon || "•"} ${escapeHTML(topic?.label || question.category)}</span>
                  <span>${question.type === "slider" ? "↔ Slider" : "✎ Written"}</span>
                  ${custom ? "<span>Custom</span>" : ""}
                  ${excluded ? "<span>Excluded from rounds</span>" : ""}
                  ${never ? "<span>Never ask again</span>" : ""}
                </div>
                <div class="question-tags">${(question.tags || []).map((tag) => `<span class="question-tag">#${escapeHTML(tag)}</span>`).join("")}</div>
                ${answerHistory.length ? `
                  <details class="library-answer-history">
                    <summary>Saved answers · ${answerHistory.length} ${answerHistory.length === 1 ? "round" : "rounds"}</summary>
                    <div class="saved-round-list">
                      ${answerHistory.map((round) => savedQuestionAnswersMarkup(question, round)).join("")}
                    </div>
                  </details>
                ` : ""}
              </div>
              <div class="question-library-actions">
                <button class="favorite-button ${favorite ? "active" : ""}" type="button" data-favorite-question="${escapedQuestionId}" aria-label="${favorite ? "Remove from" : "Add to"} favorites" aria-pressed="${favorite}">★</button>
                <button class="question-library-action" type="button" data-exclude-question="${escapedQuestionId}">${excluded ? "Include" : "Exclude"}</button>
                <button class="question-library-action" type="button" data-never-question="${escapedQuestionId}">${never ? "Allow again" : "Never ask"}</button>
                <button class="question-library-action" type="button" data-edit-question="${escapedQuestionId}">Edit</button>
                <button class="question-library-action" type="button" data-duplicate-question="${escapedQuestionId}">Make a variation</button>
                <details class="feedback-menu"><summary>Feedback</summary><div class="feedback-actions">${[["valuable", "Valuable"], ["uncomfortable", "Uncomfortable"], ["rewrite", "Needs rewrite"]].map(([value, label]) => `<button class="question-library-action ${(state.questionFlags[question.id] || []).includes(value) ? "active" : ""}" type="button" data-question-flag="${value}" data-flag-question="${escapedQuestionId}">${label}</button>`).join("")}</div></details>
                ${custom ? `<button class="question-library-action" type="button" data-delete-question="${escapedQuestionId}">Delete</button>` : ""}
              </div>
            </article>
          `;
        }).join("") + (visible.length < filtered.length ? `<div class="library-load-more"><button class="secondary-btn" id="load-more-questions" type="button">Load 40 more · ${visible.length}/${filtered.length} shown</button></div>` : "");

        document.getElementById("load-more-questions")?.addEventListener("click", () => {
          libraryView.limit += 40;
          renderQuestionList();
        });

        list.querySelectorAll("[data-edit-question]").forEach((button) => button.addEventListener("click", () => openQuestionEditor(button.dataset.editQuestion)));
        list.querySelectorAll("[data-duplicate-question]").forEach((button) => button.addEventListener("click", () => {
          const source = getQuestionCatalog().find((question) => question.id === button.dataset.duplicateQuestion);
          if (!source) return;
          const topicLabel = TOPIC_OPTIONS.find((topic) => topic.id === source.topic)?.label || "Connection";
          const draft = { id: `custom_${Date.now()}_${randomIndex(1000000)}`, topic: source.topic, category: `Custom · ${topicLabel}`, type: source.type, prompt: source.prompt, tags: [...(source.tags || [])], ...(source.type === "slider" ? { labels: [...source.labels] } : {}) };
          openQuestionEditor(draft.id, draft);
        }));
        list.querySelectorAll("[data-question-flag]").forEach((button) => button.addEventListener("click", () => {
          const id = button.dataset.flagQuestion;
          const value = button.dataset.questionFlag;
          const flags = new Set(state.questionFlags[id] || []);
          if (flags.has(value)) flags.delete(value); else flags.add(value);
          state.questionFlags[id] = [...flags];
          saveState();
          playSound(value === "valuable" && (state.questionFlags[id] || []).includes("valuable") ? "match" : "tap");
          renderQuestionList();
        }));

        list.querySelectorAll("[data-exclude-question]").forEach((button) => {
          button.addEventListener("click", () => {
            const id = button.dataset.excludeQuestion;
            if (excludedIds.has(id)) {
              excludedIds.delete(id);
              state.excludedQuestionIds = state.excludedQuestionIds.filter((questionId) => questionId !== id);
            } else {
              excludedIds.add(id);
              state.excludedQuestionIds = [...new Set([...state.excludedQuestionIds, id])];
            }
            saveState();
            playSound("tap");
            renderQuestionList();
          });
        });

        list.querySelectorAll("[data-favorite-question]").forEach((button) => {
          button.addEventListener("click", () => {
            const id = button.dataset.favoriteQuestion;
            if (favoriteIds.has(id)) {
              favoriteIds.delete(id);
              state.favoriteQuestionIds = state.favoriteQuestionIds.filter((questionId) => questionId !== id);
            } else {
              favoriteIds.add(id);
              state.favoriteQuestionIds = [...new Set([...state.favoriteQuestionIds, id])];
            }
            saveState();
            const packButton = document.getElementById("save-favorite-pack");
            if (packButton) packButton.textContent = `Save ${favoriteIds.size} ${favoriteIds.size === 1 ? "favorite" : "favorites"}`;
            playSound("tap");
            renderQuestionList();
          });
        });

        list.querySelectorAll("[data-never-question]").forEach((button) => {
          button.addEventListener("click", () => {
            const id = button.dataset.neverQuestion;
            if (neverIds.has(id)) {
              neverIds.delete(id);
              state.neverQuestionIds = state.neverQuestionIds.filter((questionId) => questionId !== id);
            } else {
              neverIds.add(id);
              state.neverQuestionIds = [...new Set([...state.neverQuestionIds, id])];
              state.excludedQuestionIds = state.excludedQuestionIds.filter((questionId) => questionId !== id);
              excludedIds.delete(id);
            }
            saveState(); playSound("delete"); renderQuestionList();
          });
        });

        list.querySelectorAll("[data-delete-question]").forEach((button) => {
          button.addEventListener("click", async () => {
            const id = button.dataset.deleteQuestion;
            const confirmed = await openConfirmDialog({
              eyebrow: "Custom question",
              title: "Delete this question?",
              copy: "It will be removed from your library and future rounds. Saved round history keeps its answers.",
              confirmLabel: "Delete question",
              cancelLabel: "Keep it",
              danger: true
            });
            if (!confirmed) return;
            window.setTimeout(() => (document.querySelector("[data-delete-question]") || document.getElementById("library-search"))?.focus({ preventScroll: true }), 0);
            state.customQuestions = state.customQuestions.filter((question) => question.id !== id);
            state.excludedQuestionIds = state.excludedQuestionIds.filter((questionId) => questionId !== id);
            state.neverQuestionIds = state.neverQuestionIds.filter((questionId) => questionId !== id);
            state.favoriteQuestionIds = state.favoriteQuestionIds.filter((questionId) => questionId !== id);
            delete state.questionEdits[id];
            delete state.questionFlags[id];
            delete state.questionTagOverrides[id];
            state.customPacks = state.customPacks.map((pack) => ({ ...pack, questionIds: pack.questionIds.filter((questionId) => questionId !== id) }));
            state.answeredQuestionIds = state.answeredQuestionIds.filter((questionId) => questionId !== id);
            saveState();
            playSound("delete");
            renderLibrary();
          });
        });
      }

      document.getElementById("library-search").addEventListener("input", (event) => {
        libraryView.search = event.currentTarget.value;
        libraryView.limit = 40;
        renderQuestionList();
      });

      document.querySelectorAll("[data-library-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          libraryView.filter = button.dataset.libraryFilter;
          libraryView.limit = 40;
          document.querySelectorAll("[data-library-filter]").forEach((item) => item.classList.toggle("active", item === button));
          playSound("tap");
          renderQuestionList();
        });
      });

      document.getElementById("all-library-topics").addEventListener("click", (event) => {
        libraryView.topic = "all";
        libraryView.limit = 40;
        document.querySelectorAll("[data-library-topic]").forEach((card) => card.classList.remove("active"));
        event.currentTarget.classList.add("active");
        playSound("tap");
        renderQuestionList();
      });

      document.querySelectorAll("[data-library-topic]").forEach((card) => {
        card.addEventListener("click", () => {
          libraryView.topic = card.dataset.libraryTopic;
          libraryView.limit = 40;
          document.querySelectorAll("[data-library-topic]").forEach((item) => item.classList.toggle("active", item === card));
          document.getElementById("all-library-topics").classList.remove("active");
          playSound("tap");
          renderQuestionList();
        });
      });

      const customType = document.getElementById("custom-type");
      customType.addEventListener("change", () => {
        document.querySelectorAll("[data-slider-label]").forEach((field) => {
          field.hidden = customType.value !== "slider";
        });
        playSound("tap");
      });

      document.getElementById("custom-question-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const prompt = document.getElementById("custom-prompt").value.trim();
        const type = customType.value;
        const topic = document.getElementById("custom-topic").value;
        const leftLabel = document.getElementById("custom-left-label").value.trim();
        const rightLabel = document.getElementById("custom-right-label").value.trim();
        const error = document.getElementById("custom-error");
        if (!prompt) {
          playSound("error"); error.textContent = "Add a question prompt first.";
          const promptField = document.getElementById("custom-prompt");
          promptField.addEventListener("input", () => { error.textContent = ""; }, { once: true });
          promptField.focus();
          return;
        }
        if (type === "slider" && (!leftLabel || !rightLabel)) {
          playSound("error"); error.textContent = "Add both slider endpoint labels.";
          (leftLabel ? document.getElementById("custom-right-label") : document.getElementById("custom-left-label")).focus();
          return;
        }
        const topicLabel = TOPIC_OPTIONS.find((option) => option.id === topic)?.label || "Connection";
        state.customQuestions.push({
          id: `custom_${Date.now()}_${randomIndex(1000000)}`,
          topic,
          category: `Custom · ${topicLabel}`,
          type,
          prompt,
          ...(type === "slider" ? { labels: [leftLabel, rightLabel] } : {})
        });
        saveState();
        playSound("unlock");
        libraryView = { ...libraryView, filter: "all", topic: "all", search: prompt.slice(0, 60) };
        renderLibrary();
        showToast("Added to your library. It’s shown below — clear the search to see everything.");
      });

      document.getElementById("pack-name")?.addEventListener("input", () => { const packError = document.getElementById("pack-error"); if (packError) packError.textContent = ""; });
      document.getElementById("save-favorite-pack").addEventListener("click", () => {
        const name = document.getElementById("pack-name").value.trim();
        const error = document.getElementById("pack-error");
        if (!name) { playSound("error"); error.textContent = "Give this pack a name first."; document.getElementById("pack-name")?.focus(); return; }
        if (!state.favoriteQuestionIds.length) { playSound("error"); error.textContent = "Favorite at least one question first."; return; }
        if (state.customPacks.some((pack) => pack.name.toLowerCase() === name.toLowerCase())) { playSound("error"); error.textContent = "You already have a pack with that name."; return; }
        state.customPacks.push({ id: `pack_${Date.now()}_${randomIndex(100000)}`, name, questionIds: [...state.favoriteQuestionIds] });
        libraryView.packBuilderOpen = true;
        saveState(); playSound("unlock"); renderLibrary();
        showToast(`Saved “${name}” — play it from Home under Your packs.`);
      });

      document.querySelectorAll("[data-delete-pack]").forEach((button) => {
        button.addEventListener("click", async () => {
          const pack = state.customPacks.find((item) => item.id === button.dataset.deletePack);
          if (!pack) return;
          const sure = await openConfirmDialog({ eyebrow: "Your packs", title: `Delete “${pack.name}”?`, copy: "The questions stay in your library; only this saved pack is removed.", confirmLabel: "Delete pack", cancelLabel: "Keep it", danger: true, safeFirst: true });
          if (!sure) return;
          state.customPacks = state.customPacks.filter((item) => item.id !== pack.id);
          libraryView.packBuilderOpen = true;
          saveState(); playSound("delete"); renderLibrary();
          showToast(`Deleted “${pack.name}”.`);
          window.setTimeout(() => (document.querySelector("[data-delete-pack]") || document.getElementById("pack-name"))?.focus({ preventScroll: true }), 50);
        });
      });

      renderQuestionList();
    }

    function openQuestionEditor(questionId, draft = null) {
      const question = draft || getQuestionCatalog().find((item) => item.id === questionId);
      if (!question) return;
      const isCustom = question.id.startsWith("custom_");
      const existingTags = draft ? draft.tags : (state.questionTagOverrides[question.id] || []);
      const overlay = document.createElement("div");
      overlay.className = "modal-backdrop";
      overlay.innerHTML = `
        <section class="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-question-title">
          <p class="eyebrow">Make it yours</p>
          <h2 id="edit-question-title">${draft ? "New variation" : "Edit question"}</h2>
          <label class="custom-label">Prompt<textarea class="comment-textarea" id="edit-question-prompt" maxlength="500">${escapeHTML(question.prompt)}</textarea></label>
          ${question.type === "slider" ? `<div class="field-grid" style="margin-top:12px"><label>Left label<input class="custom-input" id="edit-left-label" maxlength="60" value="${escapeHTML(question.labels?.[0] || "Low")}"></label><label>Right label<input class="custom-input" id="edit-right-label" maxlength="60" value="${escapeHTML(question.labels?.[1] || "High")}"></label></div>` : ""}
          <label class="custom-label" style="margin-top:12px">Search tags<input class="custom-input" id="edit-question-tags" maxlength="180" value="${escapeHTML(existingTags.join(", "))}" placeholder="communication, travel, boundaries"></label>
          <p class="topic-note">Separate tags with commas. ${draft ? "Your variation is saved as a new custom question; the original stays unchanged." : "Editing keeps the original question ID, history, and saved answers intact."}</p>
          <p class="error" id="edit-question-error" role="alert"></p>
          <div class="dialog-actions"><button class="secondary-btn" id="cancel-question-edit" type="button">Cancel</button>${!isCustom && state.questionEdits[question.id] ? '<button class="text-btn" id="restore-question" type="button">Restore original</button>' : ""}<button class="primary-btn" id="save-question-edit" type="button">Save changes</button></div>
        </section>`;
      overlay.querySelector("#cancel-question-edit").addEventListener("click", () => overlay.remove());
      overlay.querySelector("#restore-question")?.addEventListener("click", () => {
        delete state.questionEdits[question.id];
        delete state.questionTagOverrides[question.id];
        saveState(); overlay.remove(); renderLibrary(); playSound("unlock");
      });
      overlay.querySelector("#save-question-edit").addEventListener("click", () => {
        const prompt = overlay.querySelector("#edit-question-prompt").value.trim();
        if (!prompt) { overlay.querySelector("#edit-question-error").textContent = "The question needs a prompt."; return; }
        const labels = question.type === "slider" ? [overlay.querySelector("#edit-left-label").value.trim(), overlay.querySelector("#edit-right-label").value.trim()] : undefined;
        if (question.type === "slider" && labels.some((label) => !label)) { overlay.querySelector("#edit-question-error").textContent = "Add both slider labels."; return; }
        if (draft) {
          const { tags, ...fields } = draft;
          state.customQuestions.push({ ...fields, prompt, ...(labels ? { labels } : {}) });
        } else if (isCustom) {
          const target = state.customQuestions.find((item) => item.id === question.id);
          if (target) { target.prompt = prompt; if (labels) target.labels = labels; }
        } else {
          state.questionEdits[question.id] = { prompt, ...(labels ? { labels } : {}) };
        }
        state.questionTagOverrides[question.id] = [...new Set(overlay.querySelector("#edit-question-tags").value.split(",").map((tag) => normalizeAnswer(tag)).filter(Boolean))].slice(0, 12);
        if (draft) libraryView = { ...libraryView, filter: "all", topic: "all", search: prompt.slice(0, 60) };
        saveState(); overlay.remove(); renderLibrary(); playSound("match");
        if (draft) showToast("Variation added to your library. It’s shown below — clear the search to see everything.");
      });
      document.body.appendChild(overlay);
      const promptEditor = overlay.querySelector("#edit-question-prompt");
      promptEditor.focus();
      promptEditor.setSelectionRange?.(promptEditor.value.length, promptEditor.value.length);
    }

    function renderResults() {
      const rounds = [...state.completedRounds].filter((round) => !roundScoresHidden(round)).reverse();
      if (!rounds.length && revealUnfinished()) {
        app.innerHTML = `
          <section class="screen results-screen" aria-labelledby="results-title">
            <p class="eyebrow">Results Journal</p>
            <h2 id="results-title">Your scores unlock on <span class="accent-text">the reveal board.</span></h2>
            <p class="lede">${revealRemainingCopy() ? `Still to do: ${escapeHTML(revealRemainingCopy())} — then this round joins your Journal.` : "Everything’s revealed — your scores are ready on the reveal board."}</p>

      if (!rounds.length) {

          const validIds = new Set(getQuestionCatalog().map((question) => question.id));

          const selectedTopics = [...new Set(ids.map((id) => getQuestionCatalog().find((question) => question.id === id)?.topic).filter(Boolean))];

    function openPrivateReflections(roundId, playerIndex) {
      const round = state.completedRounds.find((item) => item.id === roundId);
      if (!round) return;
      const notes = round.privateNotes?.[playerIndex] || {};
      const entries = Object.entries(notes).filter(([, value]) => String(value || "").trim());
      const overlay = document.createElement("div");
      overlay.className = "modal-backdrop";
      overlay.innerHTML = `

              return `<div class="saved-round"><strong style="display:block;font-size:.72rem">${escapeHTML(question?.prompt || "Saved question")}</strong><p class="answer-copy" style="margin-top:7px">${escapeHTML(value)}</p></div>`;

        if (state.privatePinHash) {
          const pin = await requestSecret({ title: "Unlock private reflections", copy: `Enter the device PIN for ${round.names[playerIndex]}'s private notes.`, confirmLabel: "Unlock notes", minimum: 4 });

        document.getElementById("private-note-content").hidden = false;

        overlay.querySelector("#close-reflections")?.focus();

      }));
      document.getElementById("settings-sound").addEventListener("change", (event) => { state.soundEnabled = event.currentTarget.checked; saveState(); applyPreferences(); playSound("tap"); });

          const pausedRound = state.selectedQuestionIds.length > 0 && [...Object.keys(state.answers[0] || {}), ...Object.keys(state.answers[1] || {})].length > 0
            && !["celebration", "reveal"].includes(state.screen === "setup" ? "" : state.screen) && Boolean(state.resumeScreen || ["question", "intermission", "nearby-wait"].includes(state.screen));

            const roundsHere = state.completedRounds.length;
            const roundsThere = importedState.completedRounds?.length || 0;
            const plural = (count) => `${count} saved round${count === 1 ? "" : "s"}`;
            const replace = await openConfirmDialog({
              eyebrow: "Import backup",
              title: "Replace this device's game data?",
              copy: `Everything on this device${pausedRound ? ", including your paused round," : ""}${state.customPacks.length ? ` and your ${state.customPacks.length} saved pack${state.customPacks.length === 1 ? "" : "s"},` : ""} will be replaced by the backup (${plural(roundsThere)}${roundsHere ? `; this device has ${plural(roundsHere)}` : ""}). Export a backup first if you want to keep both.`,
              confirmLabel: "Replace with backup",
              cancelLabel: "Keep current data",
              danger: true
            });
            if (!replace) {
              status.style.color = "";
              status.textContent = "Import cancelled. Nothing was changed.";
              return;
            }
          }
          const previousSave = localStorage.getItem(STORAGE_KEY);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(importedState));
          loadStateFailed = false;
          const importedLoaded = loadState();
          if (loadStateFailed) {
            if (previousSave === null) localStorage.removeItem(STORAGE_KEY); else localStorage.setItem(STORAGE_KEY, previousSave);
            throw new Error("This backup has data Aligned can’t read safely. Nothing was changed.");
          }
          state = importedLoaded;
          libraryView = { filter: "all", topic: "all", search: "", limit: 40 };
          playSound("match");
          render();
          showToast("Backup imported successfully. Your saved state is restored.");
          document.getElementById("import-data")?.focus({ preventScroll: true });
        } catch (importError) {
          const message = String(importError?.message || "");
          if (message === "Import cancelled.") {
            status.textContent = "Import cancelled. Nothing was changed.";
            return;
          }
          status.style.color = "var(--coral)";
          status.textContent = importError instanceof SyntaxError
            ? "That file isn't a readable Aligned backup. Choose a .json or .aligned file exported from Aligned."
            : /quota/i.test(message)
              ? "This browser is out of storage space for the backup. Free some space or export fewer rounds."
              : message || "That backup could not be imported.";
        } finally {
          importInput.value = "";
        }
      });
      document.getElementById("reset-game").addEventListener("click", openResetDialog);
    }

    // A playful vibe that has used up this couple's unseen playful questions says so, instead of quietly going warm.
    function vibeRunningLow() {
      const preset = SESSION_PRESETS.find((item) => item.id === state.sessionPreset);
      const seen = coupleAnsweredIds();
      const usable = (question) => !seen.has(question.id) && !state.neverQuestionIds.includes(question.id) && !state.excludedQuestionIds.includes(question.id);
      if (preset && preset.tone === "light") {
        if (!state.completedRounds.some(isTonightRound)) return "";
        const count = preset.count || state.questionCount;
        const sliderTarget = (preset.mode || "slider-heavy") === "sliders-only" ? count : (preset.mode || "slider-heavy") === "mixed" ? Math.ceil(count * 0.6) : Math.ceil(count * 0.8);
        const allowed = allowedTopicsForIntensity();
        const sliders = getQuestionCatalog().filter((question) => allowed.has(question.topic) && questionTone(question) === "light" && question.type === "slider" && usable(question)).length;
        if (sliders >= sliderTarget) return "";
        const other = SESSION_PRESETS.find((item) => item.id === "date-night");
        return `<p class="topic-note vibe-running-low" role="status">You’ve played nearly every quick ${escapeHTML(preset.label)} question — the next rounds mix in warmer ones.${other ? ` <button class="text-btn" type="button" data-vibe="${other.id}">Try ${escapeHTML(other.label)}</button>` : ""}</p>`;
      }
      if (state.sessionPreset === "custom" && state.completedRounds.some(isTonightRound)) {
        const topics = new Set(state.selectedTopics);
        const cozyOk = (question) => state.questionIntensity !== "cozy" || (questionTone(question) !== "deep"
          && (!questionNeedsHistory(question) || (state.questionMode === "sliders-only" && question.type === "slider")));
        const freshOf = (type) => getQuestionCatalog().filter((question) => topics.has(question.topic) && question.type === type && usable(question) && cozyOk(question)).length;
        const count = state.questionCount;
        const sliderTarget = state.questionMode === "sliders-only" ? count : state.questionMode === "mixed" ? Math.ceil(count * 0.6) : Math.ceil(count * 0.8);
        const fresh = freshOf("slider") + freshOf("text");
        if (freshOf("slider") >= sliderTarget && fresh >= count) return "";
        const sliders = freshOf("slider");
        const message = !fresh ? "You’ve played every question in your chosen packs"
          : !sliders ? `No new slider questions left in your chosen packs${state.questionMode === "sliders-only" ? "" : ` (${fresh} written)`}`
          : sliders < sliderTarget ? `Your chosen packs have only ${sliders} new slider question${sliders === 1 ? "" : "s"} left${state.questionMode === "sliders-only" ? "" : ` (${fresh - sliders} written)`}`
          : `Your chosen packs have only ${fresh} new question${fresh === 1 ? "" : "s"} left`;
        return `<p class="topic-note vibe-running-low" role="status">${message} — add another pack below for fresh ones, or replay favourites.</p>`;
      }
      return "";
    }

          state.sessionPreset = "custom";

          const allowed = allowedTopicsForIntensity(input.value);
          state.selectedTopics = state.selectedTopics.filter((topic) => allowed.has(topic));
          if (!state.selectedTopics.length) state.selectedTopics = [...allowed].slice(0, Math.min(3, allowed.size));
          saveState();
          playSound("tap");
          render();
        });
      });
      const markPresetCustom = () => {
        if (state.sessionPreset === "custom") return;
        state.sessionPreset = "custom";
        const custom = SESSION_PRESETS.find((preset) => preset.id === "custom");
        const label = document.querySelector("#session-select-trigger .session-trigger-val");
        if (custom && label) label.textContent = `${custom.icon} ${custom.label}`;
