              ? `<button class="primary-btn" id="new-round" type="button" disabled style="opacity:0.6;cursor:not-allowed">Waiting for ${escapeHTML(state.names[0] || "your partner")} to start…</button>`
              : `<button class="primary-btn" id="new-round" type="button">Play another round</button>`
            }
            <button class="text-btn" id="start-over" type="button">Switch vibe or players</button>
          </div>
          <p class="footer-note">There are no right answers—only new things to learn about each other.</p>
        </section>
      `;

      const flipCards = [...document.querySelectorAll(".flip-card")];
      // Scores unlocked by the partner's phone, by a rating, or before a reload still get their moment.
      if (allRevealed && state.revealCelebrated !== state.selectedQuestionIds.join("|")) {
        requestAnimationFrame(() => {
          const dashboard = document.getElementById("alignment-dashboard");
          if (dashboard) celebrateScoreUnlock(dashboard);
        });
      }

      document.querySelectorAll("[data-text-rating]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          state.textRatings[button.dataset.ratingQuestion] = button.dataset.textRating;
          const ratedAt = syncStamp();
          if (!state.textRatingTimes || typeof state.textRatingTimes !== "object") state.textRatingTimes = {};
          state.textRatingTimes[button.dataset.ratingQuestion] = ratedAt;
          if (state.playStyle === "nearby") sendNearbyMessage({ type: "text-rating", roundId: state.nearbyRoundId, questionId: button.dataset.ratingQuestion, rating: button.dataset.textRating, at: ratedAt });
          syncLatestRoundSnapshot();
          saveState();
          playSound("rate", { degree: questions.findIndex((item) => item.id === button.dataset.ratingQuestion), agree: ["aligned", "nuanced"].includes(button.dataset.textRating) });
          const scrollPosition = window.scrollY;
          render();
          requestAnimationFrame(() => window.scrollTo({ top: scrollPosition, behavior: "auto" }));
        });
      });

      document.querySelectorAll("[data-follow-through]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        const questionId = button.dataset.followQuestion;
        state.conversationStatus[questionId] = button.dataset.followThrough;
        if (!state.conversationTimes || typeof state.conversationTimes !== "object") state.conversationTimes = {};
        const followAt = syncStamp();
        state.conversationTimes[questionId] = followAt;
        if (["talk", "revisit"].includes(button.dataset.followThrough)) showToast(revealUnfinished() ? "Saved — it joins your Journal when your scores unlock." : "Saved to your Results Journal.");
        if (state.playStyle === "nearby") sendNearbyMessage({ type: "follow-through", roundId: state.nearbyRoundId, questionId, status: button.dataset.followThrough, at: followAt });
        syncLatestRoundSnapshot();
        saveState();
        if (button.dataset.followThrough === "ground") playSound("rate", { agree: true });
        else playSound(["talk", "revisit"].includes(button.dataset.followThrough) ? "lock" : "tap");
        const scrollPosition = window.scrollY;
        render();
        requestAnimationFrame(() => window.scrollTo({ top: scrollPosition, behavior: "auto" }));
      }));

      document.querySelectorAll("[data-intention-input]").forEach((input) => {
        input.addEventListener("click", (event) => event.stopPropagation());
        // On leaving the field, send the final text with a fresh stamp so both phones settle on it.
        input.addEventListener("focus", () => { input.dataset.focusText = input.value; input.dataset.partnerTyping = ""; });
        input.addEventListener("blur", () => {
          if (state.playStyle !== "nearby") return;
          const questionId = input.dataset.intentionInput;
          const existing = state.sharedIntentions.find((item) => item.questionId === questionId);
          if (!existing) return;
          if (input.value === input.dataset.focusText) {
            // Nothing typed here: show whatever the partner wrote meanwhile instead of overwriting it.
            input.value = existing.text || "";
            return;
          }
          existing.text = input.value;
          existing.updatedAt = syncStamp();
          sendNearbyMessage({ type: "intention-update", roundId: state.nearbyRoundId, questionId, text: existing.text, at: existing.updatedAt });
          syncLatestRoundSnapshot();
          saveState();
        });
        input.addEventListener("input", (event) => {
          event.stopPropagation();
          const questionId = input.dataset.intentionInput;
          const existing = state.sharedIntentions.find((item) => item.questionId === questionId);
          const editedAt = syncStamp();
          if (existing) { existing.text = input.value; existing.updatedAt = editedAt; }
          else state.sharedIntentions.push({ id: `intention_${Date.now()}_${randomIndex(10000)}`, questionId, text: input.value, createdAt: new Date().toISOString(), completed: false, updatedAt: editedAt });
          if (state.playStyle === "nearby") sendNearbyMessage({ type: "intention-update", roundId: state.nearbyRoundId, questionId, text: input.value, at: editedAt });
          syncLatestRoundSnapshot();
          saveState();
        });
      });
      document.querySelectorAll("[data-reveal-flag]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        const id = button.dataset.flagQuestion;
        const flags = new Set(state.questionFlags[id] || []);
        if (flags.has(button.dataset.revealFlag)) flags.delete(button.dataset.revealFlag); else flags.add(button.dataset.revealFlag);
        state.questionFlags[id] = [...flags];
        button.classList.toggle("active", flags.has(button.dataset.revealFlag));
        saveState(); playSound("tap");
      }));

      function sizeCard(card) {
        const front = card.querySelector(".card-front");
        const back = card.querySelector(".card-back");
        const activeFace = card.classList.contains("flipped") ? back : front;
        const requiredHeight = Math.max(card.classList.contains("flipped") ? activeFace.scrollHeight : activeFace.offsetHeight, 210);
        if (!card.classList.contains("flipped")) card.dataset.closedHeight = String(requiredHeight);
        card.style.height = `${requiredHeight}px`;
      }

      function sizeAllCards() {
        const measured = flipCards.map((card) => {
          const flipped = card.classList.contains("flipped");
          const face = card.querySelector(flipped ? ".card-back" : ".card-front");
          return { card, flipped, height: Math.max(flipped ? face.scrollHeight : face.offsetHeight, 210), top: card.offsetTop };
        });
        measured.forEach(({ card, flipped, height }) => {
          if (!flipped) card.dataset.closedHeight = String(height);
          card.style.height = `${height}px`;
        });
        const rows = new Map();
        measured.forEach(({ card, top }) => {
          if (!rows.has(top)) rows.set(top, []);
          rows.get(top).push(card);
        });
        rows.forEach((row) => {
          if (row.length < 2) return;
          const closedHeight = (card) => card.classList.contains("flipped") ? Number(card.dataset.closedHeight) || 0 : parseFloat(card.style.height) || 0;
          const tallest = Math.max(...row.map(closedHeight));
          row.forEach((card) => { if (!card.classList.contains("flipped")) card.style.height = `${tallest}px`; });
        });
      }

      function updateRevealAllButton() {
        const label = document.querySelector("#reveal-all span:last-child");
        const everyCardUp = questions.every((question) => cardSeen(question.id));
        const everything = everyCardUp && !unratedWrittenIds(questions).length;
        label.textContent = questions.every((question) => state.revealedIds.includes(question.id)) ? "Hide all" : "Reveal all";
        document.getElementById("round-highlights")?.classList.toggle("locked", !everything);
        document.querySelectorAll("#round-highlights .highlight-locked small").forEach((item) => { item.textContent = everyCardUp ? "Rate the written answers to unlock" : "Flip every card to unlock"; });
        const count = document.getElementById("reveal-count");
        if (count) count.textContent = revealProgressCopy(questions);
        const hint = document.getElementById("score-lock-hint");
        if (hint) hint.textContent = scoreLockHint(questions);
        const rateNext = document.getElementById("rate-next");
        if (rateNext) rateNext.hidden = !(everyCardUp && unratedWrittenIds(questions).length);
        document.querySelectorAll("[data-dot]").forEach((dot) => dot.classList.toggle("on", cardSeen(dot.dataset.dot)));
        const dashboard = document.getElementById("alignment-dashboard");
        if (dashboard) {
          const wasLocked = dashboard.classList.contains("locked");
          dashboard.classList.toggle("locked", !everything);
          dashboard.querySelector(".score-lock")?.setAttribute("aria-hidden", String(everything));
          dashboard.querySelectorAll(".dual-score-dashboard, .topic-alignment-area").forEach((part) => {
            part.inert = !everything;
            if (everything) part.removeAttribute("aria-hidden"); else part.setAttribute("aria-hidden", "true");
          });
          if (everything && wasLocked && count) {
            const rings = [...dashboard.querySelectorAll(".dual-score-dashboard .alignment-ring")].map((ring) => ring.getAttribute("aria-label")).join(", ");
            count.textContent = `${revealProgressCopy(questions)} · scores unlocked: ${rings}`;
          }
          if (everything && wasLocked) {
            const line = tonightLine();
            const existing = dashboard.querySelector(".tonight-line");
            if (existing) existing.outerHTML = line;
            else if (line) dashboard.querySelector(".dual-score-dashboard")?.insertAdjacentHTML("afterend", line);
            dismissConfirmDialogs("reveal-guard");
            celebrateScoreUnlock(dashboard);
          }
        }
      }

      // The payoff: rings count up from zero the first time a round's scores are unlocked — on both
      // phones — and only once the dashboard is actually on screen, so nobody arrives at a finished number.
      function celebrateScoreUnlock(dashboard) {
        dismissConfirmDialogs("reveal-guard");
        const roundKey = state.selectedQuestionIds.join("|");
        if (state.revealCelebrated === roundKey) return;
        state.revealCelebrated = roundKey;
        saveState();
        const ringNames = [...dashboard.querySelectorAll(".dual-score-dashboard .alignment-ring")].map((ring) => ring.getAttribute("aria-label")).filter(Boolean).join(", ");
        announce(`Scores unlocked: ${ringNames}.`);
        if (motionReduced()) {
          const sinceMatch = Date.now() - (audioEngine.lastMatchAt || 0);
          const sinceReveal = Date.now() - (audioEngine.lastRevealAt || 0);
          window.setTimeout(() => playSound("celebrate", { finale: true }), Math.max(0, 650 - sinceMatch, 300 - sinceReveal));
          window.setTimeout(() => {
            dashboard.scrollIntoView({ block: "center", behavior: "auto" });
            const heading = dashboard.querySelector("#alignment-title");
            if (heading && document.activeElement && document.activeElement !== document.body && app.contains(document.activeElement)) {
              heading.setAttribute("tabindex", "-1");
              heading.focus({ preventScroll: true });
            }
          }, 150);
          return;
        }
        unlockAnimatingUntil = Date.now() + 3600;
        const rings = [...dashboard.querySelectorAll(".dual-score-dashboard .alignment-ring")].map((ring) => {
          const target = Number(getComputedStyle(ring).getPropertyValue("--ring-score")) || 0;
          const label = ring.querySelector("strong");
          ring.style.setProperty("--ring-score", "0");
          if (label) label.textContent = "0%";
          return { ring, target, label };
        });
        let started = false;
        let observer = null;
        const run = () => {
          if (started || !dashboard.isConnected) return;
          const sinceMatch = Date.now() - (audioEngine.lastMatchAt || 0);
          if (sinceMatch < 600) { window.setTimeout(run, 650 - sinceMatch); return; }
          started = true;
          observer?.disconnect();
          const heading = dashboard.querySelector("#alignment-title");
          if (heading && document.activeElement && document.activeElement !== document.body && app.contains(document.activeElement)) {
            heading.setAttribute("tabindex", "-1");
            heading.focus({ preventScroll: true });
          }
          playSound("countup");
          const begin = performance.now();
          const step = (now) => {
            const progress = Math.max(0, Math.min(1, (now - begin) / 1100));
            const eased = 1 - Math.pow(1 - progress, 3);
            rings.forEach(({ ring, target, label }) => {
              const value = Math.round(target * eased);
              ring.style.setProperty("--ring-score", String(value));
              if (label) label.textContent = `${value}%`;
            });
            if (progress < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
          window.setTimeout(() => {
            if (!dashboard.isConnected) return;
            const heading = dashboard.querySelector("#alignment-title");
            if (heading && document.activeElement && document.activeElement !== document.body && app.contains(document.activeElement)) {
              heading.setAttribute("tabindex", "-1");
              heading.focus({ preventScroll: true });
            }
            burstConfetti(dashboard, 40);
            playSound("celebrate", { finale: true });
          }, 1100);
        };
        if ("IntersectionObserver" in window) {
          observer = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.intersectionRatio >= 0.55)) window.setTimeout(run, 120);
          }, { threshold: [0.55] });
        }
        // Let a partner-triggered re-render restore its scroll position before moving the page.
        window.setTimeout(() => {
          if (!dashboard.isConnected) return;
          dashboard.scrollIntoView({ block: "center", behavior: "smooth" });
          observer?.observe(dashboard);
        }, 160);
        window.setTimeout(run, observer ? 2200 : 700);
      }

      function applyCardState(card, shouldReveal) {
        const front = card.querySelector(".card-front");
        const back = card.querySelector(".card-back");
        card.classList.toggle("flipped", shouldReveal);
        front.setAttribute("aria-expanded", String(shouldReveal));
        front.setAttribute("aria-hidden", String(shouldReveal));
        back.setAttribute("aria-hidden", String(!shouldReveal));
        front.inert = shouldReveal;
        back.inert = !shouldReveal;
      }

      function toggleCard(card, { focus = true, scroll = true } = {}) {
        const id = card.dataset.questionId;
        const shouldReveal = !card.classList.contains("flipped");
        applyCardState(card, shouldReveal);
        state.revealedIds = shouldReveal
          ? [...new Set([...state.revealedIds, id])]
          : state.revealedIds.filter((revealedId) => revealedId !== id);
        if (state.playStyle === "nearby") sendNearbyMessage({ type: "reveal-state", roundId: state.nearbyRoundId, change: { id, revealed: shouldReveal } });
        const matchInfo = matchInfoById.get(id);
        const rect = card.getBoundingClientRect();
        const soundPlace = { pan: ((rect.left + rect.width / 2) / window.innerWidth - 0.5) * 0.8, topic: questions.find((item) => item.id === id)?.topic, degree: questions.findIndex((item) => item.id === id) };
        if (shouldReveal && matchInfo?.isMatch) {
          playSound("match", { ...soundPlace, exact: matchInfo.exact });
          burstConfetti(card, 26);
        } else {
          playSound(shouldReveal ? "reveal" : "tap", soundPlace);
        }
        saveState();
        updateRevealAllButton();
        openedCards = openedCards.filter((other) => other !== card);
        if (card.classList.contains("flipped")) openedCards.push(card);
        requestAnimationFrame(() => {
          sizeCard(card);
          if (!card.classList.contains("flipped")) {
            const neighbours = flipCards.filter((other) => other !== card && other.offsetTop === card.offsetTop);
            const tallest = Math.max(parseFloat(card.style.height) || 0, ...neighbours.map((other) => other.classList.contains("flipped") ? Number(other.dataset.closedHeight) || 0 : parseFloat(other.style.height) || 0));
            card.style.height = `${tallest}px`;
          }
          if (!focus) return;
          if (shouldReveal) {
            const back = card.querySelector(".card-back");
            if (!back.hasAttribute("tabindex")) back.setAttribute("tabindex", "-1");
            back.focus({ preventScroll: true });
            window.setTimeout(() => { if (card.classList.contains("flipped") && document.activeElement !== back && !back.contains(document.activeElement)) back.focus({ preventScroll: true }); }, 120);
            if (scroll) card.scrollIntoView({ block: "nearest", behavior: motionReduced() ? "auto" : "smooth" });
          } else {
            // The front is visible (if still transparent) at once; retry once in case a busy engine applied styles late.
            const refocusFront = () => { if (!card.classList.contains("flipped")) card.querySelector(".card-front")?.focus({ preventScroll: true }); };
            refocusFront();
            window.setTimeout(() => { if (!card.classList.contains("flipped") && document.activeElement !== card.querySelector(".card-front")) refocusFront(); }, 120);
          }
        });
      }

      flipCards.forEach((card) => {
        card.querySelector(".card-front").addEventListener("click", () => toggleCard(card));
        card.querySelector(".card-close-button").addEventListener("click", () => toggleCard(card));
        card.querySelector(".card-back").addEventListener("keydown", (event) => {
          if (event.key !== "Escape" || !card.classList.contains("flipped") || document.querySelector(".modal-backdrop")) return;
          event.preventDefault();
          toggleCard(card);
        });
        card.querySelector("[data-next-card]")?.addEventListener("click", (event) => {
          const next = flipCards[Number(event.currentTarget.dataset.nextCard)];
          if (!next) return;
          if (!next.classList.contains("flipped")) toggleCard(next, { scroll: false });
          else {
            const back = next.querySelector(".card-back");
            if (!back.hasAttribute("tabindex")) back.setAttribute("tabindex", "-1");
            back.focus({ preventScroll: true });
          }
          // toggleCard sizes the card on the next frame; scroll once after that.
          requestAnimationFrame(() => requestAnimationFrame(() => next.scrollIntoView({ block: "start", behavior: motionReduced() ? "auto" : "smooth" })));
        });
      });
      document.getElementById("rate-next")?.addEventListener("click", () => {
        playSound("tap");
        const id = unratedWrittenIds(questions)[0];
        const card = flipCards.find((item) => item.dataset.questionId === id);
        if (!card) return;
        if (!card.classList.contains("flipped")) toggleCard(card, { focus: false });
        const rating = card.querySelector(".alignment-rating");
        (rating || card).scrollIntoView({ block: "center", behavior: motionReduced() ? "auto" : "smooth" });
        card.querySelector("[data-text-rating]")?.focus({ preventScroll: true });
      });
      document.querySelectorAll("[data-jump-card]").forEach((button) => button.addEventListener("click", () => {
        const card = flipCards.find((item) => item.dataset.questionId === button.dataset.jumpCard);
        if (!card) return;
        card.scrollIntoView({ block: "start", behavior: motionReduced() ? "auto" : "smooth" });
        const face = card.classList.contains("flipped") ? card.querySelector(".card-back") : card.querySelector(".card-front");
        if (face && !face.hasAttribute("tabindex") && face.classList.contains("card-back")) face.setAttribute("tabindex", "-1");
        face?.focus({ preventScroll: true });
      }));

      let lastRevealAllAt = 0;
      document.getElementById("reveal-all").addEventListener("click", () => {
        if (Date.now() - lastRevealAllAt < 500) return;
        lastRevealAllAt = Date.now();
        const shouldReveal = state.revealedIds.length !== questions.length;
        state.revealedIds = shouldReveal ? questions.map((question) => question.id) : [];
        if (state.playStyle === "nearby") sendNearbyMessage({ type: "reveal-state", roundId: state.nearbyRoundId, all: shouldReveal });
        const board = document.querySelector(".reveal-screen") || document.body;
        board.classList.add("reveal-bulk");
        window.setTimeout(() => board.classList.remove("reveal-bulk"), 900);
        flipCards.forEach((card) => {
          applyCardState(card, shouldReveal);
        });
        if (shouldReveal) {
          const matches = questions.filter((question) => matchInfoById.get(question.id)?.isMatch).length;
          if (matches) {
            burstConfetti(document.getElementById("reveal-all"), 34);
            playSound("match");
          } else {
            playSound("reveal");
          }
        } else {
          playSound("tap");
        }
        updateRevealAllButton();
        saveState();
        requestAnimationFrame(() => requestAnimationFrame(sizeAllCards));
      });

      document.getElementById("new-round").addEventListener("click", async () => {
        const playStyle = state.playStyle;
        const roundWillStart = playStyle !== "nearby" || (nearbyChannelOpen() && state.nearbyRole === "host");
        if (roundWillStart && !(await confirmLeavingReveal())) return;
        if (roundWillStart && state.sessionPreset === "pack") state.sessionPreset = presetAfterPack();
        if (playStyle === "nearby") {
          if (!nearbyChannelOpen()) {
            if (nearbyRuntime.roomId && !nearbyRoomExpired()) {
              retryNearbyConnection();
              showToast("The other phone isn't connected. Reconnecting… try again in a moment.", { tone: "warning" });
            } else if (state.nearbyRole === "join") {
              const host = state.names[0] || "Your partner";
              showToast(`${host}’s phone isn’t connected. Ask ${host} to tap “Play another round” and scan the new QR — or use “Switch vibe or players” to play on this phone.`, { tone: "warning" });
            } else {
              if (!(await confirmLeavingReveal())) return;
              if (revealUnfinished()) state.revealCelebrated = state.selectedQuestionIds.join("|");
              closeNearbyConnection();
              state.screen = "nearby";
              saveState();
              render();
              showToast("Pair the phones again to play another round together.");
            }
            return;
          }
          if (state.nearbyRole === "host") {
            const questionMode = state.questionMode;
            const questionCount = state.questionCount;
            const selectedTopics = [...state.selectedTopics];
            const newIds = chooseRoundQuestions(questionMode, questionCount, selectedTopics);
            if (newIds.length !== questionCount) {
              showToast("Not enough questions to start another round with these settings.");
              return;
            }
            startGame({
              names: state.names, questionMode, questionCount: newIds.length,
              selectedTopics, selectedQuestionIds: newIds, playStyle: "nearby"
            });
            state.activePlayer = 0;
            state.nearbyRole = "host";
            state.nearbyRoundId = newNearbyRoundId();
            saveState();
            nearbyRuntime.roundStarted = true;
            nearbyRuntime.partnerProgress = null;
            sendNearbyMessage(nearbyRoundInitPayload({ newRound: true }));
            return;
          } else {
            showToast(`Waiting for ${state.names[0] || "your partner"} to start the next round…`);
            return;
          }
        }

        const questionMode = state.questionMode;
        const questionCount = state.questionCount;
        const selectedTopics = [...state.selectedTopics];
        const selectedQuestionIds = chooseRoundQuestions(questionMode, questionCount, selectedTopics);
        if (!selectedQuestionIds.length) {
          showToast("Not enough questions to start another round with these settings.");
          return;
        }
        startGame({ names: state.names, questionMode, questionCount, selectedTopics, selectedQuestionIds, playStyle: "pass-and-play" });
      });

      document.getElementById("start-over").addEventListener("click", async () => {
        if (state.playStyle === "nearby" && nearbyChannelOpen()) {
          const partner = state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "your partner";
          const unfinished = revealUnfinished() ? `Your scores haven’t been revealed yet${revealRemainingCopy() ? ` (${revealRemainingCopy()})` : ""} — leaving skips the count-up and its scores go straight to your Journal. ` : "";
          const leave = await openConfirmDialog({ title: "Leave the two-phone round?", copy: `${unfinished}${partner}’s phone will be told you left. Your results stay saved on both phones.`, confirmLabel: "Leave anyway", cancelLabel: "Stay", safeFirst: true });
          if (!leave) return;
        } else if (!(await confirmLeavingReveal("Switch anyway"))) return;
        closeNearbyConnection({ notifyPartner: state.playStyle === "nearby" });
        state = {
          ...initialState(),
          ...persistentSetupState()
        };
        saveState();
        render();
      });

      requestAnimationFrame(sizeAllCards);

      let cardResizeObserver = null;
      let resizeFrame = 0;
      const scheduleCardResize = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(sizeAllCards);
      };

      if ("ResizeObserver" in window) {
        cardResizeObserver = new ResizeObserver(scheduleCardResize);
        flipCards.forEach((card) => {
          cardResizeObserver.observe(card.querySelector(".card-front"));
          cardResizeObserver.observe(card.querySelector(".card-back"));
        });
      }
      window.addEventListener("resize", scheduleCardResize, { passive: true });
      window.addEventListener("orientationchange", scheduleCardResize, { passive: true });
      window.visualViewport?.addEventListener("resize", scheduleCardResize, { passive: true });
      cleanupResponsiveRender = () => {
        cancelAnimationFrame(resizeFrame);
        cardResizeObserver?.disconnect();
        window.removeEventListener("resize", scheduleCardResize);
        window.removeEventListener("orientationchange", scheduleCardResize);
        window.visualViewport?.removeEventListener("resize", scheduleCardResize);
      };
    }

    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !IN_ANDROID_APP) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").then((registration) => {
        registration.addEventListener("updatefound", () => {
          const worker = registration.installing;
          worker?.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) showToast("A new version of Aligned is ready. Refresh when your round is finished to use it.");
            if (worker.state === "activated" && navigator.serviceWorker.controller) {
              updateReadyToUse = true;
              const status = document.getElementById("install-status");
              if (status) showUpdateReady(status);
            }
          });
        });
      }).catch(() => {}));
    }

    let handledNearbyLaunch = "";

    function handleNearbyJoinLaunch() {
      const launchHashParams = new URLSearchParams(location.hash.slice(1));
      const launchNearbyRoom = launchHashParams.get("join") || "";
      if (!launchNearbyRoom) return false;
      const launchRoomParts = launchNearbyRoom.split(".");
      const launchRoomId = launchRoomParts[0] || "";
      const launchJoinToken = launchRoomParts.slice(1).join(".");
      const hasValidNearbyLaunch = /^[A-Za-z0-9_-]{16,40}$/.test(launchRoomId) && /^[A-Za-z0-9_-]{32,80}$/.test(launchJoinToken);
      if (!hasValidNearbyLaunch) {
        history.replaceState(null, "", location.href.split("#")[0]);
        showToast("That join link is incomplete. Ask your partner to show a fresh QR.", { tone: "error" });
        return false;
      }
      const launchSignature = `${launchRoomId}.${launchJoinToken}`;
      const alreadyHandling = nearbyRuntime.roomId === launchRoomId && nearbyRuntime.role === "join";
      if (alreadyHandling) {
        history.replaceState(null, "", location.href.split("#")[0]);
        return true;
      }
      if (nearbyRuntime.roomId === launchRoomId && nearbyRuntime.role === "host") {
        history.replaceState(null, "", location.href.split("#")[0]);
        showToast("That's this phone's own QR. Scan it with your partner's phone instead.", { tone: "warning" });
        render();
        return true;
      }
      const session = loadNearbySession();
      if (session?.role === "join" && session.roomId === launchRoomId && state.playStyle === "nearby" && state.screen !== "nearby") {
        // Re-opening the same link (e.g. scanning again) resumes the round already in progress.
        history.replaceState(null, "", location.href.split("#")[0]);
        resumeNearbySession();
        render();
        return true;
      }
      const midRound = state.playStyle === "nearby" && state.nearbyRole === "join" && state.nearbyRoundId && ["question", "nearby-wait", "celebration", "reveal"].includes(state.screen);
      if (midRound) {
        handledNearbyLaunch = launchSignature;
        history.replaceState(null, "", location.href.split("#")[0]);
        render();
        // Still linked to a partner and this is someone else's QR: ask before touching the working link.
        if (nearbyChannelOpen() && nearbyRuntime.roomId && launchRoomId !== nearbyRuntime.roomId) {
          const partner = state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "your partner";
          openConfirmDialog({
            title: "Leave your current round?",
            copy: `You’re linked with ${partner}. Joining this new QR ends that link and discards your round with ${partner}.`,
            confirmLabel: "Leave and join",
            cancelLabel: `Stay with ${partner}`,
            danger: true,
            safeFirst: true,
            tag: "link"
          }).then((ok) => {
            if (!ok) { if (nearbyChannelOpen()) showToast(`Still linked with ${partner}.`); focusScreenHeading(); return; }
            closeNearbyConnection({ notifyPartner: true });
            nearbyRuntime.initConfirmed = true;
            // Show the joining screen rather than the round just left (it stays resumable if the join fails).
            if (["question", "intermission", "nearby-wait", "celebration", "reveal"].includes(state.screen)) state.resumeScreen = state.screen;
            state.screen = "nearby";
            saveState();
            render();
            prepareNearbyJoin(launchRoomId, launchJoinToken);
          });
          return true;
        }
        // Otherwise a new QR mid-round reconnects this round (or asks once the other host's round arrives).
        prepareNearbyJoin(launchRoomId, launchJoinToken);
        return true;
      }
      const join = () => {
        if (["question", "intermission", "nearby-wait"].includes(state.screen)) {
          state.resumeScreen = state.screen;
        }
        handledNearbyLaunch = launchSignature;
        if (state.playStyle !== "nearby" && state.selectedQuestionIds.length) state.playStyleBeforeJoin = state.playStyle;
        state.playStyle = "nearby";
        state.screen = "nearby";
        saveState();
        history.replaceState(null, "", location.href.split("#")[0]);
        render();
        prepareNearbyJoin(launchRoomId, launchJoinToken);
      };
      // Only an open data channel is a live partner; a room still retrying is an orphaned local round.
      const linkLive = nearbyChannelOpen();
      const localRoundOpen = (state.playStyle !== "nearby" || !linkLive) && state.selectedQuestionIds.length > 0
        && (["question", "intermission", "nearby-wait"].includes(state.screen) || ["question", "intermission", "nearby-wait"].includes(state.resumeScreen) || revealUnfinished());
      if (!localRoundOpen) {
        join();
        return true;
      }
      handledNearbyLaunch = launchSignature;
      history.replaceState(null, "", location.href.split("#")[0]);
      render();
      const players = state.names.filter(Boolean).join(" & ") || "this round";
      const onlyReveal = revealUnfinished() && !["question", "intermission"].includes(state.screen) && !["question", "intermission"].includes(state.resumeScreen);
      openConfirmDialog({
        title: "Join your partner’s round?",
        copy: revealUnfinished() && !["question", "intermission"].includes(state.screen) && !["question", "intermission"].includes(state.resumeScreen)
          ? `This ${POINTER_VERB === "Tap" ? "phone" : "device"} has a round whose scores aren’t revealed yet (${players}). Joining skips the count-up — its scores go straight to your Journal.`
          : `This ${POINTER_VERB === "Tap" ? "phone" : "device"} has an unfinished round (${players}). Joining discards it — its answers can’t be recovered.`,
        confirmLabel: onlyReveal ? "Save to Journal and join" : "Discard and join",
        cancelLabel: "Keep my round",
        danger: !onlyReveal,
        safeFirst: true
      }).then((ok) => {
        if (!ok) { showToast(`Kept your round. ${POINTER_VERB === "Tap" ? "Scan the QR" : "Open the join link"} again when you’re ready to join.`); return; }
        // The local round stays resumable until the partner's round really starts (round-init replaces it then);
        // the person has already agreed, so that round-init doesn't ask again.
        nearbyRuntime.initConfirmed = true;
        if (["celebration", "reveal"].includes(state.screen)) state.resumeScreen = state.screen;
        join();
      });
      return true;
    }

    document.getElementById("ambient-toggle")?.addEventListener("click", () => {
      requestGyroPermission();
      state.ambientMusicEnabled = !state.ambientMusicEnabled;
      saveState();
      playSound("tap");
      applyPreferences();
    });

    document.addEventListener("mousemove", (event) => {
      const card = event.target.closest(".card-face");
      if (!card || motionReduced()) return;
      const rect = card.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;
      card.style.setProperty("--holo-x", `${x}%`);
      card.style.setProperty("--holo-y", `${y}%`);
      card.style.setProperty("--holo-opacity", "0.75");
    }, { passive: true });

    document.addEventListener("mouseout", (event) => {
      const card = event.target.closest(".card-face");
      if (card) {
        card.style.setProperty("--holo-opacity", "0");
      }
    }, { passive: true });

    document.addEventListener("touchmove", (event) => {
      if (!event.touches.length || motionReduced()) return;
      const touch = event.touches[0];
      const card = document.elementFromPoint(touch.clientX, touch.clientY)?.closest(".card-face");
      if (!card) return;
      const rect = card.getBoundingClientRect();
      const x = ((touch.clientX - rect.left) / rect.width) * 100;
      const y = ((touch.clientY - rect.top) / rect.height) * 100;
      card.style.setProperty("--holo-x", `${x}%`);
      card.style.setProperty("--holo-y", `${y}%`);
      card.style.setProperty("--holo-opacity", "0.75");
    }, { passive: true });

    document.addEventListener("touchend", () => {
      document.querySelectorAll(".card-face").forEach((card) => {
        card.style.setProperty("--holo-opacity", "0");
      });
    }, { passive: true });

    window.addEventListener("deviceorientation", (event) => {
      if (motionReduced()) return;
      const beta = event.beta;
      const gamma = event.gamma;
      if (beta === null || gamma === null) return;
      const x = ((gamma + 45) / 90) * 100;
      const y = ((beta + 45) / 90) * 100;
      document.querySelectorAll(".card-face").forEach((card) => {
        card.style.setProperty("--holo-x", `${x}%`);
        card.style.setProperty("--holo-y", `${y}%`);
        card.style.setProperty("--holo-opacity", "0.45");
      });
    }, { passive: true });

    document.addEventListener("click", (event) => {
      // Resume audio on user interaction to satisfy browser autoplay policy.
      try {
        const running = audioEngine.ctx && audioEngine.ctx.state === "running";
        if (!running || (state.ambientMusicEnabled && !ambientSoundscape.generation)) {
          if (state.ambientMusicEnabled) ambientSoundscape.start();
          else audioEngine.resume();
        }
        armIdleSuspend();
      } catch (e) {
        // Prevent audio issues from blocking user interaction handlers
      }

      const activeDropdown = document.querySelector(".session-dropdown-container.open");
      if (activeDropdown && !event.target.closest(".session-dropdown-container")) {
        activeDropdown.classList.remove("open");
        const trigger = activeDropdown.querySelector(".session-dropdown-trigger");
        if (trigger) trigger.setAttribute("aria-expanded", "false");
      }

      const target = event.target;
      const button = target.closest("button, input[type='radio'], input[type='checkbox'], .topic-chip, .brand, .preset-card, .play-style-card, .count-card, .intensity-card, .mode-card, .session-dropdown-trigger, .session-dropdown-item");
      if (button) {
        const rect = target.getBoundingClientRect();
        const x = event.clientX || (rect.left + rect.width / 2);
        const y = event.clientY || (rect.top + rect.height / 2);
        triggerSparkles(x, y, 8, 35);
      }
    });

    function reconnectNearbyNow() {
      if (!nearbyRuntime.role || !nearbyRuntime.roomId || nearbyRuntime.otherTab || nearbyRoomExpired()) return;
      if (nearbySignalingSocket && nearbySignalingSocket.readyState <= WebSocket.OPEN) return;
      clearTimeout(nearbyReconnectTimer);
      nearbyRuntime.reconnectAttempts = 0;
      const token = nearbyRuntime.role === "host" ? nearbyRuntime.hostToken : nearbyRuntime.joinToken;
      connectNearbySignaling(nearbyRuntime.role, nearbyRuntime.roomId, token).catch(() => {});
    }
    window.addEventListener("online", reconnectNearbyNow);
    document.addEventListener("visibilitychange", () => {
      // Silence music and effects while the app is in the background; fade music back in on return.
      if (audioEngine.ctx) {
        if (document.visibilityState === "hidden") audioEngine.ctx.suspend().catch(() => {});
        else if (audioAllowed()) {
          const level = audioEngine.musicBus.gain;
          const now = audioEngine.ctx.currentTime;
          level.cancelScheduledValues(now);
          level.setValueAtTime(0.0001, now);
          level.linearRampToValueAtTime(MUSIC_LEVEL, now + 0.8);
          audioEngine.ctx.resume().catch(() => {});
          armIdleSuspend();
        }
      }
      // A context the OS closed in the background is rebuilt so music comes back without a tap.
      if (document.visibilityState === "visible" && audioAllowed() && audioEngine.ctx && audioEngine.ctx.state === "closed") {
        try {
          audioEngine.ensure();
          if (state.ambientMusicEnabled) ambientSoundscape.start();
        } catch {}
      }
      if (document.visibilityState === "visible") reconnectNearbyNow();
    });
    window.addEventListener("hashchange", handleNearbyJoinLaunch);
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) handleNearbyJoinLaunch();
    });
    if (!handleNearbyJoinLaunch()) {
      resumeNearbySession();
      render();
      if (state.screen !== "setup") focusScreenHeading();
    }
  </script>
</body>
</html>
