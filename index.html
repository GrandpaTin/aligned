    // One shared context and mix: effects → compressor → master → limiter, with music on its own bus
    // under the effects so every chime stays audible and nothing can clip when sounds overlap.
    const MUSIC_LEVEL = 0.4;
    const audioEngine = {
      ctx: null,
      readyAt: 0,
      master: null,
      fxBus: null,
      musicBus: null,
      echoSend: null,
      pulseWave: null,
      noise: null,
      unavailable: false,
      ensure() {
        if (this.unavailable) return null;
        try {
          return this.build();
        } catch {
          // A browser that refuses audio still plays the whole game silently.
          try { this.ctx?.close?.(); } catch {}
          try { this.pending?.close?.(); } catch {}
          this.ctx = null;
          this.pending = null;
          this.unavailable = true;
          return null;
        }
      },
      build() {
        if (this.ctx && this.ctx.state === "closed") {
          this.ctx = null;
          if (ambientSoundscape) {
            ambientSoundscape.generation = null;
            if (state.ambientMusicEnabled && !document.hidden) window.setTimeout(() => { try { ambientSoundscape.start(); } catch {} }, 0);
          }
        }
        if (this.ctx) return this.ctx;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        const ctx = new AudioContextClass();
        this.pending = ctx;
        const compressor = (threshold, knee, ratio, attack, release) => {
          const node = ctx.createDynamicsCompressor();
          node.threshold.value = threshold; node.knee.value = knee; node.ratio.value = ratio;
          node.attack.value = attack; node.release.value = release;
          return node;
        };
        const limiter = compressor(-3, 0, 20, 0.001, 0.1);
        this.master = ctx.createGain();
        this.master.gain.value = state.soundVolume ** 2;
        const fxCompressor = compressor(-18, 12, 4, 0.003, 0.15);
        this.fxBus = ctx.createGain();
        this.musicBus = ctx.createGain();
        this.musicBus.gain.value = MUSIC_LEVEL;
        this.fxBus.connect(fxCompressor);
        fxCompressor.connect(this.master);
        this.musicBus.connect(this.master);
        this.master.connect(limiter);
        limiter.connect(ctx.destination);
        // The dreamy theme's echo: a short filtered feedback delay shared by every note.
        this.echoSend = ctx.createGain();
        const delay = ctx.createDelay(1);
        const feedback = ctx.createGain();
        const tone = ctx.createBiquadFilter();
        const wet = ctx.createGain();
        delay.delayTime.value = 0.28; feedback.gain.value = 0.3;
        tone.type = "lowpass"; tone.frequency.value = 2500; wet.gain.value = 0.22;
        this.echoSend.connect(delay); delay.connect(tone); tone.connect(feedback); feedback.connect(delay); tone.connect(wet); wet.connect(this.fxBus);
        const harmonics = 24;
        const real = new Float32Array(harmonics);
        const imag = new Float32Array(harmonics);
        for (let n = 1; n < harmonics; n++) imag[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * 0.25);
        this.pulseWave = ctx.createPeriodicWave(real, imag);
        this.noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
        const samples = this.noise.getChannelData(0);
        for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
        this.ctx = ctx;
        this.pending = null;
        // Compressors open up over their first few milliseconds; the first sound waits until they have.
        this.readyAt = ctx.currentTime + 0.08;
        return ctx;
      },
      resume() {
        if (this.ctx && this.ctx.state !== "running" && this.ctx.state !== "closed" && !document.hidden) this.ctx.resume().catch(() => {});
      },
      setVolume(value) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(now);
        this.master.gain.setTargetAtTime(value ** 2, now, 0.05);
      },
      // Music dips under each effect and swells back once it has finished.
      duckUntil: 0,
      duckDepth: 1,
      duck(depth, holdSeconds) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // An overlapping short sound never cuts a longer, deeper duck short.
        if (now < this.duckUntil) {
          depth = Math.min(depth, this.duckDepth);
          holdSeconds = Math.max(holdSeconds, this.duckUntil - now);
        }
        this.duckUntil = now + holdSeconds;
        this.duckDepth = depth;
        const level = this.musicBus.gain;
        level.cancelScheduledValues(now);
        level.setValueAtTime(level.value, now);
        level.setTargetAtTime(MUSIC_LEVEL * depth, now, 0.03);
        level.setTargetAtTime(MUSIC_LEVEL, now + holdSeconds, 0.7);

      panner(pan) {

      }

    let ambientSoundscape = null;

    // Generative background music in F major: a slow four-chord pad cycle plus a sparse, panned
    // music-box melody, so it never loops audibly. Each start builds a fresh generation of nodes
    // that its own stop tears down, so quick on/off toggles cannot orphan oscillators.
    const AMBIENT_CHORDS = [
      [349.23, 440.0, 523.25, 698.46, 880.0],
      [293.66, 440.0, 587.33, 698.46, 880.0],
      [233.08, 349.23, 466.16, 587.33, 698.46],
      [261.63, 392.0, 523.25, 659.25, 783.99]
    ];
    const AMBIENT_MELODY = [698.46, 783.99, 880.0, 1046.5, 1174.66];
    const CHORD_SECONDS = 8;

    class ProceduralAmbient {
      constructor() {
        this.generation = null;
      }

      get ctx() {
        return audioEngine.ctx;
      }

      get isPlaying() {
        return Boolean(this.generation);
      }

      start() {
        if (document.hidden) return;
        const ctx = audioEngine.ensure();
        if (!ctx) return;
        audioEngine.resume();
        if (this.generation) return;
        const now = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.setValueAtTime(0.0001, now);
        out.gain.exponentialRampToValueAtTime(1, now + 3);
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 2000;
        filter.Q.value = 0.7;
        const lfo = ctx.createOscillator();
        const lfoDepth = ctx.createGain();
        lfo.frequency.value = 0.05;
        lfoDepth.gain.value = 600;
        lfo.connect(lfoDepth);
        lfoDepth.connect(filter.frequency);
        lfo.start(now);
        filter.connect(out);
        out.connect(audioEngine.musicBus);
        const generation = { out, filter, lfo, lfoDepth, chord: 0, nextChordAt: now + 0.05, nextNoteAt: now + 2.5, timer: 0 };
        this.generation = generation;
        const schedule = () => {
          if (this.generation !== generation) return;
          if (ctx.state === "running") {
            const horizon = ctx.currentTime + 1.5;
            if (generation.nextChordAt < ctx.currentTime) generation.nextChordAt = ctx.currentTime + 0.05;
            if (generation.nextNoteAt < ctx.currentTime) generation.nextNoteAt = ctx.currentTime + 0.5;
            while (generation.nextChordAt < horizon) {
              this.playChord(generation, AMBIENT_CHORDS[generation.chord % AMBIENT_CHORDS.length], generation.nextChordAt);
              generation.chord += 1;
              generation.nextChordAt += CHORD_SECONDS;
            }
            while (generation.nextNoteAt < horizon) {
              this.playNote(generation, generation.nextNoteAt);
              generation.nextNoteAt += 2 + Math.random() * 3;
            }
          }
          generation.timer = window.setTimeout(schedule, 500);
        };
        schedule();
      }

      // Pad voices fade in over 2 s and out over 2 s, overlapping the next chord for a crossfade.
      playChord(generation, frequencies, at) {
        const ctx = audioEngine.ctx;
        const first = generation.chord === 0;
        const fadeIn = first ? 2 : 1.2;
        const end = at + CHORD_SECONDS + 1.2;
        const count = AMBIENT_CHORDS.length;
        const previous = AMBIENT_CHORDS[(generation.chord - 1 + count) % count];
        const next = AMBIENT_CHORDS[(generation.chord + 1) % count];
        const rubs = (frequency, chord) => chord.some((other) => {
          const cents = Math.abs(1200 * Math.log2(frequency / other)) % 1200;
          const distance = Math.min(cents, 1200 - cents);
          return (distance > 50 && distance < 150) || (Math.max(frequency, other) < 300 && distance >= 150 && distance < 250);
        });
        // Mid-register whole steps (C5/D5, Bb4/C5) fade out a little early, without a late entry, to trim the shimmer.
        const midRub = (frequency, chord) => chord.some((other) => {
          const cents = Math.abs(1200 * Math.log2(frequency / other)) % 1200;
          const distance = Math.min(cents, 1200 - cents);
          return Math.max(frequency, other) < 700 && distance >= 150 && distance < 250;
        });
        const curve = (rising) => Float32Array.from({ length: 32 }, (_, step) => {
          const phase = (step / 31) * Math.PI / 2;
          return Math.max(0.0001, 0.03 * (rising ? Math.sin(phase) : Math.cos(phase)));
        });
        frequencies.forEach((frequency, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = frequency;
          // Detune follows the pitch, not the voice slot, so a note shared by two chords stays in tune with itself.
          const pitchClass = ((Math.round(12 * Math.log2(frequency / 440)) % 12) + 12) % 12;
          osc.detune.value = (pitchClass % 2 === 0 ? 4 : -4) + ((pitchClass * 7) % 3 - 1);
          const lateIn = !first && rubs(frequency, previous);
          const earlyOut = rubs(frequency, next);
          if (first) {
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.linearRampToValueAtTime(0.03, at + fadeIn);
          } else if (lateIn) {
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.setValueCurveAtTime(curve(true), at + 0.3, 0.9);
          } else {
            gain.gain.setValueCurveAtTime(curve(true), at, 1.2);
          }
          if (earlyOut) {
            gain.gain.setValueCurveAtTime(curve(false), at + CHORD_SECONDS, 0.6);
          } else if (midRub(frequency, next)) {
            gain.gain.setValueAtTime(0.03, at + CHORD_SECONDS);
            gain.gain.setValueCurveAtTime(curve(false), at + CHORD_SECONDS + 0.15, 0.9);
          } else {
            gain.gain.setValueCurveAtTime(curve(false), at + CHORD_SECONDS, 1.2);
          }
          // A soft octave partial keeps the pad audible on small phone speakers.
          const octave = ctx.createOscillator();
          const octaveLevel = ctx.createGain();
          octave.frequency.value = frequency * 2;
          octave.detune.value = osc.detune.value;
          // The lowest voice gets a stronger octave so phones still hear the chord's root.
          octaveLevel.gain.value = index === 0 ? 0.6 : 0.3;
          osc.connect(gain);
          octave.connect(octaveLevel);
          octaveLevel.connect(gain);
          gain.connect(generation.filter);
          osc.onended = () => { osc.disconnect(); octave.disconnect(); octaveLevel.disconnect(); gain.disconnect(); };
          osc.start(at);
          octave.start(at);
          osc.stop(end + 0.05);
          octave.stop(end + 0.05);
        });
      }

      playNote(generation, at) {
        const ctx = audioEngine.ctx;
        // Over the C chord (last in the cycle) F5 would rub against its E5, so it sits out.
        // Skip melody notes a semitone from any tone (or octave partial) of the chord now sounding.
        const chordAt = (offset) => AMBIENT_CHORDS[(generation.chord - offset + AMBIENT_CHORDS.length * 2) % AMBIENT_CHORDS.length];
        const sounding = [...chordAt(1), ...chordAt(2)].flatMap((tone) => [tone, tone * 2, tone * 4]);
        const clashes = (note) => sounding.some((tone) => {
          const distance = Math.abs(12 * Math.log2(note / tone)) % 12;
          return Math.min(distance, 12 - distance) > 0.5 && Math.min(distance, 12 - distance) < 1.5;
        });
        const safe = AMBIENT_MELODY.filter((note) => !clashes(note));
        const choices = safe.length ? safe : AMBIENT_MELODY;
        const frequency = choices[Math.floor(Math.random() * choices.length)];
        const gain = ctx.createGain();
        const panner = audioEngine.panner((Math.random() - 0.5) * 1);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.07, at + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 1.2);
        if (panner) { gain.connect(panner); panner.connect(generation.out); } else gain.connect(generation.out);
        [[1, 1], [3, 0.2]].forEach(([multiple, level]) => {
          const osc = ctx.createOscillator();
          const partial = ctx.createGain();
          osc.frequency.value = frequency * multiple;
          partial.gain.value = level;
          osc.connect(partial);
          partial.connect(gain);
          osc.onended = () => { osc.disconnect(); partial.disconnect(); if (multiple === 1) { gain.disconnect(); panner?.disconnect(); } };
          osc.start(at);
          osc.stop(at + 1.25);
        });
      }

      stop() {
        const generation = this.generation;
        if (!generation) return;
        this.generation = null;
        window.clearTimeout(generation.timer);
        const ctx = audioEngine.ctx;
        const now = ctx.currentTime;
        generation.out.gain.cancelScheduledValues(now);
        generation.out.gain.setValueAtTime(Math.max(0.0001, generation.out.gain.value), now);
        generation.out.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);
        window.setTimeout(() => {
          try { generation.lfo.stop(); } catch {}
          [generation.lfo, generation.lfoDepth, generation.filter, generation.out].forEach((node) => node.disconnect());
        }, 1600);
        armIdleSuspend();
      }

      updateVolume() {
        audioEngine.setVolume(state.soundVolume);
      }
    }

    ambientSoundscape = new ProceduralAmbient();

    function motionReduced() {

    function triggerSparkles(x, y, amount = 10, distance = 45) {

        spark.style.top = `${y}px`;
        spark.style.setProperty("--spark-color", colors[randomIndex(colors.length)]);
        spark.style.setProperty("--spark-rotate", `${i * (360 / amount) + randomIndex(30)}deg`);
        spark.style.setProperty("--spark-distance", `${15 + randomIndex(distance)}px`);
        spark.style.animationDuration = `${600 + randomIndex(400)}ms`;

    function saveState() {
      if (Array.isArray(state.revealedIds) && state.revealedIds.length) {
        const round = new Set(state.selectedQuestionIds);
        state.seenIds = [...new Set([...(Array.isArray(state.seenIds) ? state.seenIds : []), ...state.revealedIds])].filter((id) => round.has(id));
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // The game still works when storage is unavailable.
      }
    }

    function applyPreferences() {
      requestAnimationFrame(() => enforceCompactFloor());
      document.documentElement.dataset.theme = state.visualTheme;
      document.documentElement.dataset.textSize = state.textSize;
      document.documentElement.classList.toggle("high-contrast", state.highContrast);
      document.documentElement.classList.toggle("reduced-motion", state.reducedMotion);
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", {
        midnight: "#0f172a",
        sunset: "#6f2738",
        cosmic: "#04010f",
        pastel: "#fff8f6"
      }[state.visualTheme] || "#0f172a");
      try {
        const barColor = { midnight: "#0f172a", sunset: "#6f2738", cosmic: "#04010f", pastel: "#fff8f6" }[state.visualTheme] || "#0f172a";
        window.AlignedAndroid?.setSystemBars?.(barColor, state.visualTheme === "pastel");
      } catch {}

      try {
        if (state.ambientMusicEnabled && audioAllowed()) {
          ambientSoundscape.start();
          ambientSoundscape.updateVolume();
        } else {
          ambientSoundscape.stop();
        }
      } catch {
        // Music is an enhancement; never let it stop a screen from rendering.
      }

      const ambientBtn = document.getElementById("ambient-toggle");
      if (ambientBtn) {
        ambientBtn.classList.toggle("active", state.ambientMusicEnabled);
        ambientBtn.setAttribute("aria-pressed", String(state.ambientMusicEnabled));
      }

      const soundSwitch = document.getElementById("settings-sound");
      if (soundSwitch) soundSwitch.checked = state.soundEnabled;
      const ambientSwitch = document.getElementById("settings-ambient");
      if (ambientSwitch) ambientSwitch.checked = state.ambientMusicEnabled;
      const soundBtn = document.getElementById("sound-toggle");
      if (soundBtn) {
        soundBtn.classList.toggle("active", state.soundEnabled);
        const iconSpan = soundBtn.querySelector(".home-icon");
        if (iconSpan) {
          iconSpan.textContent = state.soundEnabled ? "🔊" : "🔇";
        }
        soundBtn.setAttribute("aria-pressed", String(state.soundEnabled));
      }

      const navButtons = {
        "home-button": "setup",
        "library-button": "library",
        "results-button": "results",
        "settings-button": "settings"
      };
      for (const [id, screenName] of Object.entries(navButtons)) {
        const el = document.getElementById(id);
        if (el) {
          const isActive = state.screen === screenName || (screenName === "setup" && state.screen === "setup");
          el.classList.toggle("active", isActive);
        }
      }
    }

    function pulseHaptic(kind = "tap") {
      if (!state.hapticsEnabled || !navigator.vibrate) return;
      const patterns = {
        tap: 14,
        step: 14,
        "partner-flip": 10,
        lock: [30],
        unlock: [10, 25, 14],
        reveal: 16,
        celebrate: [18, 40, 28],
        finale: [20, 40, 20, 40, 20, 80, 60],
        match: [12, 40, 12, 40, 24],
        error: [60, 50, 60],
        delete: 30,
        whoosh: 12,
        rate: 16,
        open: [12, 30, 16],
        countup: [14, 90, 14, 150, 14, 240, 14, 380, 16]
      };
      if (!(kind in patterns)) return;
      navigator.vibrate(patterns[kind]);
    }

    // Browsers block audio and vibration until the person has interacted with the page.
    function audioAllowed() {
      return navigator.userActivation ? navigator.userActivation.hasBeenActive : true;
    }

    // Every melodic sound uses the C-major pentatonic (C D E G A). Themes and question packs only
    // transpose by fourths/fifths, which keeps every note inside the F-major ambient music.
    const SOUND_SCALE = [261.63, 293.66, 329.63, 392.0, 440.0];
    const pentatonic = (degree, octave = 5) => {
      const index = ((degree % 5) + 5) % 5;
      return SOUND_SCALE[index] * 2 ** (octave - 4 + Math.floor(degree / 5));
    };
    const SOUND_THEMES = {
      cute: { semitones: 0, spacing: 1 },
      dreamy: { semitones: 5, spacing: 1.5 },
      arcade: { semitones: 5, spacing: 0.85 }
    };
    const TOPIC_SEMITONES = { love: 5, future: 5, spicy: 5, money: 5 };

    function soundNote(ctx, destination, frequency, at, peak, options = {}) {
      const theme = options.theme || "cute";
      const voice = ctx.createGain();
      const panner = audioEngine.panner(options.pan);
      if (panner) { voice.connect(panner); panner.connect(destination); } else voice.connect(destination);
      const nodes = [voice, panner].filter(Boolean);
      const oscillators = [];
      let end;
      if (theme === "dreamy") {
        // FM bell: the modulator's brightness dies away quickly while the tone rings on.
        const attack = options.attack ?? 0.025;
        const decay = options.decay ?? 1.2;
        end = at + decay;
        const carrier = ctx.createOscillator();
        const modulator = ctx.createOscillator();
        const depth = ctx.createGain();
        carrier.frequency.value = frequency;
        modulator.frequency.value = frequency * (frequency > 1500 ? 2 : 3.5);
        depth.gain.setValueAtTime(Math.min(frequency * 2, 2500), at);
        depth.gain.exponentialRampToValueAtTime(0.01, at + 0.3);
        modulator.connect(depth); depth.connect(carrier.frequency); carrier.connect(voice);
        const overtone = ctx.createOscillator();
        const overtoneLevel = ctx.createGain();
        overtone.frequency.value = frequency * 2;
        overtoneLevel.gain.value = 0.4;
        overtone.connect(overtoneLevel); overtoneLevel.connect(voice);
        voice.gain.setValueAtTime(0.0001, at);
        voice.gain.exponentialRampToValueAtTime(peak * 0.38, at + attack);
        voice.gain.exponentialRampToValueAtTime(0.0001, end);
        if (audioEngine.echoSend && !options.dry) voice.connect(audioEngine.echoSend);
        oscillators.push(carrier, modulator, overtone); nodes.push(depth, overtoneLevel);
      } else if (theme === "arcade") {
        const attack = options.attack ?? 0.002;
        const decay = options.decay ?? 0.13;
        end = at + decay;
        const osc = ctx.createOscillator();
        const tone = ctx.createBiquadFilter();
        osc.setPeriodicWave(audioEngine.pulseWave);
        osc.frequency.setValueAtTime(frequency / 2 ** (1 / 12), at);
        osc.frequency.exponentialRampToValueAtTime(frequency, at + 0.02);
        tone.type = "lowpass"; tone.frequency.value = 3800;
        osc.connect(tone); tone.connect(voice);
        voice.gain.setValueAtTime(0.0001, at);
        voice.gain.exponentialRampToValueAtTime(Math.min(0.5, peak * 2.2), at + attack);
        voice.gain.exponentialRampToValueAtTime(0.0001, end);
        oscillators.push(osc); nodes.push(tone);
      } else {
        const attack = options.attack ?? 0.006;
        const decay = options.decay ?? 0.18;
        end = at + decay;
        const osc = ctx.createOscillator();
        const octave = ctx.createOscillator();
        const octaveLevel = ctx.createGain();
        if (options.wave) osc.type = options.wave;
        osc.frequency.value = frequency;
        octave.type = "triangle";
        octave.frequency.value = frequency * 2;
        octaveLevel.gain.value = options.octaveLevel ?? 0.18;
        osc.connect(voice); octave.connect(octaveLevel); octaveLevel.connect(voice);
        voice.gain.setValueAtTime(0.0001, at);
        voice.gain.exponentialRampToValueAtTime(peak, at + attack);
        voice.gain.exponentialRampToValueAtTime(0.0001, end);
        oscillators.push(osc, octave); nodes.push(octaveLevel);
      }
      if (options.detune) oscillators.forEach((osc) => { osc.detune.value = options.detune; });
      oscillators.forEach((osc) => { osc.start(at); osc.stop(end + 0.03); });
      oscillators[0].onended = () => { oscillators.forEach((osc) => osc.disconnect()); nodes.forEach((node) => node.disconnect()); };
      return end;
    }

    function noiseSweep(ctx, at, { from = 900, to = 2600, duration = 0.22, peak = 0.05, q = 1 } = {}) {
      const source = ctx.createBufferSource();
      const band = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      source.buffer = audioEngine.noise;
      band.type = "bandpass"; band.Q.value = q;
      band.frequency.setValueAtTime(from, at);
      band.frequency.exponentialRampToValueAtTime(to, at + duration);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(peak, at + duration * 0.35);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
      source.connect(band); band.connect(gain); gain.connect(audioEngine.fxBus);
      source.onended = () => { source.disconnect(); band.disconnect(); gain.disconnect(); };
      source.start(at);
      source.stop(at + duration + 0.02);
      return at + duration;
    }

    // playSound(kind, { degree, pan, topic, exact }) — degree drives the climbing step, pan places
    // a card flip where the card is, topic transposes into the question pack's key.
    function playSound(kind = "tap", options = {}) {
      if (!audioAllowed()) return;
      pulseHaptic(kind === "celebrate" && options.finale ? "finale" : kind);
      if (!state.soundEnabled || !(state.soundVolume > 0) || document.hidden) { if (audioEngine.ctx) armIdleSuspend(); return; }
      try {
        const ctx = audioEngine.ensure();
        if (!ctx) return;
        audioEngine.resume();
        const themeName = SOUND_THEMES[state.soundTheme] ? state.soundTheme : "cute";
        const theme = SOUND_THEMES[themeName];
        const topic = options.topic || getSelectedQuestions?.()?.[state.questionIndex]?.topic;
        let semitones = ["celebrate", "countup"].includes(kind) ? 5 : theme.semitones + (TOPIC_SEMITONES[topic] || 0);
        const shift = 2 ** (semitones / 12);
        const out = audioEngine.fxBus;
        const start = Math.max(ctx.currentTime + 0.005, audioEngine.readyAt);
        const gap = (seconds) => seconds * theme.spacing;
        const note = (frequency, at, peak, extra = {}) => soundNote(ctx, out, frequency * shift, at, peak, { theme: themeName, pan: options.pan, ...extra });
        const wobble = () => ({ detune: (Math.random() - 0.5) * 16 });
        const jitter = () => 10 ** (((Math.random() - 0.5) * 3) / 20);
        let end = start;
        let duck = 0.7;
        const sequence = (frequencies, spacing, peak, extra) => frequencies.forEach((frequency, index) => {
          end = Math.max(end, note(frequency, start + index * gap(spacing), peak, extra));
        });

        if (kind === "tap") {
          const pickTap = [pentatonic(2), pentatonic(3), pentatonic(4)][Math.floor(Math.random() * 3)];
          // A slider change sounds its own value; other taps pick a nearby note for variety.
          const pick = Number.isFinite(Number(options.value)) ? pentatonic(Math.round((Math.max(1, Math.min(10, Number(options.value))) - 1) * 7 / 9)) : pickTap;
          // One octave for the whole slider (small tolerance for the rounded scale), so 10 never sounds below 9.
          const capped = pick * (pentatonic(7) * shift > 1770 ? 0.5 : 1);
          end = note(capped, start, 0.1 * jitter(), { ...wobble(), decay: themeName === "dreamy" ? 0.22 : 0.06, dry: true });
          duck = 0.8;
        } else if (kind === "step") {
          const raw = Math.max(0, Number(options.degree) || 0);
          // Spread the climb over the round: first question on the tonic, last an octave up.
          const ladder = [[0, 2], [0, 3], [1, 3], [1, 4], [2, 4], [2, 5], [3, 5], [3, 6], [4, 6], [4, 7], [5, 7]];
          const rungIndex = (value) => Number(options.count) > 1 ? Math.round((10 * Math.min(value, options.count - 1)) / (options.count - 1)) : value % ladder.length;
          const index = rungIndex(raw);
          const rung = ladder[index];
          const stepPeak = 0.08 * jitter() * (themeName === "dreamy" ? 0.85 : 1);
          const stepExtra = themeName === "dreamy" ? { ...wobble(), decay: 0.7 } : wobble();
          const repeated = raw > 0 && rungIndex(raw - 1) === index;
          const canLift = rung[1] + 1 < ladder[ladder.length - 1][1];
          sequence((repeated && !canLift ? [rung[0], rung[0] + 1, rung[1]] : rung).map((d) => pentatonic(d)), 0.055, stepPeak, stepExtra);
          if (repeated && canLift) {
            end = Math.max(end, note(pentatonic(rung[1] + 1), start + 2 * gap(0.055), stepPeak * 0.5, stepExtra));
          }
        } else if (kind === "lock") {
          sequence([pentatonic(3), pentatonic(2), pentatonic(0)], 0.075, 0.08, themeName === "cute" ? { octaveLevel: 0.6 } : undefined);
        } else if (kind === "unlock") {
          sequence([pentatonic(3, 4), pentatonic(0), pentatonic(2), pentatonic(3)], 0.06, 0.09, themeName === "cute" ? { octaveLevel: 0.6 } : undefined);
        } else if (kind === "reveal") {
          audioEngine.lastRevealAt = Date.now();
          noiseSweep(ctx, start, { from: 1400, to: 2800, duration: 0.07, peak: 0.04 });
          const d = (Number(options.degree) || 0) % 5;
          sequence([pentatonic(d), pentatonic(d + 3)], 0.06, 0.09 * (themeName === "dreamy" ? 0.75 : 1));
        } else if (kind === "match") {
          audioEngine.lastMatchAt = Date.now();
          noiseSweep(ctx, start, { from: 1400, to: 2800, duration: 0.07, peak: 0.035 });
          const d = (Number(options.degree) || 0) % 5;
          const melody = [pentatonic(d), pentatonic(d + 2), pentatonic(d + 3), pentatonic(d + 5)];
          const harmony = [pentatonic(d + 2), pentatonic(d + 3), pentatonic(d + 5), pentatonic(d + 7)];
          sequence(melody, 0.07, 0.11);
          harmony.forEach((frequency, index) => { end = Math.max(end, note(frequency, start + index * gap(0.07) + 0.01, 0.045)); });
          if (options.exact) end = Math.max(end, note(pentatonic(10), start + gap(0.3), 0.05, { decay: 0.5 }));
          duck = 0.45;
        } else if (kind === "celebrate") {
          sequence([pentatonic(0), pentatonic(2), pentatonic(3), pentatonic(5), pentatonic(7)], 0.06, 0.11);
          [pentatonic(0, 4), pentatonic(2, 4), pentatonic(3, 4), pentatonic(0)].forEach((frequency) => {
            end = Math.max(end, note(frequency, start, 0.028, { attack: 0.04, decay: 1.4 }));
          });
          if (options.finale) {
            // The score unlock swells on an F-major chord under the arpeggio.
            // Root, fifth and octave of the cue's own key: no semitone rub with the arpeggio.
            [pentatonic(0, 4), pentatonic(3, 4), pentatonic(0, 5)].forEach((frequency) => {
              end = Math.max(end, note(frequency, start, 0.035, { attack: 0.08, decay: 2.0, dry: true }));
            });
          }
          const sparkleCount = options.finale ? 14 : 8;
          const sparkleSpan = options.finale ? 1.4 : 0.9;
          for (let i = 0; i < sparkleCount; i++) {
            const at = start + Math.random() * sparkleSpan;
            end = Math.max(end, soundNote(ctx, out, pentatonic(Math.floor(Math.random() * 5), 7) * shift, at, 0.014, { theme: themeName, dry: true, pan: (Math.random() - 0.5) * 1.2, attack: 0.004, decay: 0.12 }));
          }
          duck = options.finale ? 0.2 : 0.45;
        } else if (kind === "countup") {
          // Ease-out ticks that climb an octave in step with the score rings (1.1 s).
          for (let i = 0; i < 12; i++) {
            const progress = 1 - (1 - (i + 1) / 12) ** 0.5;
            end = Math.max(end, soundNote(ctx, out, pentatonic(Math.round((i / 11) * 5)) * shift, start + progress * 0.92, (0.065 + 0.02 * (i / 11)) * (themeName === "dreamy" ? 1.4 : 1), { theme: themeName, attack: 0.003, decay: themeName === "dreamy" ? 0.12 : 0.045, dry: true }));
          }
          duck = 0.6;
        } else if (kind === "error") {
          [880, 698.46].forEach((frequency, index) => {
            end = Math.max(end, soundNote(ctx, out, frequency, start + index * 0.12, 0.075, { theme: "cute", attack: 0.015, decay: 0.12, wave: "triangle", octaveLevel: 0.3 }));
          });
        } else if (kind === "delete") {
          const osc = ctx.createOscillator();
          const tone = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(880, start);
          osc.frequency.exponentialRampToValueAtTime(440, start + 0.2);
          tone.type = "lowpass"; tone.frequency.value = 2500;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.085, start + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
          osc.connect(tone); tone.connect(gain); gain.connect(out);
          osc.onended = () => { osc.disconnect(); tone.disconnect(); gain.disconnect(); };
          osc.start(start); osc.stop(start + 0.25);
          noiseSweep(ctx, start, { from: 1200, to: 400, duration: 0.06, peak: 0.03 });
          end = start + 0.25;
        } else if (kind === "rate") {
          const d = (Number(options.degree) || 0) % 5;
          const cuteLift = themeName === "cute" ? { octaveLevel: 0.6 } : {};
          if (options.agree) sequence([pentatonic(d), pentatonic(d + 2)], 0.06, 0.08, cuteLift);
          else end = Math.max(end, note(pentatonic(d), start, 0.085, { ...cuteLift, decay: themeName === "dreamy" ? 0.6 : 0.12 }));
          duck = 0.8;
        } else if (kind === "partner-flip") {
          const d = (Number(options.degree) || 0) % 5;
          // Lower notes sit inside the pad, so they get a touch more level; dreamy matches stay just under error/rate.
          const tilt = (1 + 0.06 * (2 - d)) * (themeName === "dreamy" && options.match ? 0.95 : 1) * (themeName === "arcade" && options.match ? 1.1 : 1);
          end = note(pentatonic(d + (options.match ? 5 : 3)), start, 0.045 * tilt * (themeName === "dreamy" ? 2.0 : themeName === "cute" ? 1.2 : 1.25), { decay: themeName === "dreamy" ? 0.4 : 0.16, dry: true, ...(themeName === "cute" ? { octaveLevel: 0.6 } : {}), ...(themeName === "dreamy" ? { attack: 0.01 } : {}) });
          duck = 0.8;
        } else if (kind === "open") {
          noiseSweep(ctx, start, { from: 500, to: 2600, duration: 0.26, peak: 0.11, q: 0.8 });
          sequence([pentatonic(0), pentatonic(2), pentatonic(4)], 0.08, 0.08, themeName === "cute" ? { octaveLevel: 0.6 } : undefined);
          duck = 0.6;
        } else if (kind === "whoosh") {
          end = noiseSweep(ctx, start, { from: 500, to: 2600, duration: 0.26, peak: 0.2, q: 0.8 });
          end = Math.max(end, note(pentatonic(5), start + 0.22, 0.05, { decay: 0.12, dry: true }));
          duck = 0.7;
        }
        audioEngine.duck(duck, Math.max(0.1, end - ctx.currentTime));
        armIdleSuspend();
      } catch {
        // Sound is an enhancement; gameplay remains available without it.
      }
    }

    // With no music playing, a silent running context still costs battery: suspend it after 45 s idle
    // (long enough that thinking or typing an answer never makes the next tap wait on a resume).
    function armIdleSuspend() {
      window.clearTimeout(audioEngine.idleTimer);
      audioEngine.idleTimer = window.setTimeout(() => {
        // Music at volume 0 is silence too.
        const musicAudible = ambientSoundscape.generation && state.soundVolume > 0;
        if (!musicAudible && audioEngine.ctx && audioEngine.ctx.state === "running") audioEngine.ctx.suspend().catch(() => {});
      }, 45000);
    }

    function openExitDialog() {
      if (document.querySelector(".modal-backdrop")) return;

      const overlay = document.createElement("div");
      overlay.className = "modal-backdrop";
      overlay.innerHTML = `
        <section class="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="exit-title" aria-describedby="exit-copy">
          <div class="dialog-graphic" aria-hidden="true">⌂</div>
          <p class="eyebrow">Return home</p>
          <h2 id="exit-title">Pause this round?</h2>
          <p class="dialog-copy" id="exit-copy">Save your exact place and continue later, or discard only this unfinished round.${state.playStyle === "nearby" && nearbyChannelOpen() ? ` ${escapeHTML(state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "Your partner")}’s phone stays linked while you’re away.` : ""}</p>
          <div class="dialog-actions">
            <button class="secondary-btn danger-btn" id="discard-round" type="button">Discard round</button>
            <button class="secondary-btn" id="stay-in-round" type="button">Keep playing</button>
            <button class="primary-btn" id="save-exit-round" type="button">Save & exit</button>
          </div>
        </section>
      `;

      const closeDialog = () => {
        document.removeEventListener("keydown", handleKeydown);
        overlay.remove();
        homeButton.focus();
      };

      const handleKeydown = (event) => {
        // A confirm stacked on top owns Esc; it returns here instead of closing both.
        if (event.key === "Escape" && !overlay.hidden && !event.defaultPrevented && document.querySelectorAll(".modal-backdrop").length === 1) closeDialog();
      };

      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeDialog();
      });
      overlay.querySelector("#stay-in-round").addEventListener("click", closeDialog);
      overlay.querySelector("#save-exit-round").addEventListener("click", () => {
        state.resumeScreen = state.screen;
        state.screen = "setup";
        saveState();
        document.removeEventListener("keydown", handleKeydown);
        overlay.remove();
        playSound("lock");
        render();
      });
      overlay.querySelector("#discard-round").addEventListener("click", async () => {
        overlay.hidden = true;
        const sure = await openConfirmDialog({ eyebrow: "Discard round", title: "Throw away this round’s answers?", copy: "Both players’ answers for this round will be deleted. This can’t be undone.", confirmLabel: "Discard answers", cancelLabel: "Keep them", danger: true, safeFirst: true });
        overlay.hidden = false;
        if (!sure) { overlay.querySelector("#stay-in-round")?.focus(); return; }
        if (state.playStyle === "nearby") closeNearbyConnection({ notifyPartner: true });
        state = {
          ...initialState(),
          ...persistentSetupState()
        };
        saveState();
        document.removeEventListener("keydown", handleKeydown);
        overlay.remove();
        playSound("delete");
        render();
      });
      document.addEventListener("keydown", handleKeydown);
      document.body.appendChild(overlay);
      overlay.querySelector("#stay-in-round").focus();
    }

    function openResetDialog() {
      if (document.querySelector(".modal-backdrop")) return;
      const overlay = document.createElement("div");
      overlay.className = "modal-backdrop";
      overlay.innerHTML = `
        <section class="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-copy">
          <div class="dialog-graphic" aria-hidden="true">↺</div>
          <p class="eyebrow">Full reset</p>
          <h2 id="reset-title">Erase all game data?</h2>
          <p class="dialog-copy" id="reset-copy">This removes names, current answers, saved round results, question history, exclusions, custom questions, and settings from this browser. Export a backup first if you may want them later.</p>
          <div class="dialog-actions">
            <button class="secondary-btn" id="cancel-reset" type="button">Keep my data</button>
            <button class="primary-btn danger-btn" id="confirm-reset" type="button">Reset everything</button>
          </div>
        </section>
      `;
      const close = () => {
        document.removeEventListener("keydown", onKeydown);
        overlay.remove();
      };
      const onKeydown = (event) => {
        if (event.key === "Escape") close();
      };
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) close();
      });
      overlay.querySelector("#cancel-reset").addEventListener("click", close);
      overlay.querySelector("#confirm-reset").addEventListener("click", () => {
        [STORAGE_KEY, ...LEGACY_STORAGE_KEYS].forEach((key) => localStorage.removeItem(key));
        unreadableSaveKeys().forEach((key) => localStorage.removeItem(key));
        state = initialState();
        libraryView = { filter: "all", topic: "all", search: "", limit: 40 };
        document.removeEventListener("keydown", onKeydown);
        overlay.remove();
        playSound("delete");
        render();
        showToast("Everything was reset on this browser.");
      });
      document.addEventListener("keydown", onKeydown);
      document.body.appendChild(overlay);
      overlay.querySelector("#cancel-reset").focus();
    }

    // A finished round whose scores haven't been unlocked yet still has its payoff ahead.
    function revealUnfinished() {
      return state.selectedQuestionIds.length > 0 && state.completedPlayers?.[0] === true && state.completedPlayers?.[1] === true
        && state.revealCelebrated !== state.selectedQuestionIds.join("|");
    }

    function roundScoresHidden(round) {
      return Boolean(round) && revealUnfinished() && round === state.completedRounds[state.completedRounds.length - 1]
        && Array.isArray(round.questionIds) && round.questionIds.join("|") === state.selectedQuestionIds.join("|");
    }

    function revealRemainingCopy() {
      const unseen = state.selectedQuestionIds.filter((id) => !cardSeen(id)).length;
      const pending = unratedWrittenIds(getSelectedQuestions().filter(Boolean)).length;
      return [unseen && `${unseen} ${unseen === 1 ? "card" : "cards"} to flip`, pending && `${pending} ${pending === 1 ? "answer" : "answers"} to rate`].filter(Boolean).join(" · ");
    }

    // Resolves true when it is fine to leave the current round's reveal behind.
    // Closes (as "stay") any open confirm dialog whose question the partner's phone just made moot.
    function dismissConfirmDialogs(tag) {
      document.querySelectorAll(`.modal-backdrop[data-confirm-tag="${tag}"] [data-modal-cancel]`).forEach((button) => button.click());
    }

    async function confirmLeavingReveal(confirmLabel = "Start anyway") {
      if (!revealUnfinished()) return true;
      const left = revealRemainingCopy();
      return openConfirmDialog({
        eyebrow: "Reveal board",
        title: "Your scores haven’t been revealed yet",
        copy: `${left ? `${left}. ` : ""}Leave now and this round’s count-up is skipped — its scores go straight to your Journal.`,
        confirmLabel,
        cancelLabel: "Keep revealing",
        safeFirst: true,
        tag: "reveal-guard"
      });
    }

    // Asks about an unfinished reveal and/or a paused round. Resolves to a function that applies the
    // agreed changes (call it right before the new round starts), or null if the person stayed.
    // alreadyWarned: an earlier dialog (ending the link) already told them the scores would be skipped.
    async function confirmStartingOver({ alreadyWarned = false } = {}) {
      let leaveReveal = false;
      let discardPaused = false;
      if (alreadyWarned && ["question", "intermission", "nearby-wait"].includes(state.resumeScreen) && state.selectedQuestionIds.length) {
        return () => { state.resumeScreen = null; saveState(); };
      }
      if (alreadyWarned && revealUnfinished()) {
        leaveReveal = true;
      } else if (["celebration", "reveal"].includes(state.resumeScreen) && revealUnfinished()) {
        if (!(await confirmLeavingReveal())) return null;
        leaveReveal = true;
      } else if (revealUnfinished() && ["celebration", "reveal"].includes(state.screen)) {
        if (!(await confirmLeavingReveal())) return null;
        leaveReveal = true;
      }
      if (["question", "intermission", "nearby-wait"].includes(state.resumeScreen) && state.selectedQuestionIds.length) {
        const discard = await openConfirmDialog({
          eyebrow: "Paused round",
          title: "Start a new round instead?",
          copy: "You have a paused round. Starting a new one discards its unfinished answers. Saved results are not affected.",
          confirmLabel: "Discard and start new",
          cancelLabel: "Keep paused round",
          danger: true
        });
        if (!discard) return null;
        discardPaused = true;
      }
      return () => {
        if (leaveReveal) state.revealCelebrated = state.selectedQuestionIds.join("|");
        if (discardPaused && (state.playStyle === "nearby" || state.resumeScreen === "nearby-wait")) closeNearbyConnection({ notifyPartner: true });
        if (leaveReveal || discardPaused) state.resumeScreen = null;
        saveState();
      };
    }

    // Scrolls just enough that an opened panel sits above the question screen's sticky action bar.
    function revealAboveStickyBar(element) {
      requestAnimationFrame(() => {
        const bar = document.querySelector(".question-actions");
        const barHeight = bar && getComputedStyle(bar).position === "sticky" ? bar.offsetHeight : 0;
        const rect = element.getBoundingClientRect();
        const room = window.innerHeight - barHeight - 12;
        const topbar = document.querySelector(".topbar");
        const topGap = topbar && getComputedStyle(topbar).position === "sticky" ? 96 : 8;
        const overflow = Math.min(rect.bottom - room, rect.top - topGap);
        if (overflow > 0) window.scrollBy({ top: overflow, behavior: motionReduced() ? "auto" : "smooth" });
      });
    }

    // A phone still linked to its partner that starts something else ends the link properly first,
    // so the partner is told instead of waiting on "Waiting for … to start". Resolves to a commit
    // function (call it once the new round really starts) or null if the person stays linked.
    // Linked = the channel is open, or a two-phone session is still alive and trying to reconnect.
    function nearbyLinked() {
      if (nearbyChannelOpen()) return true;
      return state.playStyle === "nearby" && Boolean(nearbyRuntime.role) && Boolean(state.nearbyRoundId)
        && !["expired", "in-use", "failed", "partner-cancelled", "unsupported", "idle"].includes(nearbyRuntime.status) && !nearbyRuntime.partnerLeft;
    }

    // starting: false when only the link ends (the play-style toggle) and no round starts yet.
    // The commit function returns true when this phone was the joiner, so callers can make it Player 1.
    async function confirmEndingLink({ starting = true } = {}) {
      if (!nearbyLinked()) return () => false;
      const partner = state.names[nearbyLocalPlayer() === 0 ? 1 : 0] || "your partner";
      const unfinished = starting && revealUnfinished() ? " Your scores haven’t been revealed yet — leaving skips the count-up and its scores go straight to your Journal." : "";
      const paused = ["question", "intermission", "nearby-wait"].includes(state.resumeScreen) ? " Your paused two-phone round will be discarded." : "";
      const ok = await openConfirmDialog({ title: "End the two-phone link?", copy: `${partner}’s phone will be told you left.${unfinished}${paused}`, confirmLabel: starting ? "End link and start" : "End link", cancelLabel: "Stay linked", safeFirst: true, tag: "link" });
      if (!ok) return null;
      return () => {
        const wasJoiner = state.nearbyRole === "join";
        if (starting && revealUnfinished()) state.revealCelebrated = state.selectedQuestionIds.join("|");
        closeNearbyConnection({ notifyPartner: true });
        state.nearbyRole = "";
        const keepReveal = !starting && revealUnfinished() && ["celebration", "reveal"].includes(state.resumeScreen);
        if (!keepReveal) state.resumeScreen = null;
        return wasJoiner;
      };
    }

    function isLiveRoundScreen(screen = state.screen) {
      return ["question", "intermission", "nearby", "nearby-wait"].includes(screen);
    }

    function navigateToScreen(screen) {
      if (state.screen === "nearby") {
        // Nothing is in progress on the pairing screen; leaving it closes the room so a late scan can't hang.
        closeNearbyConnection({ notifyPartner: true });
        // Leaving without a partner round keeps any local round resumable and its one-device play style.
        state.resumeScreen = state.nearbyRepairScreen || state.resumeScreen || null;
        state.nearbyRepairScreen = "";
        if (state.playStyleBeforeJoin) state.playStyle = state.playStyleBeforeJoin;
        state.playStyleBeforeJoin = "";
        nearbyRuntime.initConfirmed = false;
        state.screen = screen;
        saveState();
        render();
        return;
      }
      if (screen === "setup" && isLiveRoundScreen()) {
        openExitDialog();
        return;
      }
      if (isLiveRoundScreen()) {
        state.resumeScreen = state.screen;
        showToast("Round paused safely. Continue from Home whenever you are ready.");
      } else if (["celebration", "reveal"].includes(state.screen) && screen !== state.screen && revealUnfinished()) {
        state.resumeScreen = state.screen;
        if (screen !== "results") showToast(screen === "setup" ? `Reveal board saved — ${POINTER_VERB.toLowerCase()} Continue whenever you’re ready.` : `Reveal board saved — ${POINTER_VERB.toLowerCase()} Continue on Home to pick it up.`);
      }
      state.screen = screen;
      saveState();
      playSound("tap");
      render();
      focusScreenHeading();
    }

    document.getElementById("home-button")?.addEventListener("click", () => navigateToScreen("setup"));
    document.getElementById("library-button")?.addEventListener("click", () => navigateToScreen("library"));
    document.getElementById("results-button")?.addEventListener("click", () => navigateToScreen("results"));
    document.getElementById("settings-button")?.addEventListener("click", () => navigateToScreen("settings"));
    document.getElementById("sound-toggle")?.addEventListener("click", () => {
      state.soundEnabled = !state.soundEnabled;
      saveState();
      playSound("tap");
      applyPreferences();
    });

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeAnswer(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function textSimilarity(first, second) {
      const a = normalizeAnswer(first);
      const b = normalizeAnswer(second);
      if (!a || !b) return 0;
      if (a === b) return 1;

      const aTokens = new Set(a.split(" ").filter((word) => word.length > 2));
      const bTokens = new Set(b.split(" ").filter((word) => word.length > 2));
      const intersection = [...aTokens].filter((word) => bTokens.has(word)).length;
      const union = new Set([...aTokens, ...bTokens]).size;
      const tokenScore = union ? intersection / union : 0;

      const bigrams = (text) => {
        const pairs = [];
        for (let index = 0; index < text.length - 1; index += 1) pairs.push(text.slice(index, index + 2));
        return pairs;
      };
      const aPairs = bigrams(a);
      const bPairs = bigrams(b);
      const available = [...bPairs];
      let pairMatches = 0;
      aPairs.forEach((pair) => {
        const matchIndex = available.indexOf(pair);
        if (matchIndex >= 0) {
          pairMatches += 1;
          available.splice(matchIndex, 1);
        }
      });
      const characterScore = aPairs.length + bPairs.length
        ? (2 * pairMatches) / (aPairs.length + bPairs.length)
        : 0;
      return Math.max(characterScore, tokenScore * 0.92);
    }

    function sliderMeaning(question, value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      const labels = question.labels || ["Low", "High"];
      const end = number <= 3 ? labels[0] : number >= 8 ? labels[1] : number === 4 ? `Leaning toward “${labels[0]}”` : number === 7 ? `Leaning toward “${labels[1]}”` : "In the middle";
      return `${sliderDisplay(value)} · ${end}`;
    }

    function sliderDisplay(value) {
      const number = Number(value);
      return Number.isFinite(number) && value !== "" && value !== null ? String(Math.max(1, Math.min(10, Math.round(number)))) : "—";
    }

    function hasComparableAnswer(question, value) {
      if (question.type === "slider") return value !== "" && value !== null && value !== undefined && Number.isFinite(Number(value));
      return typeof value === "string" ? value.trim().length > 0 : value !== null && value !== undefined && String(value).trim().length > 0;
    }

    function getMatchInfo(question, firstAnswer, secondAnswer) {
      if (!hasComparableAnswer(question, firstAnswer) || !hasComparableAnswer(question, secondAnswer)) {
        return { isMatch: false, exact: false, percent: 0, gap: null, missing: true, label: "Only one answer", color: "#94a3b8" };
      }
      if (question.type === "slider") {
        const gap = Math.abs(Number(firstAnswer) - Number(secondAnswer));
        const percent = Math.round((1 - gap / 9) * 100);
        if (gap === 0) return { isMatch: true, exact: true, percent, gap, label: "Perfect match", color: "#fbbf24" };
        if (gap === 1) return { isMatch: true, exact: false, percent, gap, label: "Nearly identical", color: "#4ade80" };
        if (gap === 2) return { isMatch: false, exact: false, percent, gap, label: "Very close", color: "#86efac" };
        if (gap <= 4) return { isMatch: false, exact: false, percent, gap, label: "A little distance", color: "#facc15" };
        if (gap <= 6) return { isMatch: false, exact: false, percent, gap, label: "Different temperatures", color: "#fb923c" };
        return { isMatch: false, exact: false, percent, gap, label: "Opposite ends", color: "#fb7185" };
      }

      const similarity = textSimilarity(firstAnswer, secondAnswer);
      const percent = Math.round(similarity * 100);
      const exact = normalizeAnswer(firstAnswer) === normalizeAnswer(secondAnswer);
      if (exact) return { isMatch: true, exact: true, percent: 100, label: "Same answer", color: "#fbbf24" };
      if (similarity >= 0.72) return { isMatch: true, exact: false, percent, label: "Strong wording match", color: "#4ade80" };
      if (similarity >= 0.48) return { isMatch: false, exact: false, percent, label: "Similar themes", color: "#86efac" };
      if (similarity >= 0.24) return { isMatch: false, exact: false, percent, label: "Some overlap", color: "#facc15" };
      return { isMatch: false, exact: false, percent, label: "Unique perspectives", color: "#a78bfa" };
    }

    const TEXT_RATING_INFO = {
      aligned: { label: "You agree", color: "#4ade80", isMatch: true },
      nuanced: { label: "Similar, with nuance", color: "#86efac", isMatch: true },
      discuss: { label: "Worth discussing", color: "#fbbf24", isMatch: false },
      different: { label: "Very different", color: "#fb7185", isMatch: false }
    };

    // The couple decides how close two written answers are; until then the card says so instead of guessing.
    function revealMatchInfo(question, firstAnswer, secondAnswer) {
      if (question.type !== "text") return getMatchInfo(question, firstAnswer, secondAnswer);
      if (!hasComparableAnswer(question, firstAnswer) || !hasComparableAnswer(question, secondAnswer)) return getMatchInfo(question, firstAnswer, secondAnswer);
      const rating = state.textRatings[question.id];
      const info = TEXT_RATING_INFO[rating];
      if (!info) return { isMatch: false, exact: false, percent: null, unrated: true, label: "Your call", color: "#a78bfa" };
      return { isMatch: info.isMatch, exact: rating === "aligned", percent: ratingScore(rating), label: info.label, color: info.color, rated: true };
    }

    // Written answers are scored by the couple's own rating, so scores stay locked until those are rated.
    function unratedWrittenIds(questions) {
      return questions.filter((question) => question.type === "text"
        && !state.notReady[0]?.[question.id] && !state.notReady[1]?.[question.id]
        && hasComparableAnswer(question, state.answers[0][question.id]) && hasComparableAnswer(question, state.answers[1][question.id])
        && !TEXT_RATING_INFO[state.textRatings[question.id]]).map((question) => question.id);
    }

    function differenceMarkup(matchInfo, question) {
      if (matchInfo.unrated) return "";
      const scoreCopy = matchInfo.missing
        ? "Not compared"
        : matchInfo.rated
          ? "Your rating"
          : question.type === "slider"
        ? `${matchInfo.gap} point${matchInfo.gap === 1 ? "" : "s"} apart`
        : `${matchInfo.percent}% wording overlap`;
      return `
        <div class="difference-panel" style="--match-color: ${matchInfo.color}; --match-percent: ${matchInfo.percent}%">
          <div class="difference-topline">
            <span class="difference-label"><span aria-hidden="true">${matchInfo.isMatch ? "★" : "●"}</span>${matchInfo.label}</span>
            <span class="difference-score">${scoreCopy}</span>
          </div>
          <div class="difference-track" aria-label="${matchInfo.percent}% similarity"><span class="difference-mask"></span></div>
        </div>
      `;
    }

    function alignmentColor(percent) {
      const score = Math.max(0, Math.min(100, Number(percent) || 0));
      return state.visualTheme === "pastel" ? `hsl(${Math.round(score * 1.2)} 85% 28%)` : `hsl(${Math.round(score * 1.2)} 76% 56%)`;
    }

    function alignmentDescriptor(percent) {
      if (percent >= 88) return { title: "Wonderfully in sync", copy: "Your answers are dancing to nearly the same beat." };
      if (percent >= 72) return { title: "Strong alignment", copy: "You share a lot of common ground with a few interesting edges." };
      if (percent >= 55) return { title: "A colorful mix", copy: "There is meaningful overlap and plenty worth talking about." };
      if (percent >= 38) return { title: "Different wavelengths", copy: "Your perspectives diverge, which makes curiosity especially valuable." };
      return { title: "Opposites with stories", copy: "You see these questions differently—slow down and learn what shaped each answer." };
    }

    function fitDescriptor(percent) {
      if (percent >= 88) return { title: "A natural fit" };
      if (percent >= 72) return { title: "Fitting well together" };
      if (percent >= 55) return { title: "A workable fit" };
      if (percent >= 38) return { title: "Room to grow together" };
      return { title: "Building your fit" };
    }

    function alignmentRingMarkup(percent, caption = "aligned") {
      const score = Math.max(0, Math.min(100, Math.round(Number(percent) || 0)));
      const color = alignmentColor(score);
      return `
        <div class="alignment-ring" style="--ring-score: ${score}; --ring-color: ${color}" role="img" aria-label="${score}% ${caption}">
          <div class="alignment-ring-content"><strong>${score}%</strong><span>${caption}</span></div>
        </div>
      `;
    }

    function ratingScore(value) {
      return { aligned: 100, nuanced: 75, discuss: 45, different: 15 }[value];
    }

    function calculateAlignmentSummaryForAnswers(questions, answers, ratings = {}, importance = [{}, {}], notReady = [{}, {}]) {
      const scored = questions.filter((question) => !notReady[0]?.[question.id] && !notReady[1]?.[question.id]
        && hasComparableAnswer(question, answers[0]?.[question.id]) && hasComparableAnswer(question, answers[1]?.[question.id])
        && (question.type !== "text" || ratingScore(ratings[question.id]) !== undefined)).map((question) => {
        const score = question.type === "text" && ratingScore(ratings[question.id]) !== undefined
          ? ratingScore(ratings[question.id])
          : getMatchInfo(question, answers[0]?.[question.id], answers[1]?.[question.id]).percent;
        const importanceLevel = Math.max(Number(importance[0]?.[question.id] ?? 1), Number(importance[1]?.[question.id] ?? 1));
        const impact = [0.2, 0.62, 1][importanceLevel] ?? 0.62;
        const fitScore = Math.round(100 - (100 - score) * impact);
        return { question, score, fitScore, importanceLevel };
      });
      const overall = scored.length
        ? Math.round(scored.reduce((total, item) => total + item.score, 0) / scored.length)
        : 0;
      const fitOverall = scored.length
        ? Math.round(scored.reduce((total, item) => total + item.fitScore, 0) / scored.length)
        : 0;
      const topicGroups = new Map();
      scored.forEach((item) => {
        const values = topicGroups.get(item.question.topic) || [];
        values.push({ score: item.score, fitScore: item.fitScore });
        topicGroups.set(item.question.topic, values);
      });
      const topics = [...topicGroups.entries()].map(([topic, values]) => ({
        topic,
        score: Math.round(values.reduce((total, value) => total + value.score, 0) / values.length),
        fitScore: Math.round(values.reduce((total, value) => total + value.fitScore, 0) / values.length),
        count: values.length
      }));
      return { overall, fitOverall, topics, scoredCount: scored.length, unscoredCount: questions.length - scored.length };
    }

    function calculateAlignmentSummary(questions) {
      return calculateAlignmentSummaryForAnswers(questions, state.answers, state.textRatings, state.importance, state.notReady);
    }

    function createCompletedRoundSnapshot() {
      const questions = getSelectedQuestions().filter(Boolean);
      const copyForQuestions = (source) => Object.fromEntries(
        questions.map((question) => [question.id, source?.[question.id] ?? ""])
      );
      return {
        id: `round_${Date.now()}_${randomIndex(1000000)}`,
        completedAt: new Date().toISOString(),
        preset: state.sessionPreset,
        names: [...state.names],
        questionIds: questions.map((question) => question.id),
        answers: state.answers.map(copyForQuestions),
        comments: state.comments.map(copyForQuestions),
        privateNotes: state.privateNotes.map(copyForQuestions),
        importance: state.importance.map(copyForQuestions),
        notReady: state.notReady.map(copyForQuestions),
        textRatings: { ...state.textRatings },
        conversationStatus: { ...state.conversationStatus },
        sharedIntentions: JSON.parse(JSON.stringify(state.sharedIntentions)),
        intensity: state.questionIntensity,
        alignment: calculateAlignmentSummary(questions)
      };
    }

    function syncLatestRoundSnapshot() {
      const latest = state.completedRounds[state.completedRounds.length - 1];
      if (!latest || latest.questionIds.join("|") !== state.selectedQuestionIds.join("|")) return;
      latest.textRatings = { ...state.textRatings };
      latest.privateNotes = state.privateNotes.map((notes) => ({ ...notes }));
      latest.importance = state.importance.map((values) => ({ ...values }));
      latest.notReady = state.notReady.map((values) => ({ ...values }));
      latest.conversationStatus = { ...state.conversationStatus };
      latest.sharedIntentions = JSON.parse(JSON.stringify(state.sharedIntentions));
      latest.alignment = calculateAlignmentSummary(getSelectedQuestions().filter(Boolean));
    }

    function formatRoundDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Saved round";
      return new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }).format(date);
    }

    function burstConfetti(element, amount = 22) {
      if (motionReduced()) return;
      const rect = element?.getBoundingClientRect?.();
      const originX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
      const originY = rect ? rect.top + Math.min(rect.height / 2, 180) : window.innerHeight / 2;
      const colors = ["var(--coral)", "var(--blue)", "var(--green)", "var(--violet)", "var(--sun)"];
      for (let index = 0; index < amount; index += 1) {
        const spark = document.createElement("span");
        spark.className = "celebration-spark";
        spark.style.left = `${originX}px`;
        spark.style.top = `${originY}px`;
        spark.style.setProperty("--spark-color", colors[index % colors.length]);
        spark.style.setProperty("--spark-rotate", `${index * (360 / amount) + randomIndex(18)}deg`);
        spark.style.setProperty("--spark-distance", `${75 + randomIndex(145)}px`);
        spark.style.animationDelay = `${randomIndex(70)}ms`;
        if (index % 3 === 0) spark.style.borderRadius = "50%";
        document.body.appendChild(spark);
        window.setTimeout(() => spark.remove(), 1200);
      }
    }

    function animateRoundSelection(button, onReady) {
      const original = button.textContent;
      button.disabled = true;
      button.textContent = "Mixing fresh questions…";
      button.classList.add("selecting-round");
      burstConfetti(button, 12);
      window.setTimeout(() => {
        button.disabled = false;
        button.textContent = original;
        button.classList.remove("selecting-round");
        onReady();
      }, motionReduced() ? 20 : 620);
    }

    function randomIndex(length) {
      if (window.crypto && window.crypto.getRandomValues) {
        const max = Math.floor(0x100000000 / length) * length;
        const values = new Uint32Array(1);
        do {
          window.crypto.getRandomValues(values);
        } while (values[0] >= max);
        return values[0] % length;
      }
      return Math.floor(Math.random() * length);
    }

    function shuffled(values) {
      const copy = [...values];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = randomIndex(index + 1);
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function drawBalanced(pool, count) {
      const remaining = [...pool];
      const selected = [];
      while (selected.length < count && remaining.length) {
        const topics = shuffled([...new Set(remaining.map((question) => question.topic))]);
        for (const topic of topics) {
          if (selected.length >= count) break;
          const candidates = remaining.filter((question) => question.topic === topic);
          if (!candidates.length) continue;
          const chosen = candidates[randomIndex(candidates.length)];
          selected.push(chosen);
          remaining.splice(remaining.findIndex((question) => question.id === chosen.id), 1);
        }
      }
      return selected;
    }

    function questionLastUsedMap() {
      const lastUsed = new Map();
      state.completedRounds.forEach((round, roundIndex) => {
        const completedAt = Date.parse(round.completedAt);
        const usageOrder = Number.isFinite(completedAt) ? completedAt : roundIndex;
        round.questionIds.forEach((id) => {
          lastUsed.set(id, Math.max(lastUsed.get(id) ?? -Infinity, usageOrder));
        });
      });
      return lastUsed;
    }

    function freshestQuestionTier(questions) {
      if (!questions.length) return [];
      const answeredIds = new Set(state.answeredQuestionIds);
      const unanswered = questions.filter((question) => !answeredIds.has(question.id));
      if (unanswered.length) return unanswered;

      const lastUsed = questionLastUsedMap();
      const oldestUsage = Math.min(...questions.map((question) => lastUsed.get(question.id) ?? -Infinity));
      return questions.filter((question) => (lastUsed.get(question.id) ?? -Infinity) === oldestUsage);
    }

    function selectFreshQuestionIds(questionIds, limit = 15) {
      const catalogById = new Map(getQuestionCatalog().map((question) => [question.id, question]));
      const remaining = questionIds.map((id) => catalogById.get(id)).filter(Boolean);
      const selected = [];
      while (selected.length < limit && remaining.length) {
        const tier = freshestQuestionTier(remaining);
        const chosen = tier[randomIndex(tier.length)];
        selected.push(chosen.id);
        remaining.splice(remaining.findIndex((question) => question.id === chosen.id), 1);
      }
      return selected;
    }

    const DEEP_PROMPT_PATTERN = /emotional safety|vulnerab|insecur|trauma|forgiv|jealous|regret|lonel|grief|hurt|betray|resent|conflict|argument|fight|fear|boundar|trust|apolog|repair|deal ?breaker|walk away|not in the mood|consent|disagree|reset|reconnect/i;
    // Whole words only: "compete" is not about pets.
    const LIGHT_PROMPT_PATTERN = /\b(?:karaoke|superpowers?|movies?|films?|songs?|snacks?|pizza|vacations?|holidays?|weekends?|zombies?|games?|sitcoms?|pets?|desserts?|playlists?|road trips?|festivals?|danc(?:e|es|ing)|costumes?|emojis?|lottery|islands?|breakfast|coffee|ice cream|theme parks?)\b/i;
    const PLAYFUL_SPICY = /^spy_(?:2[2-9]|3\d)$/;
    // Comfort, consent and boundary prompts: these get gentle follow-ups, never flirty ones.
    const SENSITIVE_SPICY = /^spy_(?:2|5|6|10|13|15|17|20|21)$/;
    const HISTORY_PROMPT_PATTERN = /\bour relationship\b|\bthe relationship we\b|\bfrom me\b|\bwe have built\b|\bsince we met\b|\bour history\b|\bwhen we first\b|\bin our home\b|\babout me that\b|\bour friendship\b|\bhabit of mine\b|\bmoment between us\b|\bfelt unexpectedly\b|\bwhat should I do\b|\bcheck-in\b|\bnicknames between us\b|\brecently\b|\bby me\b|\bI (?:have )?tried\b|\bI sometimes\b|\bnever stop\b|\bour closeness\b|\bI might\b|\bhas grown\b|\bdo I\b|\bhave I\b|\bfalling asleep\b/i;

    function questionTone(question) {
      if (["dealbreakers", "politics", "money"].includes(question.topic) || DEEP_PROMPT_PATTERN.test(question.prompt)) return "deep";
      if (question.topic === "fun") return "light";
      if (!["lifestyle", "future"].includes(question.topic) && (LIGHT_PROMPT_PATTERN.test(question.prompt) || /\b(?:birthdays?|gifts?|surprises?|nicknames?)\b/i.test(question.prompt))) return "light";
      return "warm";
    }

    function questionNeedsHistory(question) {
      return HISTORY_PROMPT_PATTERN.test(question.prompt);
    }

    // Warm up with something light, let the deepest prompt land about two-thirds in, finish gently,
    // and never show the same answer format three times in a row.
    function orderRoundAsRamp(questionIds) {
      const catalogById = new Map(getQuestionCatalog().map((question) => [question.id, question]));
      const items = questionIds.map((id) => catalogById.get(id)).filter(Boolean);
      if (items.length < 3) return questionIds;
      const weight = { light: 0, warm: 1, deep: 2 };
      const sorted = [...items].sort((a, b) => weight[questionTone(a)] - weight[questionTone(b)]);
      // Open on a tap-and-go slider or quick pick rather than a blank text box.
      const opener = sorted.find((question) => question.type === "slider" && questionTone(question) !== "deep") || sorted[0];
      sorted.splice(sorted.indexOf(opener), 1);
      const closer = sorted.find((question) => questionTone(question) !== "deep") || sorted[0];
      sorted.splice(sorted.indexOf(closer), 1);
      const middle = sorted;
      const deepest = middle.filter((question) => questionTone(question) === "deep");
      const rest = middle.filter((question) => questionTone(question) !== "deep");
      const ordered = [opener, ...rest];
      const peakIndex = Math.max(1, Math.round(items.length * 0.66) - 1);
      deepest.forEach((question, offset) => ordered.splice(Math.min(ordered.length, peakIndex + offset), 0, question));
      ordered.push(closer);
      const last = ordered.length - 1;
      for (let index = 2; index < last; index += 1) {
        if (ordered[index].type === ordered[index - 1].type && ordered[index].type === ordered[index - 2].type) {
          const swap = ordered.findIndex((question, other) => other > index && other < last && question.type !== ordered[index].type);
          if (swap > 0) [ordered[index], ordered[swap]] = [ordered[swap], ordered[index]];
          else {
            const runType = ordered[index].type;
            const fits = (other) => other >= 1 && ordered[other].type !== runType && questionTone(ordered[other]) !== "deep"
              && ordered[other - 1]?.type !== runType && ordered[other + 1]?.type !== runType;
            let back = index - 3;
            while (back >= 1 && !fits(back)) back -= 1;
            if (back >= 1) [ordered[index - 1], ordered[back]] = [ordered[back], ordered[index - 1]];
          }
        }
      }
      return ordered.map((question) => question.id);
    }

    // Two prompts that share most of their words ("affection in public") count as the same question tonight.
    const promptWordCache = new Map();
    function promptWords(text) {
      if (promptWordCache.has(text)) return promptWordCache.get(text);
      const words = new Set(String(text).toLowerCase().match(/[a-z]{4,}/g)?.filter((word) => !["what", "your", "when", "with", "how", "much", "would", "like", "most", "about", "that", "this", "ideal", "amount", "value"].includes(word)) || []);
      promptWordCache.set(text, words);
      return words;
    }
    // Adjacent content-word pairs ("road trip", "comfortable silence") for spotting reworded twins.
    const promptPairCache = new Map();
    function promptPairs(text) {
      if (promptPairCache.has(text)) return promptPairCache.get(text);
      const words = String(text).toLowerCase().match(/[a-z]+/g) || [];
      const content = (word) => word.length >= 4 && promptWords(word).size === 1;
      const pairs = new Set();
      for (let index = 1; index < words.length; index += 1) if (content(words[index - 1]) && content(words[index])) pairs.add(`${words[index - 1]} ${words[index]}`);
      promptPairCache.set(text, pairs);
      return pairs;
    }
    let promptWordCounts = null;
    function promptWordFrequency(word) {
      if (!promptWordCounts) {
        promptWordCounts = new Map();
        getQuestionCatalog().forEach((question) => promptWords(question.prompt).forEach((item) => promptWordCounts.set(item, (promptWordCounts.get(item) || 0) + 1)));
      }
      return promptWordCounts.get(word) || 0;
    }
    // Two prompts count as the same question when they share a two-word phrase, a distinctive rare word,
    // or most of their content words.
    function promptsAreTwins(question, other) {
      if (!question || !other || question.id === other.id) return false;
      const mine = promptWords(question.prompt);
      if (mine.size < 2) return false;
      const myPairs = promptPairs(question.prompt);
      for (const pair of promptPairs(other.prompt)) if (myPairs.has(pair)) return true;
      const theirs = promptWords(other.prompt);
      const sharedWords = [...mine].filter((word) => theirs.has(word));
      const shared = sharedWords.length;
      // A distinctive word ("affection", "jealousy") that only a couple of prompts use marks a twin on its own.
      const rareMatch = sharedWords.some((word) => word.length >= 5 && promptWordFrequency(word) <= 2);
      return rareMatch || (shared >= 2 && shared / Math.min(mine.size, theirs.size) >= 0.6);
    }

    function playedTonightTwin(question, inRound = []) {
      const catalogById = new Map(getQuestionCatalog().map((item) => [item.id, item]));
      const ids = new Set([...state.completedRounds.filter(isTonightRound).flatMap((round) => round.questionIds || []), ...inRound]);
      ids.delete(question.id);
      return [...ids].some((id) => promptsAreTwins(question, catalogById.get(id)));
    }

    function chooseRoundQuestions(
      mode = "slider-heavy",
      count = 5,
      topics = DEFAULT_TOPICS
    ) {
      const selectedTopicSet = new Set(topics);
      const excludedIds = new Set([...state.excludedQuestionIds, ...state.neverQuestionIds]);
      let pool = getQuestionCatalog().filter(
        (question) => selectedTopicSet.has(question.topic) && !excludedIds.has(question.id)
      );
      if (state.questionIntensity === "cozy") {
        // Cozy is safe for a first date: no heavy prompts and nothing that assumes a long shared history.
        const gentle = pool.filter((question) => questionTone(question) !== "deep" && (!questionNeedsHistory(question) || (mode === "sliders-only" && question.type === "slider")));
        if (gentle.length >= count) pool = gentle;
      }
      const activePreset = SESSION_PRESETS.find((preset) => preset.id === state.sessionPreset);
      if (activePreset?.id === "spicy-night" && state.questionIntensity !== "no-filter") {
        const flirty = pool.filter((question) => !(question.topic === "spicy" && questionTone(question) === "deep"));
        if (flirty.length >= count) pool = flirty;
      }
      if (activePreset?.tone === "light") {
        // A playful vibe keeps to playful prompts whenever the pool is big enough.
        const light = pool.filter((question) => questionTone(question) === "light");
        if (light.length >= count) pool = light;
      }
      const focusTopic = activePreset?.focus;
      const sliderTarget = mode === "sliders-only"
        ? count
        : mode === "mixed"
          ? Math.ceil(count * 0.6)
          : Math.ceil(count * 0.8);
      const textTarget = count - sliderTarget;
      // Before repeating questions, borrow unseen ones of the same format (and the same vibe filters) from the
      // other topics this intensity allows, so a quick, playful night stays mostly sliders.
      {
        const seen = coupleAnsweredIds();
        // Custom rounds stay inside the packs the couple checked; vibes may borrow, but never from sensitive packs.
        const SENSITIVE_TOPICS = ["spicy", "dealbreakers", "politics", "money"];
        const allowed = state.sessionPreset === "custom" || state.sessionPreset === "pack"
          ? new Set(selectedTopicSet)
          : new Set([...allowedTopicsForIntensity()].filter((topic) => selectedTopicSet.has(topic) || !SENSITIVE_TOPICS.includes(topic)));
        const fitsVibe = (question) => (state.questionIntensity !== "cozy" || (questionTone(question) !== "deep" && !questionNeedsHistory(question)))
          && (activePreset?.tone !== "light" || questionTone(question) === "light")
          && !(activePreset?.id === "spicy-night" && question.topic === "spicy" && questionTone(question) === "deep");
        const inPool = new Set(pool.map((question) => question.id));
        // If even the borrowed playful ones run out, warm (never deep) questions keep the format before anything repeats.
        const fitsLoosely = (question) => questionTone(question) !== "deep" && (state.questionIntensity !== "cozy" || !questionNeedsHistory(question));
        const fitsSlidersOnly = (question) => mode === "sliders-only" && question.type === "slider" && questionTone(question) !== "deep";
        [["slider", sliderTarget], ["text", textTarget]].forEach(([type, target]) => {
          [fitsVibe, fitsLoosely, fitsSlidersOnly].forEach((fits) => {
            const unseen = pool.filter((question) => question.type === type && !seen.has(question.id)).length;
            if (unseen >= target) return;
            const extra = getQuestionCatalog().filter((question) => question.type === type && !inPool.has(question.id)
              && allowed.has(question.topic) && !excludedIds.has(question.id) && !seen.has(question.id) && fits(question));
            extra.forEach((question) => inPool.add(question.id));
            pool = pool.concat(extra);
          });
        });
      }
      const availableTopics = topics.filter((topic) => pool.some((question) => question.topic === topic));
      const topicSequence = [];
      if (focusTopic && availableTopics.includes(focusTopic)) {
        // A themed night (e.g. Spicy Night) draws at least half of its questions from its own pack.
        for (let index = 0; index < Math.ceil(count / 2); index += 1) topicSequence.push(focusTopic);
      }
      while (topicSequence.length < count && availableTopics.length) {
        topicSequence.push(...shuffled(availableTopics));
      }
      topicSequence.splice(0, topicSequence.length, ...shuffled(topicSequence.slice(0, count)));
      const typeSequence = shuffled([
        ...Array.from({ length: sliderTarget }, () => "slider"),
        ...Array.from({ length: textTarget }, () => "text")
      ]);
      const selected = [];
      const selectedIds = new Set();
