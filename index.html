  <style>
    :root {
      color-scheme: dark;
      --midnight: #0f172a;
      --card: #1e293b;
      --card-light: #273449;
      --text: #f8fafc;
      --muted: #c4cfdd;
      --text-2: #cbd5e1;
      --coral: #fb7185;
      --coral-dark: #e11d48;
      --blue: #60a5fa;
      --green: #4ade80;
      --violet: #a78bfa;
      --sun: #fbbf24;
      --line: rgba(148, 163, 184, 0.2);
      --shadow: 0 28px 80px rgba(2, 6, 23, 0.46);
      --radius-lg: 28px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--midnight);
    }

    body {
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 5%, rgba(251, 113, 133, 0.2), transparent 30rem),
        radial-gradient(circle at 88% 92%, rgba(96, 165, 250, 0.13), transparent 28rem),
        radial-gradient(circle at 82% 15%, rgba(167, 139, 250, 0.1), transparent 22rem),
        var(--midnight);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: 0.22;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    body::after {
      position: fixed;
      top: 14%;
      right: -120px;
      z-index: -1;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(251, 113, 133, 0.09);
      border-radius: 50%;
      content: "";
      pointer-events: none;
      box-shadow:
        0 0 0 44px rgba(96, 165, 250, 0.025),
        0 0 0 90px rgba(167, 139, 250, 0.02);
      animation: ambient-drift 12s ease-in-out infinite alternate;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    .ambient-specks {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-specks span {
      position: absolute;
      width: var(--speck-size);
      height: var(--speck-size);
      border: 1px solid rgba(248, 250, 252, 0.18);
      border-radius: 35%;
      opacity: 0.45;
      transform: rotate(45deg);
      animation: speck-float var(--speck-speed) ease-in-out infinite alternate;
    }

    .ambient-specks span:nth-child(1) { top: 12%; left: 7%; --speck-size: 9px; --speck-speed: 5s; }
    .ambient-specks span:nth-child(2) { top: 31%; right: 8%; --speck-size: 6px; --speck-speed: 7s; }
    .ambient-specks span:nth-child(3) { bottom: 17%; left: 9%; --speck-size: 7px; --speck-speed: 6s; }
    .ambient-specks span:nth-child(4) { bottom: 30%; right: 13%; --speck-size: 11px; --speck-speed: 8s; }
    .ambient-specks span:nth-child(5) { top: 56%; left: 3%; --speck-size: 5px; --speck-speed: 5.5s; }
    .ambient-specks span:nth-child(6) { top: 8%; right: 29%; --speck-size: 6px; --speck-speed: 6.5s; }

    .aurora-canvas {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      filter: saturate(1.15);
    }

    .aurora-blob {
      position: absolute;
      width: min(52vw, 620px);
      aspect-ratio: 1;
      border-radius: 42% 58% 65% 35% / 45% 36% 64% 55%;
      opacity: 0.12;
      filter: blur(70px);
      mix-blend-mode: screen;
      animation: aurora-morph 18s ease-in-out infinite alternate;
    }

    .aurora-blob.one {
      top: -18%;
      left: -16%;
      background: linear-gradient(135deg, var(--coral), var(--violet));
    }

    .aurora-blob.two {
      right: -20%;
      bottom: -24%;
      background: linear-gradient(135deg, var(--blue), var(--green));
      animation-delay: -7s;
      animation-direction: alternate-reverse;
    }

    .aurora-blob.three {
      top: 38%;
      left: 42%;
      width: min(34vw, 400px);
      background: linear-gradient(135deg, var(--violet), var(--blue));
      opacity: 0.07;
      animation-delay: -12s;
    }

    .app-shell {
      width: min(100% - 24px, 1080px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      padding: 6px 10px 6px 6px;
      border: 1px solid rgba(148, 163, 184, 0.13);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.45);
      box-shadow: 0 12px 34px rgba(2, 6, 23, 0.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 160ms ease, border-color 160ms ease;
    }

    @media (hover: hover) { .brand:hover {
      border-color: rgba(251, 113, 133, 0.3);
      box-shadow: 0 0 12px rgba(251, 113, 133, 0.22);
      transform: scale(1.03);
    } }

    .brand:active {
      transform: scale(0.97);
    }

    @media (hover: hover) { .brand:hover .brand-mark {
      color: var(--coral);
      text-shadow: 0 0 10px rgba(251, 113, 133, 0.7);
      animation: heart-beat 1.2s ease-in-out infinite;
    } }

    @media (max-width: 440px) {
      .brand-text { display: none; }
      .brand { padding: 6px 8px; }
      .topbar { gap: 8px; }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .topbar .brand {

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(148, 163, 184, 0.17);

      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.55);

    @media (hover: hover) { .home-btn:hover {

      transform: translateY(-2px);

    .home-btn.active {
      border-color: var(--coral);
      background: color-mix(in srgb, var(--coral) 12%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--coral) 20%, transparent);
    }

    @media (hover: hover) { [data-theme] .home-btn:hover {
      border-color: color-mix(in srgb, var(--coral) 36%, transparent);
      background: color-mix(in srgb, var(--coral) 9%, transparent);
      transform: translateY(-2px);
    } }

    [data-theme] .home-btn.active {
      border-color: var(--coral);
      background: color-mix(in srgb, var(--coral) 12%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--coral) 20%, transparent);
    }

    .home-icon {
      display: grid;
      place-items: center;
      color: var(--coral);
      font-size: 1.05rem;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--coral) 36%, transparent);
      border-radius: 11px;
      color: var(--coral);
      background: color-mix(in srgb, var(--coral) 10%, transparent);
      box-shadow: 0 8px 30px color-mix(in srgb, var(--coral) 12%, transparent);

    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .screen {
      width: 100%;
      margin: auto 0;
      animation: enter 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .screen.no-enter {
      animation: none !important;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--coral);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      overflow-wrap: break-word;
    }

    h1 {
      width: fit-content;
      max-width: min(100%, 680px);
      margin: -0.06em -0.1em -0.1em -0.02em;
      padding: 0.06em 0.1em 0.1em 0.02em;

    .setup-hero {

    .love-orbit {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto;
      isolation: isolate;
      transform: scale(0.82);
      transform-origin: center;
      animation: float-scene 5.5s ease-in-out infinite;
    }

    .orbit-ring {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(251, 113, 133, 0.28);
      border-radius: 50%;
      box-shadow:
        0 0 0 18px rgba(251, 113, 133, 0.025),
        inset 0 0 35px rgba(167, 139, 250, 0.05);
      transform: rotate(-18deg);
    }

    .orbit-ring::before,
    .orbit-ring::after {
      position: absolute;
      border-radius: 50%;
      content: "";
    }

    .orbit-ring::before {
      top: 8px;
      right: 24px;
      width: 10px;
      height: 10px;
      background: var(--sun);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.55);
    }

    .orbit-ring::after {
      bottom: 14px;
      left: 14px;
      width: 7px;
      height: 7px;
      background: var(--violet);
      box-shadow: 0 0 18px rgba(167, 139, 250, 0.55);
    }

    .orbit-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border: 1px solid rgba(251, 113, 133, 0.38);
      border-radius: 26px;
      color: var(--coral);
      background: linear-gradient(145deg, rgba(251, 113, 133, 0.18), rgba(167, 139, 250, 0.08));
      box-shadow: 0 18px 50px rgba(251, 113, 133, 0.2);
      font-size: 2.15rem;
      transform: translate(-50%, -50%) rotate(8deg);
      animation: heart-beat 2.4s ease-in-out infinite;
    }

    .orbit-person {
      position: absolute;
      z-index: 2;
      display: grid;
      width: 45px;
      height: 45px;
      place-items: center;
      border: 4px solid #e2e8f0;
      border-radius: 50%;
      color: #0f172a;
      font-size: 0.77rem;
      font-weight: 950;
      box-shadow: 0 10px 25px rgba(2, 6, 23, 0.38);
    }

    .orbit-person::after {
      position: absolute;
      bottom: 8px;
      width: 14px;
      height: 6px;
      border-bottom: 2px solid rgba(15, 23, 42, 0.62);
      border-radius: 50%;
      content: "";
    }

    .orbit-person.one {
      top: 19px;
      left: 17px;
      background: var(--blue);
      animation: person-one 6s ease-in-out infinite;
    }

    .orbit-person.two {
      right: 16px;
      bottom: 20px;
      background: var(--green);
      animation: person-two 6s ease-in-out infinite;
    }

    .setup-card,
    .question-card,
    .lock-card {
      width: 100%;
      max-width: 100%;
      margin: 5px auto 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(30, 41, 59, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .setup-card {
      padding: 6px 8px;
      background:
        linear-gradient(145deg, rgba(39, 52, 73, 0.94), rgba(30, 41, 59, 0.9));
    }

    .setup-section-title {
      margin: 6px 0 3px;
      color: #e2e8f0;
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .session-dropdown-container {
      position: relative;
      width: 100%;
      margin-top: 4px;
    }

    .session-dropdown-trigger {
      display: flex;
      width: 100%;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(30, 41, 59, 0.6);
      color: var(--text);
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 150ms ease, background 150ms ease;
    }

    @media (hover: hover) { .session-dropdown-trigger:hover {
      border-color: color-mix(in srgb, var(--coral) 40%, transparent);
      background: rgba(30, 41, 59, 0.8);
    } }

    .session-trigger-arrow {
      font-size: 0.8rem;
      color: var(--muted);
      transition: transform 150ms ease;
    }

    .session-dropdown-container.open .session-trigger-arrow {
      transform: rotate(180deg);
    }

    .session-dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 150;
      max-height: 240px;
      margin-top: 4px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);

      -webkit-backdrop-filter: blur(20px);
      padding: 4px 0;
    }

    .session-dropdown-container.open .session-dropdown-menu {
      display: block;
    }

    .session-dropdown-item {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 120ms ease;
    }

    @media (hover: hover) { .session-dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
    } }

    .session-dropdown-item.selected {
      background: color-mix(in srgb, var(--coral) 15%, transparent);
      border-left: 2px solid var(--coral);
    }

    .session-item-header {
      font-size: 0.84rem;
      color: var(--text);
    }

    .session-item-copy {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .session-preset-info {
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: var(--radius-md);
      background: rgba(148, 163, 184, 0.06);
      font-size: 0.76rem;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .preset-info-copy {
      color: var(--muted);

      margin: 0;

    .preset-config-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .preset-config-summary span {
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .mode-picker {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .mode-option {
      position: relative;
      display: block;
      min-height: 84px;
      cursor: pointer;
    }

      height: 1px;

      border-color: var(--coral);
      background: linear-gradient(145deg, color-mix(in srgb, var(--coral) 15%, transparent), color-mix(in srgb, var(--violet) 8%, transparent));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 8%, transparent);
    }

    .topic-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .mini-action {
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 9px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
      font-size: 0.66rem;
      font-weight: 760;
    }

    @media (hover: hover) { .mini-action:hover {
      color: var(--text);
      border-color: rgba(251, 113, 133, 0.35);
    } }

    .topic-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    .topic-option {
      position: relative;
      cursor: pointer;
    }

    .topic-chip {
      display: inline-flex;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(148, 163, 184, 0.17);
      border-radius: 11px;
      align-items: center;
      gap: 7px;
      color: var(--text-2);
      background: rgba(15, 23, 42, 0.47);
      font-size: 0.72rem;
      font-weight: 790;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .topic-icon {
      display: grid;
      width: 19px;
      height: 19px;
      place-items: center;
      border-radius: 6px;
      color: var(--topic-color);
      background: color-mix(in srgb, var(--topic-color) 12%, transparent);
      font-size: 0.7rem;
      font-weight: 900;
    }

    @media (hover: hover) { .topic-option:hover .topic-chip {
      border-color: color-mix(in srgb, var(--topic-color) 48%, transparent);
      transform: translateY(-2px);
    } }

    .topic-option input:checked + .topic-chip {
      border-color: color-mix(in srgb, var(--topic-color) 70%, transparent);
      color: var(--text);
      background: color-mix(in srgb, var(--topic-color) 13%, rgba(15, 23, 42, 0.7));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--topic-color) 7%, transparent);
    }

    .topic-option input:focus-visible + .topic-chip,
    .count-option input:focus-visible + .count-card {
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--coral) 20%, transparent);
    }

    .topic-note {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.45;
    }

    .sound-setting {
      position: relative;
      display: flex;
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 15px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.38);
      cursor: pointer;
    }

    .sound-copy {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .sound-copy small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 620;
    }

    .toggle-track {
      position: relative;
      flex: 0 0 auto;
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: #475569;
      transition: background 170ms ease;
    }

    .toggle-track::after {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      content: "";
      background: var(--text);
      box-shadow: 0 3px 8px rgba(2, 6, 23, 0.35);
      transition: transform 170ms ease;
    }

    .sound-setting input:checked ~ .toggle-track {
      background: var(--coral);
    }

    .sound-setting input:checked ~ .toggle-track::after {
      transform: translateX(20px);
    }

    .sound-setting input:focus-visible ~ .toggle-track {
      box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.18);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 760;
    }

    .name-input,
    .answer-textarea {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.25);
      outline: none;
      color: var(--text);
      background: rgba(15, 23, 42, 0.72);
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .name-input {
      height: 44px;
      margin-top: 6px;
      padding: 0 14px;
      border-radius: 12px;
    }

    .answer-textarea {
      min-height: 120px;
      margin-top: 10px;
      padding: 12px 14px;
      resize: vertical;
      border-radius: 14px;
      line-height: 1.5;
    }

    .name-input:focus,
    .answer-textarea:focus {
      border-color: var(--coral);
      background: rgba(15, 23, 42, 0.94);
      box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.12);
    }

    .name-input::placeholder,
    .answer-textarea::placeholder {
      color: #64748b;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    .primary-btn,
    .secondary-btn,
    .text-btn {
      border: 0;
      cursor: pointer;
      font-weight: 820;
    }

    .primary-btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      color: #2b0a12;
      background: var(--coral);
      box-shadow: 0 12px 30px rgba(251, 113, 133, 0.22);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    @media (hover: hover) { .primary-btn:hover {
      background: #fda4af;
      box-shadow: 0 14px 36px rgba(251, 113, 133, 0.3);
      transform: translateY(-2px);
    } }

    .primary-btn:active {
      transform: translateY(0);
    }

    .secondary-btn {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 11px;
      color: var(--text);
      background: rgba(148, 163, 184, 0.08);
    }

    @media (hover: hover) { .secondary-btn:hover {
      background: rgba(148, 163, 184, 0.14);
    } }

    .text-btn {
      min-height: 36px;
      padding: 0 10px;
      color: var(--muted);
      background: transparent;
    }

    @media (hover: hover) { .text-btn:hover {
      color: var(--text);
    } }

    .error {
      min-height: 20px;
      margin: 14px 0 -4px;
      color: #fda4af;
      font-size: 0.86rem;
      font-weight: 650;
    }

    .privacy-note {
      display: flex;
      gap: 9px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .question-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .turn-name {
      margin: 0;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 850;
      letter-spacing: -0.03em;
    }

    .progress-copy {
      flex: 0 0 auto;
      color: var(--text-2);
      font-size: 0.88rem;
      font-weight: 780;
      text-align: right;
    }

    .round-mode-copy {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 720;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 6px;
      margin-bottom: 22px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--coral-dark), var(--coral));
      transition: width 300ms ease;
    }

    .progress-constellation {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
      margin: -5px 2px 13px;
    }

    .progress-constellation::before {
      position: absolute;
      top: 50%;
      right: 10px;
      left: 10px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, rgba(251, 113, 133, 0.55), rgba(96, 165, 250, 0.22));
    }

    .progress-star {
      position: relative;
      z-index: 1;
      display: grid;
      width: 19px;
      height: 19px;
      place-items: center;
      border: 3px solid var(--midnight);
      border-radius: 50%;
      color: transparent;
      background: #475569;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.22);
      font-size: 0.55rem;
      transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease;

    .progress-star.done {
      color: #2b0a12;
      background: var(--coral);
    }

    .progress-star.active {
      color: var(--text);
      background: var(--violet);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--violet) 12%, transparent), 0 0 18px color-mix(in srgb, var(--violet) 35%, transparent);
      transform: scale(1.18);
      animation: active-star 1.8s ease-in-out infinite;
    }

    .question-card {
      position: relative;
      margin-top: 0;
      padding: 6px 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 100% 0, rgba(251, 113, 133, 0.12), transparent 16rem),
        linear-gradient(145deg, rgba(39, 52, 73, 0.96), rgba(30, 41, 59, 0.92));
    }

    .question-card::after {
      position: absolute;
      top: -62px;
      right: -50px;
      width: 150px;
      height: 150px;
      border: 26px solid rgba(251, 113, 133, 0.045);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .category-pill {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid rgba(251, 113, 133, 0.26);
      border-radius: 999px;
      color: #fecdd3;
      background: rgba(251, 113, 133, 0.09);
      font-size: 0.72rem;
      font-weight: 820;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .question-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .type-chip {
      display: inline-flex;
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid rgba(96, 165, 250, 0.22);
      border-radius: 999px;

      background: rgba(96, 165, 250, 0.08);

      font-weight: 800;
      letter-spacing: 0.04em;

    .question-decor span:nth-child(1) {

      border: 1px dashed rgba(251, 113, 133, 0.32);
      animation: decor-spin 14s linear infinite;
    }

    .question-decor span:nth-child(2) {
      top: 0;
      right: 13px;
      width: 10px;
      height: 10px;
      background: var(--coral);
      box-shadow: 0 0 16px rgba(251, 113, 133, 0.42);
    }

    .question-decor span:nth-child(3) {
      bottom: 9px;
      left: 7px;
      width: 8px;
      height: 8px;
      background: var(--blue);
      box-shadow: 0 0 16px rgba(96, 165, 250, 0.42);
    }

    .category-symbol {
      display: inline-grid;
      width: 18px;
      height: 18px;
      place-items: center;
      border-radius: 6px;
      color: var(--text);
      background: rgba(251, 113, 133, 0.2);
      font-size: 0.72rem;
    }

    .prompt {
      position: relative;
      z-index: 1;
      margin-top: 19px;
    }

    .answer-label {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 820;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .slider-panel {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      padding: 18px 14px 14px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.48);
    }

    .slider-value {
      width: max-content;
      min-width: 54px;
      margin: 0 auto 18px;
      padding: 7px 13px;
      border-radius: 12px;
      color: #2b0a12;
      background: var(--coral);
      font-size: 1.18rem;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 8px 24px rgba(251, 113, 133, 0.18);
    }

    .range-input {
      width: 100%;
      height: 28px;
      margin: 0;
      appearance: none;
      cursor: pointer;
      background: transparent;
    }

    .range-input::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--coral) 0,
        var(--coral) var(--range-progress),
        #475569 var(--range-progress),
        #475569 100%
      );
    }

    .range-input::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: #475569;
    }

    .range-input::-moz-range-progress {
      height: 8px;
      border-radius: 999px;
      background: var(--coral);
    }

    .range-input::-webkit-slider-thumb {
      width: 25px;
      height: 25px;
      margin-top: -8.5px;
      appearance: none;
      border: 4px solid var(--text);
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 4px 15px rgba(2, 6, 23, 0.5);
    }

    .range-input::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 4px solid var(--text);
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 4px 15px rgba(2, 6, 23, 0.5);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.3;
    }

    .range-labels span:last-child {
      text-align: right;
    }

    .comment-details {
      position: relative;
      z-index: 1;
      margin-top: 15px;
      border: 1px solid rgba(148, 163, 184, 0.13);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.3);
    }

    .comment-details summary {
      padding: 13px 15px;
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 780;
      list-style: none;
    }

    .comment-details summary::-webkit-details-marker {
      display: none;
    }

    .comment-details summary::before {
      display: inline-grid;
      width: 20px;
      height: 20px;
      margin-right: 8px;
      border-radius: 7px;
      place-items: center;
      content: "+";
      color: var(--coral);
      background: rgba(251, 113, 133, 0.1);
    }

    .comment-details[open] summary::before {
      content: "−";
    }

    .comment-textarea {
      display: block;
      width: calc(100% - 24px);
      min-height: 86px;
      margin: 0 12px 12px;
      padding: 13px 14px;
      resize: vertical;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 11px;
      outline: none;
      color: var(--text);
      background: rgba(15, 23, 42, 0.72);
      line-height: 1.45;
    }

    .comment-textarea:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.1);

    .slider-comments {

      margin-top: 14px;

    .slider-comment {
      padding: 11px 13px;

      background: rgba(15, 23, 42, 0.45);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .slider-comment strong {
      color: var(--player-color);
      font-size: max(12px, 0.68rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .question-actions {
      justify-content: flex-end;
    }

    .lock-screen {
      text-align: center;
    }

    .lock-card {
      position: relative;
      overflow: hidden;
      padding: 12px 10px;
    }

    .lock-card::after {
      position: absolute;
      right: -80px;
      bottom: -90px;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      content: "";
      pointer-events: none;
      background: rgba(251, 113, 133, 0.08);
      filter: blur(2px);
    }

    .lock-icon {
      position: relative;
      z-index: 1;
      display: grid;
      width: 78px;
      height: 78px;
      margin: 0 auto 26px;
      place-items: center;
      border: 1px solid rgba(251, 113, 133, 0.35);
      border-radius: 25px;
      color: var(--coral);
      background: rgba(251, 113, 133, 0.1);
      font-size: 1.8rem;
      box-shadow: 0 16px 40px rgba(251, 113, 133, 0.13);
      animation: lock-bob 3s ease-in-out infinite;
    }

    .lock-icon::before,
    .lock-icon::after {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      content: "";
    }

    .lock-icon::before {
      top: -11px;
      left: -14px;
      background: var(--blue);
      box-shadow: 0 0 18px rgba(96, 165, 250, 0.5);
    }

    .lock-icon::after {
      right: -13px;
      bottom: -9px;
      background: var(--green);
      box-shadow: 0 0 18px rgba(74, 222, 128, 0.45);
    }

    .lock-copy {
      max-width: 470px;
      margin: 15px auto 0;
      color: var(--text-2);
      line-height: 1.65;
    }

    .pass-visual {
      display: flex;
      width: min(100%, 330px);
      margin: 25px auto 4px;
      align-items: center;
      justify-content: center;
    }

    .pass-person {
      position: relative;
      z-index: 2;
      display: grid;
      width: 56px;
      height: 56px;
      place-items: center;
      border: 4px solid #e2e8f0;
      border-radius: 50%;
      color: #0f172a;
      font-size: 0.78rem;
      font-weight: 950;
      box-shadow: 0 12px 28px rgba(2, 6, 23, 0.35);
    }

    .pass-person.one {
      background: var(--blue);
    }

    .pass-person.two {
      background: var(--green);
      animation: receiver-glow 2s ease-in-out infinite;
    }

    .pass-path {
      position: relative;
      width: 115px;
      height: 2px;
      margin: 0 9px;
      overflow: visible;
      background: repeating-linear-gradient(90deg, rgba(251, 113, 133, 0.6) 0 6px, transparent 6px 12px);
    }

    .pass-path::after {
      position: absolute;
      top: 50%;
      left: 0;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(251, 113, 133, 0.32);
      border-radius: 10px;
      content: "→";
      color: var(--coral);
      background: var(--card);
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.3);
      transform: translateY(-50%);
      animation: pass-device 2.4s ease-in-out infinite;
    }

    .lock-actions {
      position: relative;
      z-index: 1;
      justify-content: center;
      margin-top: 28px;
    }

    .reveal-screen {

    .reveal-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 27px;
    }

      margin-top: 10px;
      font-size: 0.96rem;
    }

    .alignment-dashboard {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      margin-bottom: 24px;
      padding: clamp(20px, 4vw, 30px);

      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 24px;
      background:
        radial-gradient(circle at 8% 20%, color-mix(in srgb, var(--overall-color) 15%, transparent), transparent 18rem),
        linear-gradient(145deg, rgba(39, 52, 73, 0.94), rgba(30, 41, 59, 0.88));
      box-shadow: 0 22px 55px rgba(2, 6, 23, 0.28);
    }

    .alignment-dashboard::after {
      position: absolute;
      right: -45px;
      bottom: -60px;
      width: 180px;
      height: 180px;
      border: 25px solid rgba(248, 250, 252, 0.025);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .home-results {
      position: relative;
      display: grid;
      grid-template-columns: minmax(245px, 0.8fr) minmax(0, 1.35fr);

        radial-gradient(circle at 5% 15%, color-mix(in srgb, var(--home-result-color) 17%, transparent), transparent 16rem),
        linear-gradient(145deg, rgba(39, 52, 73, 0.96), rgba(24, 34, 52, 0.94));
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.28);
    }

    .home-results::after {
      position: absolute;
      right: -38px;
      top: -45px;
      width: 145px;
      height: 145px;
      border: 22px solid rgba(248, 250, 252, 0.025);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .home-results-main {
      position: relative;
      z-index: 1;

    .flip-card {
      position: relative;
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      min-height: 170px;
      padding: 0;
      border: 0;
      outline: none;
      color: inherit;
      background: transparent;
      perspective: 1400px;
      text-align: left;
      transition: height 320ms cubic-bezier(0.22, 1, 0.36, 1), transform 180ms ease;
    }

    @media (hover: hover) { .flip-card:hover {
      transform: translateY(-2px);
    } }

    .card-front:focus-visible,
    .card-close-button:focus-visible {
      outline: none;

    .flip-card-inner {

      width: 100%;
      height: 100%;

      transition: transform 620ms cubic-bezier(0.2, 0.72, 0.2, 1);

    .card-face {
      position: absolute;

      right: 0;
      left: 0;

        radial-gradient(circle at 92% 12%, rgba(251, 113, 133, 0.12), transparent 10rem),

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

    .card-face::before {
      position: absolute;
      inset: 0;
      z-index: 2;
      content: "";
      pointer-events: none;
      opacity: var(--holo-opacity, 0);
      background: linear-gradient(
        115deg,
        transparent 15%,
        rgba(255, 255, 255, 0.25) 25%,
        rgba(96, 165, 250, 0.35) 35%,
        rgba(251, 113, 133, 0.35) 45%,
        rgba(167, 139, 250, 0.35) 55%,
        rgba(251, 191, 36, 0.35) 65%,
        rgba(255, 255, 255, 0.25) 75%,

    }

    .topic-progress-grid {

      margin-bottom: 18px;
    }

    .topic-progress-card {

      transform: translateY(-2px);
    } }

    
    [data-theme] .topic-progress-card.active {
      border-color: color-mix(in srgb, var(--topic-color) 48%, transparent);
      background-image: linear-gradient(color-mix(in srgb, var(--topic-color) 8%, transparent), color-mix(in srgb, var(--topic-color) 8%, transparent));
    }
    @media (hover: hover) { [data-theme] .topic-progress-card:hover {
      border-color: color-mix(in srgb, var(--topic-color) 48%, transparent);
      background-image: linear-gradient(color-mix(in srgb, var(--topic-color) 8%, transparent), color-mix(in srgb, var(--topic-color) 8%, transparent));
    } }

    .topic-progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--text-2);
      font-size: 0.7rem;

    }

    .topic-progress-track {

      height: 5px;
      margin-top: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
    }

    .topic-progress-fill {
      display: block;
      height: 100%;
      width: var(--topic-progress);
      border-radius: inherit;
      background: var(--topic-color);

    .library-add {
      margin-bottom: 18px;
      border: 1px solid rgba(251, 113, 133, 0.2);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(39, 52, 73, 0.82), rgba(30, 41, 59, 0.72));
    }

    .library-add > summary {
      display: flex;
      min-height: 58px;
      padding: 0 18px;
      align-items: center;
      gap: 10px;

      font-weight: 850;

      height: 28px;

      border-radius: 9px;
      content: "+";

      background: rgba(251, 113, 133, 0.1);
      font-size: 1.05rem;
    }

    .library-add[open] > summary::before { content: "−"; }

    .custom-form {
      padding: 0 18px 18px;
    }

    .custom-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .custom-label {
      color: var(--text-2);
      font-size: 0.72rem;
      font-weight: 780;
    }

    .custom-select,
    .custom-input,
    .library-search {
      width: 100%;
      min-height: 38px;
      margin-top: 5px;
      padding: 0 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);

      color: var(--text);
      background: rgba(15, 23, 42, 0.72);

    .custom-input:focus,
    .library-search:focus {

    }

    .custom-prompt {
      min-height: 95px;
      margin-top: 7px;
    }

    .custom-full {
      grid-column: 1 / -1;
    }

    .library-controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 12px;
      margin-bottom: 12px;
    }

    .library-search {
      margin-top: 0;
    }

    .library-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .library-filter {
      min-height: 45px;
      padding: 0 12px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      color: var(--muted);

      font-weight: 780;
    }

    .library-filter.active {

      color: var(--text);
      background: color-mix(in srgb, var(--violet) 12%, transparent);
    }

    [data-theme] .library-filter.active {
      border-color: var(--violet);
      color: var(--text);
      background: color-mix(in srgb, var(--violet) 12%, transparent);
    }

    .question-library-list {
      display: grid;
      max-height: 68vh;
      gap: 9px;
      padding: 3px 5px 3px 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: rgba(167, 139, 250, 0.45) rgba(15, 23, 42, 0.3);
    }

    .library-question {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 15px;
      border: 1px solid rgba(148, 163, 184, 0.13);
      border-radius: 15px;
      align-items: start;
      background: rgba(30, 41, 59, 0.72);
      transition: border-color 160ms ease, background 160ms ease;
    }

    .library-question.answered {
      border-color: rgba(74, 222, 128, 0.22);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.055), rgba(30, 41, 59, 0.72));
    }

    .library-question.excluded {
      opacity: 0.62;
      border-style: dashed;
    }

    .question-status {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      color: #64748b;
      background: rgba(15, 23, 42, 0.5);
      font-weight: 900;
    }

    .answered .question-status {
      border-color: rgba(74, 222, 128, 0.35);
      color: #052e16;
      background: var(--green);
    }

    .library-question-copy strong {
      display: block;
      color: #e2e8f0;
      font-size: 0.82rem;
      line-height: 1.45;

    .library-question-meta {

      gap: 6px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.65rem;

      padding: 3px 7px;
      border-radius: 7px;
      background: rgba(148, 163, 184, 0.08);
    }

    .library-answer-history {
      margin-top: 10px;
      border: 1px solid rgba(96, 165, 250, 0.14);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.38);
    }

    .library-answer-history summary {
      padding: 9px 11px;
      color: #bfdbfe;
      cursor: pointer;
      font-size: 0.68rem;
      font-weight: 790;
      list-style-position: inside;
    }

    .saved-round-list {
      display: grid;
      max-height: 330px;
      gap: 8px;
      padding: 0 9px 9px;
      overflow-y: auto;
    }

    .saved-round {
      padding: 10px;
      border: 1px solid rgba(148, 163, 184, 0.11);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.64);
    }

    .saved-round-date {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.59rem;
      font-weight: 720;
    }

    .saved-answer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .saved-answer {
      min-width: 0;
      padding: 8px 9px;
      border-left: 3px solid var(--saved-player-color);
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.5);
    }

    .saved-answer-name {
      display: block;
      overflow: hidden;
      color: var(--saved-player-color);
      font-size: 0.59rem;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .saved-answer-value,
    .saved-answer-comment {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
      color: #e2e8f0;
      font-size: 0.67rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .saved-answer-comment {
      color: var(--muted);
      font-size: 0.61rem;
      font-style: italic;
    }

    .question-library-actions {
      display: flex;
      gap: 6px;
    }

    .question-library-action {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.46);
      cursor: pointer;
      font-size: 0.66rem;
      font-weight: 760;
    }

    @media (hover: hover) { .question-library-action:hover {
      border-color: rgba(251, 113, 133, 0.36);
      color: var(--text);
    } }

    .library-empty {
      padding: 36px 20px;
      border: 1px dashed rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      padding: 20px;
      place-items: center;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: modal-fade 180ms ease both;
    }

    .exit-dialog {
      position: relative;
      width: min(100%, 430px);
      padding: 30px;
      overflow: hidden;
      border: 1px solid rgba(251, 113, 133, 0.25);
      border-radius: 26px;
      background:
        radial-gradient(circle at 100% 0, rgba(251, 113, 133, 0.16), transparent 13rem),
        linear-gradient(145deg, #273449, #1e293b);
      box-shadow: 0 32px 90px rgba(2, 6, 23, 0.58);
      animation: modal-rise 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .dialog-graphic {
      position: relative;
      display: grid;
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      place-items: center;
      border: 1px solid rgba(251, 113, 133, 0.3);
      border-radius: 21px;
      color: var(--coral);
      background: rgba(251, 113, 133, 0.1);

    .dialog-copy {
      margin: 11px 0 0;
      color: var(--text-2);

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* Premium responsive polish layer */
    :root {
      --midnight-deep: #08111f;
      --glass: rgba(30, 41, 59, 0.76);
      --glass-strong: rgba(30, 41, 59, 0.94);
      --hairline: rgba(226, 232, 240, 0.12);
      --soft-glow: 0 24px 70px rgba(2, 6, 23, 0.38);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html {
      scroll-behavior: smooth;
      scrollbar-color: rgba(251, 113, 133, 0.5) rgba(15, 23, 42, 0.4);
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background:
        radial-gradient(ellipse at 12% -5%, rgba(251, 113, 133, 0.26), transparent 34rem),
        radial-gradient(ellipse at 105% 25%, rgba(167, 139, 250, 0.18), transparent 36rem),
        radial-gradient(ellipse at 45% 110%, rgba(96, 165, 250, 0.15), transparent 34rem),
        linear-gradient(155deg, var(--midnight-deep), var(--midnight) 45%, #111c31);
      background-attachment: fixed;
    }

    button,
    input,
    textarea,
    select,
    summary,
    label {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    summary,
    label,
    input[type="range"] {
      touch-action: manipulation;
    }

    button,
    .count-option,
    .mode-option,
    .topic-option,
    .intensity-option,
    .theme-option,
    .vibe-tile,
    .flip-card .card-front,
    summary {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button:focus-visible,
    summary:focus-visible,
    select:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(251, 113, 133, 0.42);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(calc(100% - clamp(24px, 5vw, 64px)), 1080px);
      padding-top: max(20px, env(safe-area-inset-top));
      padding-right: env(safe-area-inset-right);
      padding-bottom: max(30px, env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
    }

    .topbar {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 90;
      margin: -8px -8px 30px;
      padding: 8px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(8, 17, 31, 0.9), rgba(8, 17, 31, 0.58));
      backdrop-filter: blur(18px) saturate(1.35);
      -webkit-backdrop-filter: blur(18px) saturate(1.35);

    .topbar:has(.home-btn[hidden]) {

      top: auto;

      backdrop-filter: none;
      -webkit-backdrop-filter: none;

    .topbar:has(.home-btn[hidden]) .brand > span:last-child {
      display: inline;
    }

    .brand,
    .home-btn {
      border-color: rgba(226, 232, 240, 0.13);
      background: linear-gradient(145deg, rgba(39, 52, 73, 0.82), rgba(15, 23, 42, 0.76));
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .brand-mark {
      background: linear-gradient(145deg, rgba(251, 113, 133, 0.24), rgba(167, 139, 250, 0.12));
      box-shadow: 0 8px 28px rgba(251, 113, 133, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .screen,
    .setup-hero > *,
    .library-header > *,
    .reveal-heading > * {
      min-width: 0;
    }

    h1 {

    }

    h2,
    .prompt,
    .card-question {
      text-wrap: pretty;
    }

    .accent-text {

      background: linear-gradient(110deg, #fda4af 4%, var(--coral) 42%, #c4b5fd 95%);

    .love-orbit::before,

      border-radius: 50%;
      content: "";

    }

    .love-orbit::before {

    }

      right: 12%;

        radial-gradient(circle at 92% 4%, rgba(167, 139, 250, 0.13), transparent 17rem),

    .comment-textarea,

    .custom-select,

      border-color: rgba(226, 232, 240, 0.16);

      border-color: rgba(251, 113, 133, 0.34);

    .count-card,
    .mode-card,
    .topic-chip,
    .sound-setting,
    .library-launcher,

      background: linear-gradient(135deg, #fda4af, var(--coral) 58%, #f472b6);

    }

    /* Reading comfort settings controls */
    .text-size-toggle {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(15, 23, 42, 0.38);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    
    [data-theme="sunset"] .text-size-toggle {
      background: rgba(67, 21, 38, 0.48);
      border-color: rgba(255, 226, 191, 0.19);
      border-radius: 18px 6px 18px 6px;
    }
    [data-theme="cosmic"] .text-size-toggle {
      background: rgba(8, 4, 31, 0.72);
      border-color: rgba(167, 119, 250, 0.24);
      border-radius: 5px;
    }
    [data-theme="pastel"] .text-size-toggle {
      background: rgba(247, 248, 255, 0.9);
      border-color: rgba(79, 91, 120, 0.13);
      border-radius: 18px;
    }

    .text-size-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 4px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    
    [data-theme="sunset"] .text-size-option {
      border-radius: 14px 5px 14px 5px;
    }
    [data-theme="cosmic"] .text-size-option {
      border-radius: 3px;
    }
    [data-theme="pastel"] .text-size-option {
      border-radius: 14px;
    }

    .text-size-option span:first-child {
      font-weight: 800;
    }
    .text-size-option span:last-child {
      font-size: 0.58rem;
      font-weight: 500;
    }

    @media (hover: hover) { .text-size-option:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    } }
    @media (hover: hover) { [data-theme="pastel"] .text-size-option:hover {
      background: rgba(15, 23, 42, 0.04);
    } }

    .text-size-option.active {
      border-color: var(--coral);
      background: color-mix(in srgb, var(--coral) 12%, transparent);
      color: var(--text);
    }
    [data-theme="pastel"] .text-size-option.active {
      background: color-mix(in srgb, var(--coral) 12%, white);
      box-shadow: 0 4px 12px rgba(85, 74, 112, 0.05);
    }

    .text-size-preview {
      margin: 4px 0 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--line);
      font-size: 1em;
      line-height: 1.5;
      color: var(--muted);
    }
    [data-theme="sunset"] .text-size-preview {
      background: rgba(42, 13, 29, 0.58);
      border-color: rgba(255, 226, 191, 0.24);
      border-radius: 14px 5px 14px 5px;
    }
    [data-theme="cosmic"] .text-size-preview {
      background: rgba(4, 1, 15, 0.82);
      border-color: rgba(86, 231, 255, 0.25);
      border-radius: 3px;
    }
    [data-theme="pastel"] .text-size-preview {
      background: #ffffff;
      border-color: rgba(79, 91, 120, 0.19);
      border-radius: 14px;
    }

    .topic-option:has(input:disabled) {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .question-actions {
      flex-wrap: wrap;
    }

    .question-actions .primary-btn {
      margin-left: auto;
    }

    .question-card .category-pill {
      border-color: color-mix(in srgb, var(--question-color) 42%, transparent);
      color: color-mix(in srgb, var(--question-color) 72%, white);
      background: color-mix(in srgb, var(--question-color) 11%, transparent);
    }

    .question-card .category-symbol {
      background: color-mix(in srgb, var(--question-color) 22%, transparent);
    }

    .alignment-ring {
      animation: ring-arrive 720ms var(--ease-out) both;
    }

    @keyframes ring-arrive {
      from { opacity: 0; transform: scale(.72) rotate(-16deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    .settings-screen,
    .results-screen {
      margin: 0;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .settings-card,
    .journal-card,
    .trend-card,
    .pack-manager {
      padding: 14px;
      border: 1px solid rgba(226, 232, 240, 0.13);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(39, 52, 73, 0.88), rgba(24, 35, 53, 0.84));
      box-shadow: 0 18px 45px rgba(2, 6, 23, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.04);

    .settings-card.full,

    .settings-card h3,
    .journal-card h3,
    .trend-card h3 {

    }

    .settings-card > p,
    .journal-card > p,
    .trend-card > p {

      line-height: 1.5;
    }

    .setting-row {
      display: flex;
      min-height: 44px;
      padding: 6px 0;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .setting-row:first-of-type { border-top: 0; }

    .setting-row label,
    .setting-row span {
      color: #e2e8f0;
      font-size: 0.76rem;
      font-weight: 760;
    }

    .setting-row select,
    .setting-row input[type="range"] {

    }

    .journal-overview {

      gap: 16px;

    .trend-list,
    .round-history-list,
    .change-list {

      gap: 10px;

    .trend-row {

      grid-template-columns: minmax(90px, 1fr) minmax(110px, 2fr) auto;

    }

    .trend-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #334155;
    }

    .trend-fill {

      border-radius: inherit;
      background: var(--trend-color);
    }

    .round-history-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 13px;

      background: rgba(15, 23, 42, 0.4);

    .round-score {

      height: 52px;
      border: 4px solid var(--round-color);
      border-radius: 50%;
      place-items: center;
      color: var(--round-color);
      font-size: 0.77rem;
      font-weight: 900;
    }

    .round-copy strong,
    .round-copy span {

    }

    .round-copy span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.66rem;
    }

    .celebration-screen {
      text-align: center;
    }

    .celebration-card {
      position: relative;
      padding: clamp(34px, 8vw, 72px) 24px;
      overflow: hidden;
      border: 1px solid rgba(251, 191, 36, 0.26);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 25%, rgba(251, 191, 36, 0.16), transparent 15rem),
        radial-gradient(circle at 8% 90%, rgba(251, 113, 133, 0.13), transparent 16rem),
        linear-gradient(145deg, rgba(39, 52, 73, 0.96), rgba(24, 35, 53, 0.94));
      box-shadow: var(--shadow);
    }

    .celebration-orb {
      display: grid;
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 36px;
      place-items: center;
      color: var(--sun);
      background: linear-gradient(145deg, rgba(251, 191, 36, 0.18), rgba(251, 113, 133, 0.1));
      box-shadow: 0 20px 55px rgba(251, 191, 36, 0.16);
      font-size: 2.8rem;
      animation: heart-beat 2.2s ease-in-out infinite;
    }

    .discussion-card,
    .alignment-rating,
    .private-reflection {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.13);
      border-radius: 15px;
      background: rgba(15, 23, 42, 0.44);
    }

    .discussion-card {
      border-color: rgba(167, 139, 250, 0.22);
      background: linear-gradient(145deg, rgba(167, 139, 250, 0.1), rgba(15, 23, 42, 0.44));
    }

    .discussion-card strong,
    .alignment-rating strong {
      display: block;
      color: #e2e8f0;
      font-size: 0.72rem;
    }

    .discussion-card p {
      margin: 7px 0 0;
      color: #ddd6fe;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .rating-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 10px;
    }

    .rating-option {
      min-height: 44px;
      padding: 5px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.52);
      cursor: pointer;
      font-size: 0.61rem;
      font-weight: 760;
    }

    .rating-option.active {
      border-color: var(--rating-color);
      color: var(--text);
      background-image: linear-gradient(color-mix(in srgb, var(--rating-color) 15%, transparent), color-mix(in srgb, var(--rating-color) 15%, transparent));
    }

    .private-note-input {
      width: 100%;
      min-height: 76px;
      margin-top: 9px;
      padding: 11px;
      resize: vertical;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 11px;
      outline: none;
      color: var(--text);
      background: rgba(8, 17, 31, 0.58);
    }

    .favorite-button {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.48);
      cursor: pointer;
    }

    .favorite-button.active {
      color: var(--sun);
      background: color-mix(in srgb, var(--sun) 11%, transparent);
    }

    [data-theme] .favorite-button.active {
      color: var(--sun);
      background: color-mix(in srgb, var(--sun) 11%, transparent);
    }

    .tutorial-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .tutorial-step {
      padding: 13px;
      border: 1px solid rgba(148, 163, 184, 0.13);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.42);
      text-align: center;
    }

    .tutorial-step span {
      display: grid;
      width: 38px;
      height: 38px;
      margin: 0 auto 8px;
      border-radius: 12px;
      place-items: center;
      color: var(--coral);
      background: rgba(251, 113, 133, 0.1);
    }

    .tutorial-step strong,
    .tutorial-step small { display: block; }
    .tutorial-step small { margin-top: 5px; color: var(--muted); line-height: 1.35; }

    @media (max-width: 900px) {
      .bottom-nav { display: none !important; }
      .app-shell { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    }

    @media (max-width: 600px) {
      .settings-grid,
      .journal-overview { grid-template-columns: 1fr; }
      .settings-card.full,
      .pack-manager { grid-column: auto; }
      .resume-card { grid-template-columns: auto minmax(0, 1fr); }
      .resume-card .primary-btn { grid-column: 1 / -1; width: 100%; }
      .rating-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .round-history-item { grid-template-columns: auto minmax(0, 1fr); }
      .round-history-item .round-actions { grid-column: 1 / -1; }
      .tutorial-steps { grid-template-columns: 1fr; }
      .question-actions {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .question-actions .primary-btn {
        grid-column: auto;
        width: auto;
        margin-left: auto;
      }
    }

    /* Four genuinely different visual worlds */
    body,
    .topbar,
    .bottom-nav,
    .setup-card,
    .question-card,
    .card-face {
      transition: color 260ms ease, background-color 260ms ease, border-color 260ms ease, box-shadow 260ms ease;
    }

    .theme-card {
      grid-template-rows: 46px auto 1fr;
      min-height: 140px;
      overflow: hidden;
    }

    .theme-preview {
      position: relative;
      display: block;
      height: 38px;
      margin: -3px -3px 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 11px;
    }

    .theme-preview i {
      position: absolute;
      display: block;
    }

    .theme-preview-midnight {
      background: radial-gradient(circle at 18% 20%, #fb7185 0 3px, transparent 4px), linear-gradient(135deg, #08111f, #1e293b);
      box-shadow: inset 0 0 18px rgba(96, 165, 250, 0.18);
    }

    .theme-preview-midnight i:nth-child(1) { inset: 9px 10px 9px 42%; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; background: rgba(255,255,255,.06); }
    .theme-preview-midnight i:nth-child(2) { left: 13px; bottom: 7px; width: 19px; height: 7px; border-radius: 99px; background: #fb7185; }
    .theme-preview-midnight i:nth-child(3) { top: 7px; right: 8px; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: -16px 3px #a78bfa, -32px -1px #60a5fa; }

    .theme-preview-sunset {
      border-radius: 18px 5px 18px 5px;
      background: linear-gradient(165deg, #3b1023 0 46%, #a9453f 47% 72%, #f0a75d 73%);
    }

    .theme-preview-sunset i:nth-child(1) { right: 11px; bottom: 5px; width: 27px; height: 27px; border-radius: 50%; background: #ffd166; box-shadow: 0 0 18px rgba(255,209,102,.7); }
    .theme-preview-sunset i:nth-child(2) { left: 11px; top: 10px; width: 35%; height: 3px; border-radius: 3px; background: #fff1d6; box-shadow: 0 7px rgba(255,241,214,.55); }
    .theme-preview-sunset i:nth-child(3) { right: 38px; bottom: -9px; width: 43px; height: 22px; border-radius: 50% 50% 0 0; background: #71354a; }

    .theme-preview-cosmic {
      border-radius: 3px;
      background-color: #050113;
      background-image: linear-gradient(rgba(86,231,255,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(86,231,255,.16) 1px, transparent 1px), radial-gradient(circle at 78% 25%, #ff54bd 0 2px, transparent 3px);
      background-size: 9px 9px, 9px 9px, auto;
      box-shadow: inset 0 0 16px rgba(167,119,255,.35);

    .theme-preview-cosmic i:nth-child(1) { inset: 9px 14px 9px 38%; border: 1px solid #56e7ff; background: rgba(23,17,61,.88); box-shadow: 0 0 8px rgba(86,231,255,.7); clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
    .theme-preview-cosmic i:nth-child(2) { left: 10px; bottom: 8px; width: 24px; height: 4px; background: #ff54bd; box-shadow: 0 0 8px #ff54bd; }
    .theme-preview-cosmic i:nth-child(3) { top: 7px; left: 15px; width: 4px; height: 4px; background: #ffe66d; box-shadow: 13px 2px #56e7ff, 5px 8px #a777ff; transform: rotate(45deg); }

    .theme-preview-pastel {
      border-color: rgba(79,91,120,.14);
      border-radius: 15px;
      background: linear-gradient(135deg, #fff7f4, #f8f1ff 52%, #edf8ff);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.6);
    }

    .theme-preview-pastel i:nth-child(1) { top: 7px; left: 9px; width: 24px; height: 24px; border-radius: 9px 14px 12px 14px; background: #ffc4d0; transform: rotate(-9deg); }
    .theme-preview-pastel i:nth-child(2) { right: 9px; bottom: 6px; width: 42%; height: 19px; border-radius: 9px; background: #fff; box-shadow: 0 4px 10px rgba(85,74,112,.13); }
    .theme-preview-pastel i:nth-child(3) { top: 6px; right: 21px; width: 8px; height: 8px; border-radius: 50%; background: #8bdcc1; box-shadow: -15px 9px #a9cff5; }

    /* Midnight Glass — cinematic, rounded, translucent and starry */
    [data-theme="midnight"] body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="midnight"] .ambient-specks span {
      border-color: rgba(248, 250, 252, 0.2);
      border-radius: 35%;
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.12);
    }

    /* Golden Hour — warm editorial typography and organic, sunlit surfaces */
    [data-theme="sunset"] body {
      font-family: "Trebuchet MS", "Avenir Next", Avenir, sans-serif;
      background:
        radial-gradient(ellipse at 50% 112%, rgba(255, 209, 102, 0.42), transparent 36rem),
        radial-gradient(circle at 92% 4%, rgba(255, 152, 100, 0.12), transparent 28rem),
        linear-gradient(158deg, #2a0d1d 0%, #6f2738 48%, #a74640 100%);
    }

    [data-theme="sunset"] body::before {
      opacity: 0.24;
      background-image: radial-gradient(circle, rgba(255, 237, 211, 0.22) 1px, transparent 1.5px);
      background-size: 26px 26px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    [data-theme="sunset"] body::after {
      top: auto;
      right: -90px;
      bottom: -110px;
      width: 330px;
      height: 330px;
      border: 0;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.34), rgba(255, 138, 103, 0.08) 52%, transparent 70%);
      box-shadow: none;
    }

    [data-theme="sunset"] h1,
    [data-theme="sunset"] h2,
    [data-theme="sunset"] h3,
    [data-theme="sunset"] .prompt,
    [data-theme="sunset"] .card-question {

      letter-spacing: -0.035em;
    }

    [data-theme="sunset"] .eyebrow {

    [data-theme="sunset"] .accent-text {

    [data-theme="sunset"] .aurora-blob {

    [data-theme="sunset"] .ambient-specks span {

      transform: rotate(28deg);
    }

    [data-theme="sunset"] .topbar {

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];

        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {

      for (var i = 0; i < rsBlocks.length; i += 1) {

      }

      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {

            index += 1;
          }
        }

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

      mode = mode || 'Byte';

      var newData = null;

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {

        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

        alt = opts.alt;

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

            qrSvg += 'M' + mc + ',' + mr + rect;
          }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);

    _this.createImgTag = function(cellSize, margin, alt) {

      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {

        var c = s.charAt(i);

        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
