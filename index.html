        document.querySelectorAll("[data-session-preset]").forEach((item) => {
          const selected = item.dataset.sessionPreset === "custom";
          item.classList.toggle("selected", selected);
          item.setAttribute("aria-selected", String(selected));
        });
        updatePresetInfo("custom");
      };
      document.querySelectorAll('input[name="question-count"]').forEach((input) => {
        input.addEventListener("change", () => {
          markPresetCustom();
          state.questionCount = Number(input.value);
          document.querySelectorAll("[data-mode-summary]").forEach((summary) => {
            summary.textContent = modeSummary(summary.dataset.modeSummary, state.questionCount);
          });
          playSound("tap");
          saveState();
        });
      });
      document.querySelectorAll('input[name="question-mode"]').forEach((input) => {
        input.addEventListener("change", () => {
          markPresetCustom();
          state.questionMode = input.value;
          playSound("tap");
          saveState();
        });
      });

      const topicInputs = [...document.querySelectorAll('input[name="topics"]')];
      const rememberTopics = () => {
        markPresetCustom();
        state.selectedTopics = topicInputs.filter((input) => input.checked && !input.disabled).map((input) => input.value);
        saveState();
        // The "running low" note follows the packs the couple just picked.
        const note = document.querySelector(".vibe-running-low-slot");
        if (note) note.innerHTML = vibeRunningLow();
      };

      topicInputs.forEach((input) => {
        input.addEventListener("change", () => {
          rememberTopics();
          playSound("tap");
        });
      });

      document.querySelectorAll("[data-topic-preset]").forEach((button) => {
        button.addEventListener("click", () => {
          const preset = button.dataset.topicPreset;
          const values = preset === "classic"
            ? new Set(DEFAULT_TOPICS)
            : preset === "bold"
              ? new Set(["spicy", "money", "politics", "dealbreakers"])
              : preset === "all"
                ? new Set(TOPIC_OPTIONS.map((topic) => topic.id))
                : new Set();
          if (preset === "bold" && !topicInputs.some((input) => !input.disabled && values.has(input.value))) {
            showToast("Bold packs unlock at Spicy or No-filter intensity. Choose one of those first.", { tone: "warning" });
            return;
          }
          topicInputs.forEach((input) => { input.checked = !input.disabled && values.has(input.value); });
          rememberTopics();
          playSound("tap");
        });
      });

      // Navigation and sound triggers are now handled globally in the topbar control center.

      document.querySelectorAll("[data-empty-pack]").forEach((button) => button.addEventListener("click", () => {
        const pack = state.customPacks.find((item) => item.id === button.dataset.emptyPack);
        const hidden = pack && pack.questionIds.some((id) => state.neverQuestionIds.includes(id));
        playSound("error");
        showToast(hidden ? "This pack’s questions are all hidden — allow some again in the Library." : "This pack has no questions yet — favourite some in the Library and save it again.");
      }));
      document.querySelectorAll("[data-start-pack]").forEach((button) => {
        button.addEventListener("click", async () => {
          const pack = state.customPacks.find((item) => item.id === button.dataset.startPack);
          const names = [playerOne.value.trim(), playerTwo.value.trim()];
          if (!pack || names.some((name) => !name)) {
            playSound("error"); error.textContent = "Add both names before starting a custom pack.";
            (names[0] ? playerTwo : playerOne).focus();
            showToast(`Add both names first, then ${POINTER_VERB.toLowerCase()} your pack again.`);
            return;
          }
          const validIds = new Set(getQuestionCatalog().map((question) => question.id));
          const selectedQuestionIds = orderRoundAsRamp(selectFreshQuestionIds(
            pack.questionIds.filter((id) => validIds.has(id) && !state.neverQuestionIds.includes(id)),
            15
          ));
          if (!selectedQuestionIds.length) {
            playSound("error"); error.textContent = "This pack has no available questions yet.";
            return;
          }
          const selectedTopics = [...new Set(selectedQuestionIds.map((id) => getQuestionCatalog().find((question) => question.id === id)?.topic).filter(Boolean))];
          if (!nearbyChannelOpen() && nearbyLinked() && state.nearbyRole === "host") {
            showToast("Reconnecting to the other phone… try again in a moment, or end the link to play here.", { tone: "warning" });
          }
          const sharedRound = nearbyChannelOpen() && state.playStyle === "nearby" && state.nearbyRole === "host";
          const endLink = sharedRound ? () => {} : await confirmEndingLink();
          if (!endLink) return;
          const commitLeave = nearbyLinked() && !sharedRound ? () => {} : await confirmStartingOver();
          if (!commitLeave) return;
          openSensitiveConsent(selectedTopics, () => {
            if (endLink()) names.reverse();
            commitLeave();
            if (state.sessionPreset !== "pack") state.packReturnPreset = state.sessionPreset;
            state.sessionPreset = "pack";
            const before = { topics: [...state.selectedTopics], count: state.questionCount, mode: state.questionMode };
            const restoreSetup = () => { state.selectedTopics = before.topics; state.questionCount = before.count; state.questionMode = before.mode; saveState(); };
            if (sharedRound) {
              startGame({ names, questionMode: "mixed", questionCount: selectedQuestionIds.length, selectedTopics, selectedQuestionIds, playStyle: "nearby" });
              restoreSetup();
              state.activePlayer = 0;
              state.nearbyRole = "host";
              state.nearbyRoundId = newNearbyRoundId();
              saveState();
              nearbyRuntime.roundStarted = true;
              nearbyRuntime.partnerProgress = null;
              sendNearbyMessage(nearbyRoundInitPayload({ newRound: true }));
              return;
            }
            startGame({
              names,
              questionMode: "mixed",
              questionCount: selectedQuestionIds.length,
              selectedTopics,
              selectedQuestionIds
            });
            restoreSetup();
          });
        });
      });

      // Backup data tools are now handled in renderSettings.

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const names = [playerOne.value.trim(), playerTwo.value.trim()];
        const questionMode = form.elements["question-mode"].value;
        const questionCount = Number(form.elements["question-count"].value);
        const selectedTopics = topicInputs.filter((input) => input.checked && !input.disabled).map((input) => input.value);
        if (names.some((name) => !name)) {
          playSound("error"); error.textContent = "Add both names to begin.";
          const nameError = document.getElementById("name-error");
          if (nameError) nameError.textContent = "Add both names to begin.";
          [playerOne, playerTwo].forEach((field) => field.setAttribute("aria-invalid", String(!field.value.trim())));
          (names[0] ? playerTwo : playerOne).focus();
          return;
        }
        if (!selectedTopics.length) {
          playSound("error"); error.textContent = "Choose at least one question pack.";
          window.setTimeout(() => error.scrollIntoView({ block: "center", behavior: motionReduced() ? "auto" : "smooth" }), 450);
          document.querySelector(".topic-picker").scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        const selectedQuestionIds = chooseRoundQuestions(questionMode, questionCount, selectedTopics);
        if (selectedQuestionIds.length !== questionCount) {
          const topicSet = new Set(selectedTopics);
          const hidden = getQuestionCatalog().filter((question) => topicSet.has(question.topic) && (state.neverQuestionIds.includes(question.id) || state.excludedQuestionIds.includes(question.id))).length;
          playSound("error");
          error.textContent = `Only ${selectedQuestionIds.length} question${selectedQuestionIds.length === 1 ? " is" : "s are"} available in these packs${hidden ? ` — ${hidden} ${hidden === 1 ? "is" : "are"} hidden in your Library` : ""}. Add another pack${hidden ? ", allow hidden questions again" : ""} or choose a shorter round.`;
          window.setTimeout(() => error.scrollIntoView({ block: "center", behavior: motionReduced() ? "auto" : "smooth" }), 50);
          return;
        }
        let leaveJoinedRound = false;
        let endLocalLink = () => false;
        let linkWarned = false;
        if (state.playStyle !== "nearby" && nearbyLinked()) {
          const confirmed = await confirmEndingLink();
          if (!confirmed) return;
          endLocalLink = confirmed;
          linkWarned = true;
        }
        if (state.playStyle === "nearby" && state.nearbyRole === "join" && nearbyChannelOpen()) {
          const host = state.names[0] || "your partner";
          const unfinished = revealUnfinished() ? " Your scores haven’t been revealed yet — leaving skips the count-up and its scores go straight to your Journal." : "";
          const leave = await openConfirmDialog({ title: "Leave the two-phone round?", copy: `${host} starts the next two-phone round from their phone.${unfinished} Leave to start your own round here?`, confirmLabel: "Leave and start", cancelLabel: "Stay", safeFirst: true, tag: "link" });
          if (!leave) return;
          leaveJoinedRound = true;
          if (names[1] === state.names[1] && names[0] === state.names[0]) names.reverse();
        }
        const commitLeave = leaveJoinedRound ? () => {} : await confirmStartingOver({ alreadyWarned: linkWarned });
        if (!commitLeave) return;

        openSensitiveConsent(selectedTopics, () => animateRoundSelection(form.querySelector('button[type="submit"]'), () => {
          if (endLocalLink()) names.reverse();
          if (state.sessionPreset === "pack") state.sessionPreset = presetAfterPack();
          if (leaveJoinedRound) {
            if (revealUnfinished()) state.revealCelebrated = state.selectedQuestionIds.join("|");
            closeNearbyConnection({ notifyPartner: true });
            state.nearbyRole = "";
            state.resumeScreen = null;
            showToast(`You’re hosting now — ${names[0]} answers on this phone.`);
          }
          commitLeave();
          // N1: a host still linked to the partner starts the next two-phone round straight away.
          if (state.playStyle === "nearby" && state.nearbyRole === "host" && nearbyChannelOpen()) {
            startGame({ names, questionMode, questionCount, selectedTopics, selectedQuestionIds, playStyle: "nearby" });
            state.activePlayer = 0;
            state.nearbyRole = "host";
            state.nearbyRoundId = newNearbyRoundId();
            saveState();
            nearbyRuntime.roundStarted = true;
            nearbyRuntime.partnerProgress = null;
            sendNearbyMessage(nearbyRoundInitPayload({ newRound: true }));
            return;
          }
          if (state.playStyle === "nearby") {
            state.names = names;
            state.questionMode = questionMode;
            state.questionCount = questionCount;
            state.selectedTopics = [...selectedTopics];
            state.selectedQuestionIds = [...selectedQuestionIds];
            state.screen = "nearby";
            saveState();
            render();
            return;
          }
          startGame({ names, questionMode, questionCount, selectedTopics, selectedQuestionIds });
        }));
      });

      if (!state.tutorialSeen) requestAnimationFrame(openTutorial);
    }

    let lastQuestionAdvanceAt = 0;

    // Some sliders with two vivid ends play as a quick two-card pick (same choice on both phones, by question id).
    function isQuickPickQuestion(question) {
      if (question.type !== "slider" || !Array.isArray(question.labels)) return false;
      if (question.labels.some((label) => !label || label.length > 30)) return false;
      if (question.quickPick === true) return true;
      const hash = [...question.id].reduce((total, character) => (total * 31 + character.charCodeAt(0)) % 9973, 7);
      return hash % 3 === 0;
    }

    function renderQuestion() {
      const questions = getSelectedQuestions();
      const totalQuestions = questions.length;
      const question = questions[state.questionIndex];
      const questionTopic = TOPIC_OPTIONS.find((topic) => topic.id === question.topic);
      const playerName = state.names[state.activePlayer];
      let savedAnswer = state.answers[state.activePlayer][question.id];
      const savedComment = state.comments[state.activePlayer][question.id] || "";
      const savedPrivateNote = state.privateNotes[state.activePlayer][question.id] || "";
      const savedImportance = Number(state.importance[state.activePlayer][question.id] ?? 1);
      const isNotReady = state.notReady[state.activePlayer][question.id] === true;
      const isFavorite = state.favoriteQuestionIds.includes(question.id);

      if (question.type === "slider" && !Number.isFinite(Number(savedAnswer))) savedAnswer = undefined;
      if (question.type === "slider" && savedAnswer !== undefined) savedAnswer = Math.max(1, Math.min(10, Math.round(Number(savedAnswer))));
      const quickPickChosen = savedAnswer !== undefined && savedAnswer !== null;
      if (question.type === "slider" && !quickPickChosen) {
        savedAnswer = 5;
        if (!isQuickPickQuestion(question)) {
          state.answers[state.activePlayer][question.id] = savedAnswer;
          saveState();
        }
      }

      const otherPlayerIndex = state.activePlayer === 0 ? 1 : 0;
      const partnerName = state.names[otherPlayerIndex] || "your partner";
      if (!Array.isArray(state.guesses)) state.guesses = [{}, {}];
      const savedGuess = state.guesses[state.activePlayer]?.[question.id];
      const quickPick = isQuickPickQuestion(question);
      const guessMarkup = question.type === "slider" ? `
          <div class="guess-panel ${savedGuess ? "guessed" : ""}">
            <label class="guess-label" for="guess-input"><span aria-hidden="true">🔮</span> Guess where ${escapeHTML(partnerName)} lands <small>${savedGuess ? `Your guess: ${savedGuess}` : "optional · move it to score mind-reader points"}</small></label>
            <input class="range-input guess-input" id="guess-input" type="range" min="1" max="10" step="1" value="${savedGuess || 5}" style="--range-progress: ${(((savedGuess || 5) - 1) / 9) * 100}%" aria-valuetext="${savedGuess ? `Guess ${savedGuess} out of 10` : "No guess yet"}">
          </div>` : "";
      const inputMarkup = question.type === "text"
        ? `
          <label class="answer-label" for="answer-input">Your answer</label>
          <textarea class="answer-textarea" id="answer-input" maxlength="600" placeholder="Write what feels true to you…" aria-describedby="question-title answer-error">${escapeHTML(savedAnswer || "")}</textarea>
        `
        : `
          ${quickPick ? `<div class="quick-guess ${savedGuess ? "guessed" : ""}" role="group" aria-label="Guess which side ${escapeHTML(partnerName)} picks">
            <span>First, guess ${escapeHTML(partnerName)}’s side <small>optional · then make your own pick below</small></span>
            <button class="quick-guess-option ${savedGuess === 2 ? "active" : ""}" type="button" data-quick-guess="2" aria-pressed="${savedGuess === 2}">🔮 I think ${escapeHTML(partnerName)} picks: ${escapeHTML(question.labels[0])}</button>
            <button class="quick-guess-option ${savedGuess === 9 ? "active" : ""}" type="button" data-quick-guess="9" aria-pressed="${savedGuess === 9}">🔮 I think ${escapeHTML(partnerName)} picks: ${escapeHTML(question.labels[1])}</button>
          </div>
          <div class="quick-pick" role="group" aria-label="Your pick">
            <button class="quick-pick-option ${quickPickChosen && Number(savedAnswer) === 2 ? "active" : ""}" type="button" data-quick-pick="2" aria-pressed="${quickPickChosen && Number(savedAnswer) === 2}"><span aria-hidden="true">◀</span>${escapeHTML(question.labels[0])}</button>
            <button class="quick-pick-option ${quickPickChosen && Number(savedAnswer) === 9 ? "active" : ""}" type="button" data-quick-pick="9" aria-pressed="${quickPickChosen && Number(savedAnswer) === 9}">${escapeHTML(question.labels[1])}<span aria-hidden="true">▶</span></button>
          </div>
          <p class="quick-pick-hint">${POINTER_VERB} a side to move on — open “Add context” first if you want to explain.</p>
          <details class="quick-pick-between"><summary>Somewhere in between?</summary>` : ""}
          <div class="slider-panel">
            <div class="slider-value" id="slider-value" aria-hidden="true">${Number(savedAnswer)}</div>
            <input
              class="range-input"
              id="answer-input"
              type="range"
              min="1"
              max="10"
              step="1"
              value="${Number(savedAnswer)}"
              style="--range-progress: ${((Number(savedAnswer) - 1) / 9) * 100}%"
              aria-label="${escapeHTML(question.prompt)}"
              aria-valuetext="${Number(savedAnswer)} out of 10 (1 = ${escapeHTML(question.labels?.[0] || "Low")}, 10 = ${escapeHTML(question.labels?.[1] || "High")})"
            >
            <div class="range-labels" aria-hidden="true">
              <span>1 · ${escapeHTML(question.labels?.[0] || "Low")}</span>
              <span>${escapeHTML(question.labels?.[1] || "High")} · 10</span>
            </div>
          </div>
          ${quickPick ? "</details>" : ""}
          ${quickPick ? "" : guessMarkup}
          <details class="comment-details" ${savedComment ? "open" : ""}>
            <summary>Add context to your answer <span aria-hidden="true">(optional)</span></summary>
            <textarea class="comment-textarea" id="comment-input" aria-label="Optional context for your answer" maxlength="400" placeholder="${quickPick ? "Why did you pick that side?" : "Why did you choose that number?"}">${escapeHTML(savedComment)}</textarea>
          </details>
        `;

      app.innerHTML = `
        <section class="screen question-screen" aria-labelledby="question-title" style="--question-color:${topicColor(questionTopic?.tone)}">
          <div class="question-header">
            <div>
              <p class="eyebrow">Now answering${roundIntro && state.questionIndex === 0 && state.activePlayer === 0 ? `<span class="round-intro"> · ${roundIntro.split(" · ").map((part) => `<span style="white-space:nowrap">${escapeHTML(part)}</span>`).join(" · ")}</span>` : ""}</p>
              <p class="turn-name">${escapeHTML(playerName)}</p>
            </div>
            <div class="progress-copy">
              <span class="round-mode-copy">${escapeHTML(roundMixSummary(questions))}</span>
              ${state.questionIndex + 1} / ${totalQuestions}
            </div>
          </div>
          <div class="progress-track" aria-label="Question ${state.questionIndex + 1} of ${totalQuestions}">
            <div class="progress-bar" style="width: ${((state.questionIndex + 1) / totalQuestions) * 100}%"></div>
          </div>
          <div class="progress-constellation" aria-hidden="true">
            ${Array.from({ length: totalQuestions }, (_, index) => {
              const status = index < state.questionIndex ? "done" : index === state.questionIndex ? "active" : "";
              return `<span class="progress-star ${status}">${index < state.questionIndex ? "✓" : index === state.questionIndex ? "✦" : "•"}</span>`;
            }).join("")}
          </div>

          <form class="question-card" id="question-form" style="--question-color:${topicColor(questionTopic?.tone)}" novalidate>
            <div class="question-decor" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="question-meta">
              <span class="category-pill" title="${escapeHTML(question.category)}"><span class="category-symbol">${categorySymbol(question.category)}</span>${escapeHTML(question.category)}</span>
              <span class="question-meta-actions">
                <button class="favorite-button ${isFavorite ? "active" : ""}" id="favorite-current" type="button" aria-label="${isFavorite ? "Remove from" : "Add to"} favorites" aria-pressed="${isFavorite}">★</button>
                <span class="type-chip"><span aria-hidden="true">${quickPick ? "⇄" : question.type === "slider" ? "↔" : "✎"}</span>${quickPick ? "Pick a side" : question.type === "slider" ? "Slide your answer" : "Write your answer"}</span>
              </span>
            </div>
            <h2 class="prompt" id="question-title">${escapeHTML(question.prompt)}</h2>
            ${inputMarkup}
            <details class="answer-extras" ${isNotReady || savedPrivateNote || savedImportance !== 1 ? "open" : ""}>
            <summary><span class="summary-title">More options</span> <small>how much it matters · pass · private note</small></summary>
            <div class="importance-panel">
              <strong>How much does this topic matter to you?</strong>
              <div class="importance-options" role="group" aria-label="Importance of this question">
                ${IMPORTANCE_LEVELS.map((level) => `<button class="importance-option ${savedImportance === level.value ? "active" : ""}" type="button" data-importance="${level.value}" aria-pressed="${savedImportance === level.value}">${level.icon} ${level.label}</button>`).join("")}
              </div>
              <button class="secondary-btn not-ready-button ${isNotReady ? "active" : ""}" id="not-ready-answer" type="button" aria-pressed="${isNotReady}">${isNotReady ? "Not ready — this won’t be scored" : "I’m not ready to answer this"}</button>
            </div>
            <details class="private-reflection" ${savedPrivateNote ? "open" : ""}>
              <summary>Private reflection for ${escapeHTML(playerName)}</summary>
              <p class="topic-note">Hidden from the reveal board. Reopen it later from the Results Journal when you have the device.</p>
              <textarea class="private-note-input" id="private-note-input" aria-label="Private reflection, hidden from the reveal board" maxlength="500" placeholder="What do you want to remember about your answer?">${escapeHTML(savedPrivateNote)}</textarea>
            </details>
            </details>
            <p class="error" id="answer-error" role="alert"></p>
            <div class="actions question-actions">
              ${state.questionIndex > 0 ? '<button class="secondary-btn" id="back-question" type="button">Back</button>' : ""}
              ${state.playStyle !== "nearby" && !state.completedPlayers?.[state.activePlayer === 0 ? 1 : 0] ? '<button class="text-btn" id="skip-question" type="button" aria-label="Swap this prompt for a different question">Swap question</button>' : ""}
              <button class="primary-btn" type="submit">${state.questionIndex === totalQuestions - 1 ? "Lock my answers" : "Next question"}</button>
            </div>
          </form>
        </section>
      `;

      const form = document.getElementById("question-form");
      const input = document.getElementById("answer-input");
      const error = document.getElementById("answer-error");
      const guessInput = document.getElementById("guess-input");
      document.querySelectorAll("[data-quick-guess]").forEach((button) => button.addEventListener("click", () => {
        const value = Number(button.dataset.quickGuess);
        const current = state.guesses[state.activePlayer]?.[question.id];
        const next = { ...(state.guesses[state.activePlayer] || {}) };
        if (current === value) delete next[question.id]; else next[question.id] = value;
        state.guesses[state.activePlayer] = next;
        document.querySelectorAll("[data-quick-guess]").forEach((item) => {
          const active = next[question.id] === Number(item.dataset.quickGuess);
          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });
        button.closest(".quick-guess")?.classList.toggle("guessed", question.id in next);
        saveState();
        playSound("tap");
      }));
      // A tap that leaves the thumb on 5 fires no input event, but it is still a deliberate guess.
      guessInput?.addEventListener("change", () => playSound("tap", { value: Number(guessInput.value) }));
      ["change", "pointerup"].forEach((type) => guessInput?.addEventListener(type, () => {
        if (state.guesses[state.activePlayer]?.[question.id] === undefined) {
          guessInput.dispatchEvent(new Event("input"));
          if (type === "pointerup") playSound("tap", { value: Number(guessInput.value) });
        }
      }));
      guessInput?.addEventListener("input", () => {
        const value = Number(guessInput.value);
        state.guesses[state.activePlayer] = { ...(state.guesses[state.activePlayer] || {}), [question.id]: value };
        guessInput.style.setProperty("--range-progress", `${((value - 1) / 9) * 100}%`);
        guessInput.setAttribute("aria-valuetext", `Guess ${value} out of 10`);
        const panel = guessInput.closest(".guess-panel");
        panel?.classList.add("guessed");
        const note = panel?.querySelector("small");
        if (note) note.textContent = `Your guess: ${value}`;
        saveState();
      });
      form.addEventListener("focusin", (event) => {
        if (event.target.matches("textarea, input:not([type=range]), summary")) revealAboveStickyBar(event.target);
      });
      const between = document.querySelector(".quick-pick-between");
      const chooseBetween = () => {
        if (state.answers[state.activePlayer][question.id] === undefined) input.dispatchEvent(new Event("input", { bubbles: true }));
      };
      document.querySelectorAll("#question-form .comment-details, #question-form .answer-extras, #question-form .private-reflection").forEach((details) => details.addEventListener("toggle", () => {
        if (details.open) revealAboveStickyBar(details);
      }));
      between?.addEventListener("toggle", () => {
        if (!between.open) return;
        if (state.answers[state.activePlayer][question.id] === undefined) playSound("tap", { value: Number(input.value) });
        chooseBetween();
        requestAnimationFrame(() => {
          const bar = document.querySelector(".question-actions");
          const barHeight = bar && getComputedStyle(bar).position === "sticky" ? bar.offsetHeight : 0;
          const rect = between.getBoundingClientRect();
          const overflow = rect.bottom - (window.innerHeight - barHeight - 12);
          if (overflow > 0) window.scrollBy({ top: overflow, behavior: motionReduced() ? "auto" : "smooth" });
        });
      });
      if (between) ["change", "pointerup"].forEach((type) => input.addEventListener(type, chooseBetween));
      document.querySelectorAll("[data-quick-pick]").forEach((button) => button.addEventListener("click", () => {
        input.value = button.dataset.quickPick;
        input.dispatchEvent(new Event("input", { bubbles: true }));
        document.querySelectorAll("[data-quick-pick]").forEach((item) => { item.classList.toggle("active", item === button); item.setAttribute("aria-pressed", String(item === button)); });
        playSound("tap");
        const comment = document.getElementById("comment-input");
        const addingMore = document.querySelector("#question-form .comment-details[open], #question-form .answer-extras[open]") || (comment && comment.value.trim());
        const lastQuestion = state.questionIndex >= state.selectedQuestionIds.length - 1;
        if (addingMore || lastQuestion) {
          // Someone explaining their pick keeps the card; on the last question a mis-tap must not lock the answers.
          error.className = "not-ready-note";
          error.textContent = "";
          const hint = document.querySelector(".quick-pick-hint");
          if (hint) { hint.textContent = lastQuestion && !addingMore ? "Side picked — tap Lock my answers when you’re ready." : "Side picked — press Next when you’re done."; hint.setAttribute("role", "status"); }
          revealAboveStickyBar(error);
          return;
        }
        window.setTimeout(() => (form.requestSubmit ? form.requestSubmit() : form.querySelector('button[type="submit"]')?.click()), 260);
      }));

      document.getElementById("favorite-current").addEventListener("click", (event) => {
        const button = event.currentTarget;
        const nowFavorite = !state.favoriteQuestionIds.includes(question.id);
        state.favoriteQuestionIds = nowFavorite
          ? [...new Set([...state.favoriteQuestionIds, question.id])]
          : state.favoriteQuestionIds.filter((id) => id !== question.id);
        button.classList.toggle("active", nowFavorite);
        button.setAttribute("aria-pressed", String(nowFavorite));
        saveState();
        playSound("tap");
      });

      document.getElementById("private-note-input").addEventListener("input", (event) => {
        state.privateNotes[state.activePlayer][question.id] = event.currentTarget.value;
        saveState();
      });

      document.querySelectorAll("[data-importance]").forEach((button) => button.addEventListener("click", () => {
        state.importance[state.activePlayer][question.id] = Number(button.dataset.importance);
        document.querySelectorAll("[data-importance]").forEach((item) => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });
        saveState();
        playSound("tap");
      }));

      document.getElementById("not-ready-answer").addEventListener("click", (event) => {
        const active = !state.notReady[state.activePlayer][question.id];
        state.notReady[state.activePlayer][question.id] = active;
        event.currentTarget.classList.toggle("active", active);
        event.currentTarget.setAttribute("aria-pressed", String(active));
        event.currentTarget.textContent = active ? "Not ready — this won’t be scored" : "I’m not ready to answer this";
        error.className = active ? "not-ready-note" : "error";
        error.textContent = active ? "That’s completely okay. This question will stay private and unscored." : "";
        saveState();
        playSound("tap");
      });

      document.getElementById("skip-question")?.addEventListener("click", () => {
        const unavailable = new Set([...state.selectedQuestionIds, ...state.excludedQuestionIds, ...state.neverQuestionIds]);
        const catalog = getQuestionCatalog();
        const eligibleReplacements = catalog.filter(
          (item) => state.selectedTopics.includes(item.topic) && item.type === question.type && !unavailable.has(item.id)
        );
        const freshestTier = freshestQuestionTier(eligibleReplacements);
        let replacements = freshestTier.filter((item) => item.topic === question.topic);
        if (!replacements.length) replacements = freshestTier;
        if (!replacements.length) {
          playSound("error"); error.textContent = "No replacement question is available for this round.";
          return;
        }
        const replacement = replacements[randomIndex(replacements.length)];
        state.selectedQuestionIds[state.questionIndex] = replacement.id;
        saveState();
        playSound("whoosh");
        render();
      });

      if (question.type === "slider") input.addEventListener("change", () => playSound("tap", { value: Number(input.value) }));
      input.addEventListener("input", () => {
        if (error.textContent && error.className === "error") error.textContent = "";
        const value = question.type === "slider" ? Number(input.value) : input.value;
        state.answers[state.activePlayer][question.id] = value;
        if (state.notReady[state.activePlayer][question.id]) {
          state.notReady[state.activePlayer][question.id] = false;
          document.getElementById("not-ready-answer").classList.remove("active");
          document.getElementById("not-ready-answer").setAttribute("aria-pressed", "false");
          document.getElementById("not-ready-answer").textContent = "I’m not ready to answer this";
        }
        saveState();

        if (question.type === "slider") {
          document.getElementById("slider-value").textContent = input.value;
          input.style.setProperty("--range-progress", `${((Number(input.value) - 1) / 9) * 100}%`);
          input.setAttribute("aria-valuetext", `${input.value} out of 10 (1 = ${question.labels?.[0] || "Low"}, 10 = ${question.labels?.[1] || "High"})`);
        }
      });

      if (question.type === "slider") {
        const commentInput = document.getElementById("comment-input");
        commentInput.addEventListener("input", () => {
          state.comments[state.activePlayer][question.id] = commentInput.value;
          saveState();
        });
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        // A fast double tap must not skip the next (unseen) question.
        if (Date.now() - lastQuestionAdvanceAt < 650) return;
        lastQuestionAdvanceAt = Date.now();
        const value = question.type === "slider" ? Number(input.value) : input.value.trim();
        const notReady = state.notReady[state.activePlayer][question.id] === true;
        if (quickPick && !notReady && state.answers[state.activePlayer][question.id] === undefined) {
          playSound("error"); error.textContent = "Pick a side — or open “Somewhere in between?”";
          revealAboveStickyBar(error);
          document.querySelector("[data-quick-pick]")?.focus();
          return;
        }
        if (question.type === "text" && !value && !notReady) {
          playSound("error"); error.textContent = "Add an answer before continuing.";
          input.focus();
          return;
        }

        if (!notReady) state.answers[state.activePlayer][question.id] = value;
        else delete state.answers[state.activePlayer][question.id];
        const otherPlayer = state.activePlayer === 0 ? 1 : 0;
        if (state.questionIndex < totalQuestions - 1) {
          state.questionIndex += 1;
          roundIntro = "";
          playSound("step", { degree: state.questionIndex, count: totalQuestions });
          if (state.playStyle === "nearby") sendNearbyMessage({ type: "progress", roundId: state.nearbyRoundId, answered: state.questionIndex, total: totalQuestions });
        } else if (state.playStyle === "nearby") {
          state.completedPlayers[state.activePlayer] = true;
          state.screen = "nearby-wait";
          playSound("lock");
          saveState();
          sendNearbyMessage(nearbyPlayerPayload());
          finishNearbyRoundIfReady();
          if (state.screen === "celebration") return;
        } else if (!state.completedPlayers[otherPlayer]) {
          state.completedPlayers[state.activePlayer] = true;
          state.screen = "intermission";
          state.questionIndex = 0;
          playSound("lock");
        } else {
          state.completedPlayers = [true, true];
          state.completedRounds = [...state.completedRounds, createCompletedRoundSnapshot()];
          state.screen = "celebration";
          state.revealedIds = [];
          state.seenIds = [];
          state.answeredQuestionIds = [
            ...new Set([...state.answeredQuestionIds, ...state.selectedQuestionIds])
          ];
          playSound("celebrate");
        }
        saveState();
        render();
      });

      const backButton = document.getElementById("back-question");
      if (backButton) {
        backButton.addEventListener("click", () => {
          state.questionIndex -= 1;
          playSound("tap");
          saveState();
          render();
        });
      }

      if (question.type === "text" && !COARSE_POINTER) input.focus();
    }

    function renderIntermission() {
      const finishedIndex = state.activePlayer;
      const nextIndex = finishedIndex === 0 ? 1 : 0;
      const nextPlayer = state.names[nextIndex];
      const finishedPlayer = state.names[finishedIndex];
      app.innerHTML = `
        <section class="screen lock-screen" aria-labelledby="lock-title">
          <div class="lock-card">
            <div class="lock-icon" aria-hidden="true">♥</div>
            <p class="eyebrow">Answers locked</p>
            <h2 id="lock-title">Pass the device to<br><span class="accent-text">${escapeHTML(nextPlayer)}</span></h2>
            <p class="lock-copy">${escapeHTML(finishedPlayer)}’s answers are safely hidden. When ${escapeHTML(nextPlayer)} has the device, unlock the next turn.</p>
            <div class="pass-visual" aria-hidden="true">
              <span class="pass-person one">${escapeHTML(initials(finishedPlayer))}</span>
              <span class="pass-path"></span>
              <span class="pass-person two">${escapeHTML(initials(nextPlayer))}</span>
            </div>
            <div class="actions lock-actions">
              <button class="primary-btn" id="unlock-turn" type="button">I’m ${escapeHTML(nextPlayer)} — unlock</button>
              <button class="secondary-btn" id="edit-my-answers" type="button">← ${escapeHTML(finishedPlayer)}: change my answers</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById("edit-my-answers").addEventListener("click", () => {
        state.completedPlayers[finishedIndex] = false;
        state.activePlayer = finishedIndex;
        state.questionIndex = Math.max(0, state.selectedQuestionIds.length - 1);
        state.screen = "question";
        saveState();
        playSound("tap");
        render();
      });
      document.getElementById("unlock-turn").addEventListener("click", () => {
        state.activePlayer = nextIndex;
        state.questionIndex = 0;
        state.screen = "question";
        saveState();
        playSound("unlock");
        render();
      });
    }

    function celebrationTeaser() {
      const questions = getSelectedQuestions();
      const matches = questions.filter((question) => !state.notReady[0]?.[question.id] && !state.notReady[1]?.[question.id]
        && question.type === "slider" && revealMatchInfo(question, state.answers[0][question.id], state.answers[1][question.id]).isMatch).length;
      const written = questions.filter((question) => question.type === "text").length;
      const tails = written
        ? [" — and the written answers are still a mystery…", " — plus a few written answers to read aloud…", " — and some words you haven’t heard yet…"]
        : ["…", " — who will be surprised first?", " — ready to find out?"];
      const tail = tails[Math.max(0, roundsPlayedToday() - 1) % tails.length];
      const hidden = matches === 0 ? `Some surprises are waiting in there${tail}` : `${matches === 1 ? "One match is" : `${matches} matches are`} hiding in there${tail}`;
      const explored = coupleAnsweredIds().size;
      const total = getQuestionCatalog().length;
      const progress = roundsPlayedToday() >= 2 && total ? ` You’ve explored ${explored} of ${total} questions together.` : "";
      return `${hidden} Sit together and flip the cards at your own pace.${progress}`;
    }

    function celebrationHeadline() {
      const round = roundsPlayedToday();
      const preset = state.sessionPreset;
      if (round <= 1) return `You both showed up <span class="accent-text">honestly.</span>`;
      const today = new Date().toDateString();
      const earlier = state.completedRounds.filter(isTonightRound).slice(0, -1);
      const best = earlier.reduce((top, item) => Math.max(top, Number(item.alignment?.overall) || 0), 0);
      const roundKey = state.selectedQuestionIds.join("|");
      const vibeLine = {
        "spicy-night": `Spicy round complete <span class="accent-text">🔥</span>`,
        "road-trip": earlier.some((item) => item.preset === "road-trip") ? `Another lap of the <span class="accent-text">road trip.</span>` : `First lap of the <span class="accent-text">road trip.</span>`,
        "deep-dive": `That was a deep one — <span class="accent-text">well done.</span>`,
        "date-night": earlier.some((item) => item.preset === "date-night") ? `Date night, round ${round} — <span class="accent-text">still sweet.</span>` : `Date night begins — <span class="accent-text">sweet start.</span>`,
        "check-in": `Check-in done — <span class="accent-text">nicely caught up.</span>`,
        pack: earlier.some((item) => item.preset === "pack") ? `Your own pack, round ${round} — <span class="accent-text">made for you two.</span>` : `Your own pack — <span class="accent-text">made for you two.</span>`
      }[preset];
      const firstOfVibe = vibeLine && !earlier.some((item) => item.preset === preset);
      const seenBefore = new Set(state.completedRounds.filter(sameCouple).slice(0, -1).flatMap((item) => item.questionIds || []));
      const mostlyNew = state.selectedQuestionIds.filter((id) => !seenBefore.has(id)).length * 2 >= state.selectedQuestionIds.length;
      const lines = [
        ["vibe", vibeLine],
        ["roll", `Round ${round} — <span class="accent-text">you’re on a roll.</span>`],
        ["another", `Another round, <span class="accent-text">another few surprises.</span>`],
        ["best", best ? `Tonight’s best is ${best}% — <span class="accent-text">can this one beat it?</span>` : ""],
        ["finding", mostlyNew ? `Round ${round} — <span class="accent-text">still finding new things.</span>` : `Round ${round} — <span class="accent-text">old favourites, new answers.</span>`],
        ["locked", `Round ${round} locked in. <span class="accent-text">Ready?</span>`]
      ].filter(([, text]) => text);
      // Stored values come from storage or imports: only an exact match with a built-in template is reused.
      if (state.headlineFor?.key === roundKey && lines.some(([, text]) => text === state.headlineFor.text)) return state.headlineFor.text;
      const recentHeadlines = Array.isArray(state.recentHeadlines) ? state.recentHeadlines : [];
      const fresh = lines.filter(([id]) => !recentHeadlines.includes(id));
      const [id, text] = firstOfVibe ? ["vibe", vibeLine] : fresh[round % Math.max(1, fresh.length)] || lines.find(([lineId]) => lineId === "finding");
      state.headlineFor = { key: roundKey, text };
      state.recentHeadlines = [...recentHeadlines.filter((line) => line !== id), id].slice(-5);
      saveState();
      return text;
    }

    function renderCelebration() {
      app.innerHTML = `
        <section class="screen celebration-screen" aria-labelledby="celebration-title">
          <div class="celebration-card">
            <div class="celebration-orb" aria-hidden="true">♡</div>
            <p class="eyebrow">Answers complete</p>
            <h2 id="celebration-title">${celebrationHeadline()}</h2>
            <p class="lock-copy">${celebrationTeaser()}</p>
            <div class="actions lock-actions">
              <button class="primary-btn" id="open-reveal-board" type="button">Open the reveal board</button>
            </div>
          </div>
        </section>
      `;
      requestAnimationFrame(() => burstConfetti(document.querySelector(".celebration-orb"), 14));
      document.getElementById("open-reveal-board").addEventListener("click", () => {
        state.screen = "reveal";
        saveState();
        playSound("open");
        render();
      });
    }

    function importanceMarkup(question) {
      const labels = state.importance.map((values, player) => {
        const level = IMPORTANCE_LEVELS.find((item) => item.value === Number(values?.[question.id] ?? 1)) || IMPORTANCE_LEVELS[1];
        return `<span><strong>${escapeHTML(state.names[player])}</strong> · ${level.icon} ${level.label}</span>`;
      }).join("");
      return `<div class="comparison-legend" aria-label="How important this topic feels">${labels}</div>`;
    }

    function notReadyReveal(question) {
      const players = state.notReady.map((values, index) => values?.[question.id] ? state.names[index] : "").filter(Boolean);
      return `<div class="difference-panel" style="--match-color:var(--violet);--match-percent:0%"><div class="difference-topline"><span class="difference-label">♡ Answer held privately</span><span class="difference-score">Not scored</span></div><p class="topic-note" style="margin-top:9px">${escapeHTML(players.join(" and "))} chose not to answer yet. Curiosity can wait until everyone feels ready.</p></div>${importanceMarkup(question)}`;
    }

    function followThroughMarkup(question) {
      const status = state.conversationStatus[question.id] || "";
      const escapedQuestionId = escapeHTML(question.id);
      return `
        <details class="card-more" ${status ? "open" : ""}>
        <summary><span class="summary-title">Save for later</span> <small>next steps · how much it matters · rate the question</small></summary>
        ${importanceMarkup(question)}
        <div class="follow-through">
          <strong>What should happen next?</strong>
          <div class="follow-through-actions">
            ${[["talk", "Talk about this"], ["ground", "Found common ground"], ["revisit", "Revisit later"], ["intention", "Create an intention"]].map(([value, label]) => `<button class="follow-through-button ${status === value ? "active" : ""}" type="button" data-follow-through="${value}" data-follow-question="${escapedQuestionId}">${label}</button>`).join("")}
          </div>
          ${status === "intention" ? `<input class="custom-input intention-input" data-intention-input="${escapedQuestionId}" maxlength="180" placeholder="One small thing we want to do together…" value="${escapeHTML(state.sharedIntentions.find((item) => item.questionId === question.id)?.text || "")}">` : ""}
          <details class="feedback-menu" style="margin-top:10px"><summary>Rate this question itself</summary><div class="feedback-actions">${[["valuable", "Especially valuable"], ["uncomfortable", "Uncomfortable"], ["rewrite", "Poorly worded"]].map(([value, label]) => `<button class="question-library-action ${(state.questionFlags[question.id] || []).includes(value) ? "active" : ""}" type="button" data-reveal-flag="${value}" data-flag-question="${escapedQuestionId}">${label}</button>`).join("")}</div></details>
        </div>
        </details>
      `;
    }

    function guessHit(question, playerIndex) {
      if (state.notReady?.[0]?.[question.id] || state.notReady?.[1]?.[question.id]) return null;
      const guess = state.guesses?.[playerIndex]?.[question.id];
      const actual = Number(state.answers?.[playerIndex === 0 ? 1 : 0]?.[question.id]);
      if (typeof guess !== "number" || !Number.isFinite(actual)) return null;
      if (isQuickPickQuestion(question)) {
        const sameSide = (guess <= 5) === (actual <= 5);
        return { guess, actual, distance: sameSide ? 0 : 7, hit: sameSide, side: true };
      }
      return { guess, actual, distance: Math.abs(guess - actual), hit: Math.abs(guess - actual) <= 1 };
    }

    // Quick picks are shown by the side someone chose, never as a number nobody saw.
    function pickLabel(question, value) {
      const number = Number(value);
      if (!isQuickPickQuestion(question) || !Number.isFinite(number)) return null;
      if (number === 2) return question.labels[0];
      if (number === 9) return question.labels[1];
      return null;
    }

    function guessRevealMarkup(question) {
      const lines = [0, 1].map((player) => {
        const result = guessHit(question, player);
        if (!result) return "";
        const other = state.names[player === 0 ? 1 : 0];
        if (result.side) {
          const side = result.guess <= 5 ? question.labels[0] : question.labels[1];
          return `<span class="guess-line ${result.hit ? "hit" : ""}">🔮 ${escapeHTML(state.names[player])} guessed ${escapeHTML(other)} would pick “${escapeHTML(side)}” · ${result.hit ? "read them right ★" : "not this time"}</span>`;
        }
        const verdict = result.distance === 0 ? "nailed it ★" : result.hit ? "within 1 — mind reader!" : `off\u00a0by\u00a0${result.distance}`;
        return `<span class="guess-line ${result.hit ? "hit" : ""}">🔮 ${escapeHTML(state.names[player])} guessed ${escapeHTML(other)} would say ${result.guess} · ${verdict}</span>`;
      }).filter(Boolean);
      return lines.length ? `<div class="guess-results">${lines.join("")}</div>` : "";
    }

    function mindReaderHeadline(tally) {
      const players = tally.filter((item) => item.made);
      const rate = (item) => item.hits / item.made;
      if (players.length === 2 && players[0].hits === players[1].hits) {
        return players[0].hits ? `A tie — you each read ${players[0].hits === 1 ? "one" : players[0].hits} right` : "No mind reading this round — plenty left to learn!";
      }
      const best = [...players].sort((a, b) => b.hits - a.hits || rate(b) - rate(a))[0];
      if (!best.hits) return "No mind reading this round — plenty left to learn!";
      const name = escapeHTML(state.names[best.player]);
      if (rate(best) >= 0.8 && best.made >= 2) return `👑 ${name} is this round’s mind reader — ${best.hits} of ${best.made}!`;
      if (rate(best) < 0.5) return `${name} edges it — ${best.hits} of ${best.made}. Plenty left to learn!`;
      return `${name} is this round’s mind reader — ${best.hits} of ${best.made}!`;
    }

    function mindReaderTally(questions) {
      return [0, 1].map((player) => {
        const results = questions.map((question) => guessHit(question, player)).filter(Boolean);
        return { player, made: results.length, hits: results.filter((result) => result.hit).length };
      });
    }

    function quickPickReveal(question, firstAnswer, secondAnswer) {
      const sides = [0, 1].map((side) => {
        const value = side === 0 ? 2 : 9;
        const names = [0, 1].filter((player) => Number(player === 0 ? firstAnswer : secondAnswer) === value);
        return `<div class="pick-side ${names.length ? "chosen" : ""}">
          <span class="pick-label">${side === 0 ? "◀ " : ""}${escapeHTML(question.labels[side])}${side === 1 ? " ▶" : ""}</span>
          <span class="pick-names">${names.map((player) => `<span class="pick-name" style="--player-color: var(${player === 0 ? "--blue" : "--green"})">${escapeHTML(state.names[player])}</span>`).join("") || "<span class=\"pick-empty\">—</span>"}</span>
        </div>`;
      }).join("");
      const same = Number(firstAnswer) === Number(secondAnswer);
      return `<div class="pick-reveal">${sides}</div>
        <p class="pick-verdict ${same ? "same" : "split"}">${same ? "★ Same side" : "Split decision!"}</p>`;
    }

    function sliderReveal(question, firstAnswer, secondAnswer, matchInfo) {
      const p1 = ((Number(firstAnswer) - 1) / 9) * 100;
      const p2 = ((Number(secondAnswer) - 1) / 9) * 100;
      const nudge = Math.abs(p1 - p2) < 8 ? 2 : 0;
      const firstComment = String(state.comments[0][question.id] || "").trim();
      const secondComment = String(state.comments[1][question.id] || "").trim();
      const commentsMarkup = firstComment || secondComment
        ? `
          <div class="slider-comments">
            ${firstComment ? `<div class="slider-comment" style="--player-color: var(--blue)"><strong>${escapeHTML(state.names[0])}</strong><br>${escapeHTML(firstComment)}</div>` : ""}
            ${secondComment ? `<div class="slider-comment" style="--player-color: var(--green)"><strong>${escapeHTML(state.names[1])}</strong><br>${escapeHTML(secondComment)}</div>` : ""}
          </div>
        `
        : "";
      if (pickLabel(question, firstAnswer) && pickLabel(question, secondAnswer)) {
        return `<div class="comparison-wrap">${quickPickReveal(question, firstAnswer, secondAnswer)}${guessRevealMarkup(question)}${commentsMarkup}</div>`;
      }
      return `
        <div class="comparison-wrap">
          <div class="comparison-scale">
            <span>1 · ${escapeHTML(question.labels?.[0] || "Low")}</span>
            <span>${escapeHTML(question.labels?.[1] || "High")} · 10</span>
          </div>
          <div class="comparison-track" style="--p1-pos: ${p1}%; --p2-pos: ${p2}%">
            <div class="comparison-gap" aria-hidden="true"></div>
            <div class="marker marker-one" style="--marker-pos: ${p1}%; --marker-color: var(--blue); --marker-offset: -${nudge}px" aria-hidden="true">
              <span class="marker-value">${sliderDisplay(firstAnswer)}</span>
            </div>
            <div class="marker marker-two" style="--marker-pos: ${p2}%; --marker-color: var(--green); --marker-offset: ${nudge}px" aria-hidden="true">
              <span class="marker-value">${sliderDisplay(secondAnswer)}</span>
            </div>
          </div>
          <div class="comparison-legend">
            <span class="legend-item"><span class="legend-dot" style="--dot-color: var(--blue)"></span>${escapeHTML(state.names[0])}: ${sliderDisplay(firstAnswer)}</span>
            <span class="legend-item"><span class="legend-dot" style="--dot-color: var(--green)"></span>${escapeHTML(state.names[1])}: ${sliderDisplay(secondAnswer)}</span>
          </div>
          ${differenceMarkup(matchInfo, question)}
          ${guessRevealMarkup(question, firstAnswer, secondAnswer)}
          ${commentsMarkup}
        </div>
      `;
    }

    function textReveal(question, firstAnswer, secondAnswer, matchInfo, beforeRating = "") {
      const escapedQuestionId = escapeHTML(question.id);
      const ratings = [
        ["aligned", "Aligned", "#4ade80"],
        ["nuanced", "Similar + nuance", "#86efac"],
        ["discuss", "Worth discussing", "#fbbf24"],
        ["different", "Very different", "#fb7185"]
      ];
      const rating = state.textRatings[question.id];
      return `
        <div class="answer-stack">
          <div class="answer-box" style="--player-color: var(--blue)">
            <span class="answer-name">${escapeHTML(state.names[0])}</span>
            <p class="answer-copy">${escapeHTML(firstAnswer)}</p>
          </div>
          <div class="answer-box" style="--player-color: var(--green)">
            <span class="answer-name">${escapeHTML(state.names[1])}</span>
            <p class="answer-copy">${escapeHTML(secondAnswer)}</p>
          </div>
        </div>
        ${beforeRating}
        <div class="alignment-rating ${rating ? "rated" : "unrated"}">
          <strong>${rating ? "You rated this together" : "Now rate them together"}</strong>
          <div class="rating-options">
            ${ratings.map(([value, label, color]) => `<button class="rating-option ${rating === value ? "active" : ""}" style="--rating-color:${color}" type="button" data-text-rating="${value}" data-rating-question="${escapedQuestionId}">${label}</button>`).join("")}
          </div>
        </div>
        ${differenceMarkup(matchInfo, question)}
      `;
    }

    // usedPrompts is shared across one board so no follow-up repeats within a round.
    // A card keeps its prompt once shown (unless its tier changes), a tier that runs out borrows from
    // its neighbour, and prompts seen in recent rounds come last so returning couples hear new lines.
    const GAG_FAMILIES = [["trailer", /movie trailer|movie-trailer|movie title/i], ["show", /talent show|game show/i], ["title", /one-word title|dramatic .*title/i], ["act", /\bact (?:out|it out)\b|ten seconds/i], ["voice", /sports commentator|announcer|nature.documentary|narrat/i],
      ["song", /\bsong\b/i], ["swap", /\bswap\b|\bfor (?:a|one) day\b|one-day/i], ["highfive", /high five/i], ["snack", /\bsnack/i]];
    function promptGagFamilies(text) {
      return GAG_FAMILIES.filter(([, pattern]) => pattern.test(String(text))).map(([name]) => name);
    }

    function discussionPromptMarkup(question, matchInfo, usedPrompts = new Set()) {
      const tier = matchInfo.unrated ? "unrated" : matchInfo.percent >= 75 ? "close" : matchInfo.percent >= 40 ? "medium" : "far";
      // Written answers have no "sides", so a big difference there uses the warm wording.
      const spicyPlayful = question.topic === "spicy" && !SENSITIVE_SPICY.test(question.id) && questionTone(question) !== "deep";
      const tone = spicyPlayful ? (question.type === "text" ? "flirtyText" : "flirty") : question.topic === "spicy" ? "gentle" : questionTone(question) === "light" ? (question.type === "text" ? "lightText" : "light") : "warm";
      if (!state.cardPrompts || typeof state.cardPrompts !== "object") state.cardPrompts = {};
      const key = `${tier}:${tone}`;
      const kept = state.cardPrompts[question.id];
      const earlierGags = new Set([...usedPrompts].flatMap(promptGagFamilies));
      let chosen = kept && kept.key === key && typeof kept.text === "string" && !usedPrompts.has(kept.text)
        && !promptGagFamilies(kept.text).some((family) => earlierGags.has(family)) ? kept.text : "";
      if (!chosen) {
        // Same tier first, least recently used first; borrow only from a tier that still fits the card.
        const fitting = { close: ["close"], medium: ["medium"], far: ["far", "medium"] };
        const unratedPools = ["light", "lightText"].includes(tone) ? [DISCUSSION_PROMPTS.unratedLight, DISCUSSION_PROMPTS.unrated]
          : ["flirty", "flirtyText"].includes(tone) ? [DISCUSSION_PROMPTS.unratedFlirty, DISCUSSION_PROMPTS.unrated] : [DISCUSSION_PROMPTS.unrated];
        let pools = tier === "unrated" ? unratedPools : fitting[tier].map((name) => DISCUSSION_PROMPTS[tone][name]);
        const cardIndex = state.selectedQuestionIds.indexOf(question.id);
        const softNight = state.sessionPreset === "date-night" || state.questionIntensity === "cozy";
        // Every other warm match on a soft night gets one of the playful celebration lines.
        if (softNight && tone === "warm" && tier === "close" && cardIndex % 2 === 1) pools = [PLAYFUL_WARM_CLOSE, ...pools];
        if (state.questionIntensity === "cozy" && tone === "warm" && tier === "far") pools = [DISCUSSION_PROMPTS.cozyFar, DISCUSSION_PROMPTS.warm.medium];
        const recentList = Array.isArray(state.recentPrompts) ? state.recentPrompts : [];
        const gagFamilies = promptGagFamilies;
        // Lines already showing on this round's other cards count as used, whichever order the cards were rated in.
        const otherLines = Object.entries(state.cardPrompts).filter(([id, value]) => id !== question.id && state.selectedQuestionIds.includes(id) && typeof value?.text === "string").map(([, value]) => value.text);
        const takenLines = new Set([...usedPrompts, ...otherLines]);
        const usedGags = new Set([...takenLines].flatMap(gagFamilies));
        // First dates skip follow-ups that assume a shared past.
        const historySafe = (text) => state.questionIntensity !== "cozy" || !(HISTORY_PROMPT_PATTERN.test(text) || /\blast notice|\bled you both\b|\bin each other\b|\bpets?\b|\bnoticed? you\b|\brecently\b/i.test(text));
        const seed = [...question.id].reduce((total, character) => total + character.charCodeAt(0), 0);
        const age = (text) => recentList.lastIndexOf(text);
        const rankPool = (prompts) => prompts.map((_, index) => prompts[(seed + index) % prompts.length])
          .filter((text) => !takenLines.has(text) && historySafe(text) && !gagFamilies(text).some((family) => usedGags.has(family)))
          .sort((a, b) => age(a) - age(b));
        const recentlyUsed = new Set(recentList);
        const rankedPools = pools.map(rankPool);
        const ownFirst = rankedPools.find((list) => list.length) || [];
        const playfulFirst = [DISCUSSION_PROMPTS.unratedLight, DISCUSSION_PROMPTS.unratedFlirty, PLAYFUL_WARM_CLOSE].includes(pools[0])
          || ["light", "lightText", "flirty", "flirtyText"].includes(tone);
        chosen = (playfulFirst ? rankedPools[0]?.find((text) => !recentlyUsed.has(text)) || rankedPools[0]?.[0] : null)
          || rankedPools.map((list) => list.find((text) => !recentlyUsed.has(text))).find(Boolean) || ownFirst[0]
          || pools.flat().find((text) => !usedPrompts.has(text))
          || pools[0][0];
        state.cardPrompts[question.id] = { key, text: chosen };
        state.recentPrompts = [...(Array.isArray(state.recentPrompts) ? state.recentPrompts : []).filter((text) => text !== chosen), chosen].slice(-400);
      }
      usedPrompts.add(chosen);
      return `
        <div class="discussion-card">
          <strong>${tier === "unrated" ? "Before you rate" : "Keep the conversation going"}</strong>
          <p>${escapeHTML(chosen)}</p>
        </div>
      `;
    }

    // Progress is one-way: a card counts once it has been face up, and unlocked scores stay unlocked.
    function cardSeen(id) {
      return state.revealedIds.includes(id) || (Array.isArray(state.seenIds) && state.seenIds.includes(id))
        || state.revealCelebrated === state.selectedQuestionIds.join("|");
    }

    // From the second round of an evening, the dashboard links tonight's rounds together.
    function tonightLine() {
      const today = new Date().toDateString();
      // The current round counts once its scores are being shown (the line is rebuilt at unlock).
      const rounds = state.completedRounds.filter((round) => isTonightRound(round) && (!roundScoresHidden(round) || revealUnlockedNow()));
      if (rounds.length < 2) return "";
      const latest = state.completedRounds[state.completedRounds.length - 1];
      const scoreOf = (round) => (round === latest ? calculateAlignmentSummary(getSelectedQuestions().filter(Boolean)).overall : Number(round.alignment?.overall) || 0);
      const best = rounds.reduce((top, round, index) => scoreOf(round) > top.score ? { score: scoreOf(round), index } : top, { score: -1, index: 0 });
      const current = rounds.length;
      return `<p class="tonight-line">Tonight: round ${current}${best.index === current - 1 ? ` · your best sync so far (${best.score}%) 🎉` : ` · best so far: round ${best.index + 1} (${best.score}%)`}</p>`;
    }

    function revealUnlockedNow() {
      const questions = getSelectedQuestions().filter(Boolean);
      return questions.length > 0 && questions.every((question) => cardSeen(question.id)) && !unratedWrittenIds(questions).length;
    }

    function revealProgressCopy(questions) {
      const revealed = questions.filter((question) => cardSeen(question.id)).length;
      const pending = unratedWrittenIds(questions).length;
      return `${revealed} of ${questions.length} revealed${pending ? ` · ${pending} to rate` : ""}`;
    }

    function scoreLockHint(questions) {
      const everyCardUp = questions.every((question) => cardSeen(question.id));
      const pending = unratedWrittenIds(questions).length;
      if (everyCardUp && pending) return `Rate ${pending === 1 ? "the last written answer" : `${pending} written answers`} together to unlock how in sync you are.`;
      return "Flip every card to unlock how in sync you are.";
    }

    function renderReveal() {
      const questions = getSelectedQuestions();
      const alignment = calculateAlignmentSummary(questions);
      const alignmentCopy = alignmentDescriptor(alignment.overall);
      const overallColor = alignmentColor(alignment.overall);
      const topicAlignmentCards = alignment.topics.filter((item) => item.count >= 2).map((item) => {
        const topic = TOPIC_OPTIONS.find((option) => option.id === item.topic);
        return `
          <div class="topic-alignment-card">
            ${alignmentRingMarkup(item.score, "similar")}
            <span class="topic-alignment-name"><span class="nowrap">${topic?.icon || "•"} ${escapeHTML(topic?.label || item.topic)}</span> <span class="nowrap">· ${item.fitScore}% fit · ${item.count}Q</span></span>
          </div>
        `;
      }).join("");
      const matchInfoById = new Map();
      const scoredHighlights = questions.filter((question) => !state.notReady[0]?.[question.id] && !state.notReady[1]?.[question.id]).map((question) => ({
        question,
        match: revealMatchInfo(question, state.answers[0][question.id], state.answers[1][question.id]),
        importance: Math.max(Number(state.importance[0]?.[question.id] ?? 1), Number(state.importance[1]?.[question.id] ?? 1))
      }));
      // Each highlight names a different question; a highlight is left empty rather than repeating one.
      const comparable = scoredHighlights.filter((item) => !item.match.missing && !item.match.unrated);
      const pendingRatings = unratedWrittenIds(questions);
      const everyCardUp = questions.length > 0 && questions.every((question) => cardSeen(question.id));
      const allRevealed = everyCardUp && !pendingRatings.length;
      const tally = mindReaderTally(questions);
      const highlightAnswers = (item) => {
        if (!item) return "";
        const [first, second] = [state.answers[0][item.question.id], state.answers[1][item.question.id]];
        const short = (value) => {
          const text = item.question.type === "slider" ? (pickLabel(item.question, value) || sliderMeaning(item.question, value)) : String(value ?? "").trim();
          // Slider meanings are short labels; only free-text answers are trimmed (at a word boundary).
          if (item.question.type === "slider" || text.length <= 42) return text;
          const cut = text.slice(0, 40);
          return `${cut.slice(0, cut.lastIndexOf(" ") > 24 ? cut.lastIndexOf(" ") : 40)}…`;
        };
        return `<span class="highlight-answers"><span style="--player-color: var(--blue)">${escapeHTML(state.names[0])}: ${escapeHTML(short(first))}</span><span style="--player-color: var(--green)">${escapeHTML(state.names[1])}: ${escapeHTML(short(second))}</span></span>`;
      };
      const highlightCard = (title, item, empty, note = "", tease = "") => `<article class="highlight-card">
        <span>${title}</span>
        <strong class="highlight-answer">${item ? `<button class="highlight-jump" type="button" data-jump-card="${escapeHTML(item.question.id)}">${escapeHTML(item.question.prompt)}</button>${highlightAnswers(item)}${note ? `<small class="highlight-note">${escapeHTML(note)}</small>` : ""}` : escapeHTML(empty)}</strong>
        <strong class="highlight-locked">${tease ? `${escapeHTML(tease)} ` : ""}<small>${everyCardUp ? "Rate the written answers to unlock" : "Flip every card to unlock"}</small></strong>
      </article>`;
      const closestHighlight = [...comparable].sort((a, b) => b.match.percent - a.match.percent)[0];
      // Two slider answers either side of the middle aren't a "match", however close the numbers are.
      const oppositeSides = (item) => item.question.type === "slider"
        && (Number(state.answers[0][item.question.id]) - 5.5) * (Number(state.answers[1][item.question.id]) - 5.5) < 0;
      const biggestMiss = (item) => Math.max(...[0, 1].map((player) => guessHit(item.question, player)?.distance ?? -1));
      // The best surprise is a confident guess that missed; otherwise the widest gap.
      const guessSurprise = [...comparable].filter((item) => item !== closestHighlight && biggestMiss(item) >= 3).sort((a, b) => biggestMiss(b) - biggestMiss(a))[0];
      // A gap both partners predicted correctly is no surprise, so it never stands in for one.
      const bothReadIt = (item) => [0, 1].every((player) => guessHit(item.question, player)?.distance === 0);
      const surpriseHighlight = guessSurprise || [...comparable].filter((item) => item !== closestHighlight && !bothReadIt(item) && item.match.percent < (closestHighlight?.match.percent ?? 101)).sort((a, b) => a.match.percent - b.match.percent)[0];
      const surpriseNote = (() => {
        // A written answer standing in as the surprise says why: the couple's own rating.
        if (!guessSurprise && surpriseHighlight?.question.type === "text") {
          const label = { discuss: "Worth discussing", different: "Very different", nuanced: "Similar + nuance" }[state.textRatings[surpriseHighlight.question.id]];
          return label ? `You rated this “${label}”.` : "";
        }
        if (!guessSurprise || surpriseHighlight !== guessSurprise) return "";
        const player = [0, 1].sort((a, b) => (guessHit(guessSurprise.question, b)?.distance ?? -1) - (guessHit(guessSurprise.question, a)?.distance ?? -1))[0];
        const result = guessHit(guessSurprise.question, player);
        const other = state.names[player === 0 ? 1 : 0];
        const shown = (value) => (pickLabel(guessSurprise.question, value) ? `“${pickLabel(guessSurprise.question, value)}”` : guessSurprise.question.type === "slider" ? `${value} (${sliderMeaning(guessSurprise.question, value).replace(/^\d+ · /, "")})` : value);
        return `${state.names[player]} guessed ${shown(result.guess)} — ${other} said ${shown(result.actual)}.`;
      })();
      const talkWeight = (item) => {
        const rating = state.textRatings[item.question.id];
        const hasComment = [0, 1].some((player) => String(state.comments[player]?.[item.question.id] || "").trim());
        return (rating === "different" ? 3 : rating === "discuss" ? 2.5 : 1) * item.importance * (hasComment ? 1.4 : 1) * (100 - item.match.percent);
      };
      const realTalkingPoint = (item) => item.match.percent < 75 || ["discuss", "different"].includes(state.textRatings[item.question.id]) || [0, 1].some((player) => String(state.comments[player]?.[item.question.id] || "").trim());
      const conversationHighlight = [...comparable].filter((item) => item !== closestHighlight && item !== surpriseHighlight && realTalkingPoint(item) && !isQuickPickQuestion(item.question)).sort((a, b) => talkWeight(b) - talkWeight(a))[0]
        || [...comparable].filter((item) => item !== closestHighlight && item !== surpriseHighlight && (item.match.percent < 75 || ["discuss", "different"].includes(state.textRatings[item.question.id]))).sort((a, b) => a.match.percent - b.match.percent)[0];
      const usedPrompts = new Set();
      const cards = questions.map((question, index) => {
        const isFlipped = state.revealedIds.includes(question.id);
        const escapedQuestionId = escapeHTML(question.id);
        const firstAnswer = state.answers[0][question.id];
        const secondAnswer = state.answers[1][question.id];
        const answerHeld = state.notReady[0]?.[question.id] || state.notReady[1]?.[question.id];
        const matchInfo = answerHeld
          ? { isMatch: false, exact: false, percent: 0, gap: 0, label: "Not scored", color: "#a78bfa" }
          : revealMatchInfo(question, firstAnswer, secondAnswer);
        matchInfoById.set(question.id, matchInfo);
        const answers = answerHeld
          ? notReadyReveal(question)
          : question.type === "slider"
          ? sliderReveal(question, firstAnswer, secondAnswer, matchInfo)
          : textReveal(question, firstAnswer, secondAnswer, matchInfo, matchInfo.unrated ? discussionPromptMarkup(question, matchInfo, usedPrompts) : "");

        return `
          <article
            class="flip-card${isFlipped ? " flipped" : ""}"
            data-question-id="${escapedQuestionId}"
          >
            <div class="flip-card-inner">
              <button
                class="card-face card-front"
                type="button"
                aria-expanded="${isFlipped}"
                aria-controls="answer-card-${escapedQuestionId}"
                aria-label="Reveal answers for question ${index + 1}"
                aria-hidden="${isFlipped}"
                ${isFlipped ? "inert" : ""}
              >
                <span>
                  <span class="card-number"><span class="card-spark">${categorySymbol(question.category)}</span>${escapeHTML(question.category)} <span class="card-number-tail">${index + 1} of ${questions.length}</span></span>
                  <span class="card-question">${escapeHTML(question.prompt)}</span>
                </span>
                <span class="tap-hint">${POINTER_VERB} to reveal</span>
                <span class="card-pair" aria-hidden="true"><span></span><span></span></span>
              </button>
              <div
                class="card-face card-back ${!answerHeld && matchInfo.isMatch ? "match-card" : ""}"
                id="answer-card-${escapedQuestionId}"
                role="region"
                aria-label="Answers for question ${index + 1}"
                aria-hidden="${!isFlipped}"
                ${isFlipped ? "" : "inert"}
              >
                <span class="card-number"><span class="card-spark">${categorySymbol(question.category)}</span>${escapeHTML(question.category)} <span class="card-number-tail">Your answers</span></span>
                <span class="card-question">${escapeHTML(question.prompt)}</span>
                ${!answerHeld && matchInfo.isMatch && !(pickLabel(question, firstAnswer) && pickLabel(question, secondAnswer)) ? `<span class="match-badge"><span class="match-star" aria-hidden="true">★</span>${matchInfo.exact ? "Exact match" : "Close match"}</span>` : ""}
                ${answers}
                ${answerHeld ? `<div class="discussion-card"><strong>Gentle next step</strong><p>Would revisiting this later feel supportive, or is leaving it unanswered the right boundary?</p></div>` : matchInfo.unrated && question.type === "text" ? "" : discussionPromptMarkup(question, matchInfo, usedPrompts)}
                ${followThroughMarkup(question)}
                <div class="card-back-actions">
                  <button class="tap-hint card-close-button" type="button">${POINTER_VERB} to close</button>
                  ${index < questions.length - 1 ? `<button class="secondary-btn next-card-button" type="button" data-next-card="${index + 1}">Next card →</button>` : ""}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      app.innerHTML = `
        <section class="screen reveal-screen" aria-labelledby="reveal-title">
          <div class="reveal-heading">
            <div>
              <div class="reveal-buddies" aria-hidden="true">
                <span class="reveal-buddy one">${escapeHTML(initials(state.names[0]))}</span>
                <span class="reveal-buddy two">${escapeHTML(initials(state.names[1]))}</span>
              </div>
              <p class="eyebrow">The reveal board</p>
              <h2 id="reveal-title">Compare, connect, <span class="accent-text">talk.</span></h2>
              <p class="lede">${POINTER_VERB} each card when you’re ready. Your scores unlock when every card has been face up and the written answers are rated.</p>
              <div class="reveal-progress" aria-live="polite"><span class="reveal-count" id="reveal-count">${revealProgressCopy(questions)}</span><span class="reveal-dots" aria-hidden="true">${questions.map((question) => `<span class="reveal-dot ${cardSeen(question.id) ? "on" : ""}" data-dot="${escapeHTML(question.id)}"></span>`).join("")}</span></div>
            </div>
            <button class="secondary-btn reveal-all-btn" id="reveal-all" type="button"><span aria-hidden="true">✦</span><span>${state.revealedIds.length === questions.length ? "Hide all" : "Reveal all"}</span></button>
          </div>
          <div class="reveal-grid">${cards}</div>
          <section class="alignment-dashboard ${allRevealed ? "" : "locked"}" id="alignment-dashboard" style="--overall-color: ${overallColor}" aria-label="Your scores">
            <div class="score-lock" aria-hidden="${allRevealed}"><span aria-hidden="true">✦</span><strong>Your scores are hiding</strong><small id="score-lock-hint">${scoreLockHint(questions)}</small><button class="secondary-btn rate-next-btn" id="rate-next" type="button" ${everyCardUp && pendingRatings.length ? "" : "hidden"}>Rate the next one →</button></div>
            <div class="dual-score-dashboard" ${allRevealed ? "" : 'aria-hidden="true" inert'}>
              <div class="overall-alignment">
                ${alignmentRingMarkup(alignment.overall, "similar")}
                <div class="alignment-summary-copy">
                  <p class="eyebrow">Answer similarity</p>
                  <h3 id="alignment-title">${alignmentCopy.title}</h3>
                  <p class="score-explainer">How close the answers were, without judging whether a difference matters.</p>
                </div>
              </div>
              <div class="overall-alignment">
                ${alignmentRingMarkup(alignment.fitOverall, "fit")}
                <div class="alignment-summary-copy">
                  <p class="eyebrow">Relationship fit</p>
                  <h3>${fitDescriptor(alignment.fitOverall).title}</h3>
                  <p class="score-explainer">Adjusts each difference by how important the topic felt to either person.</p>
                </div>
              </div>
            </div>
            ${allRevealed ? tonightLine() : ""}
            ${topicAlignmentCards ? `<details class="topic-alignment-area" ${window.innerWidth > 600 ? "open" : ""} ${allRevealed ? "" : 'aria-hidden="true" inert'}>
              <summary class="topic-alignment-title">Alignment by question pack</summary>
              <div class="topic-alignment-grid">${topicAlignmentCards}</div>
              <div class="alignment-legend"><span>Less aligned</span><span class="heat-gradient"></span><span>More aligned</span></div>
            </details>` : ""}
          </section>
          <section class="highlight-grid ${allRevealed ? "" : "locked"}" aria-label="Round highlights" id="round-highlights">
            ${highlightCard(closestHighlight && (closestHighlight.match.percent < 60 || oppositeSides(closestHighlight)) ? "Nearest common ground" : "Closest match", closestHighlight, "Complete more scored answers to unlock this highlight.", "", closestHighlight && (closestHighlight.match.percent < 60 || oppositeSides(closestHighlight)) ? "Your nearest common ground is waiting…" : "One answer lines up beautifully…")}
            ${highlightCard(surpriseNote && surpriseHighlight?.match.isMatch ? "Biggest misread 🔮" : "Biggest surprise", surpriseHighlight, "No big surprises this round.", surpriseNote, guessSurprise ? "Someone is in for a surprise…" : surpriseHighlight ? "The widest gap is waiting…" : "Will anything surprise you?")}
            ${conversationHighlight ? highlightCard("Best conversation starter", conversationHighlight, "", "", "There is a story waiting in one card…") : ""}
            ${tally.some((item) => item.made) ? `<article class="highlight-card mind-reader"><span>🔮 Mind-reader</span><strong class="highlight-answer">${mindReaderHeadline(tally)}<small class="highlight-note">${tally.filter((item) => item.made).map((item) => `${escapeHTML(state.names[item.player])} read ${escapeHTML(state.names[item.player === 0 ? 1 : 0])} ${item.hits}/${item.made}`).join(" · ")}</small></strong><strong class="highlight-locked">${tally.some((item) => item.hits) ? "Someone read the other’s mind… " : "Did anyone read minds tonight? "}<small>${everyCardUp ? "Rate the written answers to unlock" : "Flip every card to unlock"}</small></strong></article>` : ""}
          </section>
          <div class="actions reveal-actions">
            ${state.playStyle === "nearby" && state.nearbyRole === "join" && nearbyChannelOpen()
